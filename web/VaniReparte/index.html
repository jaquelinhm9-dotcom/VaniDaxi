<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06110f"><title>VaniReparte</title><style>:root{--p:#12cf8d;--p2:#22e7a5;--bg:#06110f}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:#fff}.app{max-width:520px;min-height:100vh;margin:auto;background:#f7f7fa;color:#17131d;padding-bottom:80px}.top{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #eee;padding:11px 15px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px;font-weight:1000;font-size:20px}.logo{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#087e5a,#20e7a1);display:grid;place-items:center;color:#fff;font-weight:1000}.brand span{background:linear-gradient(90deg,#16121a 40%,#12cf8d 58%,#22e7a5);-webkit-background-clip:text;color:transparent}.wrap{padding:14px 16px}.search{background:#f0eef3;border-radius:15px;padding:12px;display:flex;gap:8px}.search input{border:0;background:transparent;outline:0;flex:1}.hero{margin-top:12px;background:linear-gradient(135deg,#5a1dff,#9236ff 55%,#eb44d8);border-radius:25px;padding:20px;min-height:205px;position:relative;overflow:hidden;color:#fff}.hero h1{font-size:30px;max-width:245px;line-height:1.04}.bag{position:absolute;right:28px;bottom:25px;width:84px;height:78px;background:#101017;border-radius:22px}.bag:after{content:"V";display:grid;place-items:center;height:100%;color:#c84cff;font-weight:1000;font-size:40px}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 0 9px}.cats,.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.grid{grid-template-columns:1fr 1fr}.cat{border:0;background:none;color:#221c28;text-align:center}.dot{background:#eeeaf2;border-radius:15px;padding:15px 5px;font-size:22px}.product{background:#fff;border-radius:20px;overflow:hidden;border:1px solid #ece7f0}.photo{height:145px;background:#f1edf5;display:grid;place-items:center;font-size:48px}.body{padding:11px}.body h3{min-height:35px;font-size:14px}.price{font-size:18px;font-weight:1000}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900}.primary{background:linear-gradient(90deg,#6b24ff,#c03de8);color:#fff}.dark{background:#19131f;color:#fff}.full{width:100%}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #e1dce5;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}.grow{flex:1}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #e5e0e8;display:grid;grid-template-columns:repeat(5,1fr);z-index:5;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.nav{border:0;background:none;color:#817888;font-size:9px}.nav b{display:block;font-size:18px}.active{color:#7224ff}.auth{min-height:100vh;background:radial-gradient(circle at 50% -10%,#4d176c,#180e23 40%,#06110f 72%);padding:28px 18px}.auth .logo{width:82px;height:82px;margin:auto;font-size:40px}.auth h1{text-align:center;font-size:34px;color:#fff}.auth p{text-align:center;color:#c8bfd0}.authCard{background:#120d1d;border:1px solid #39284a;border-radius:23px;padding:16px;color:#fff;margin-top:24px}.input{width:100%;padding:12px;border:1px solid #3b2b4a;background:#0f0a16;color:#fff;border-radius:13px}.label{font-size:10px;font-weight:900;display:block;margin:11px 0 6px}.socials{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.social{border:1px solid #3b2b4a;background:#17101f;color:#fff;border-radius:13px;padding:10px;font-weight:900}.promo{display:grid;gap:8px;margin-top:12px}.promo div{background:#120d1d;border:1px solid #39284a;border-radius:16px;padding:12px;color:#fff}.modal{position:fixed;inset:0;background:#050307b8;display:none;align-items:flex-end;z-index:20}.on{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px}.close{float:right}.small{font-size:11px;color:#777}</style></head><body><div id="app" class="app"></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><script src="app-config.js"></script><script src="supabase-client.js"></script><script>
const A=VaniAPI,$=s=>document.querySelector(s);let user=null,page="home",online=false,route=false;function auth(){app.innerHTML='<div class="auth"><div class="logo">V</div><h1>Vani<span style="color:#31eca9">Reparte</span></h1><p>Tu esfuerzo también mueve el mundo</p><div class="authCard"><h2>Iniciar sesión</h2><label class="label">Correo</label><input id="e" class="input"><label class="label">Contraseña</label><input id="p" class="input" type="password"><button class="btn primary full" style="margin-top:12px" onclick="login()">Iniciar sesión</button><button class="btn full" style="margin-top:8px;background:#fff" onclick="demo()">Crear cuenta</button><div style="text-align:center;color:#81958e;font-size:10px;margin:14px">O continúa con</div><div class="socials"><button class="social">G</button><button class="social">f</button><button class="social"></button><button class="social">☎</button></div><button class="btn secondary full" style="margin-top:10px" onclick="demo()">Ver demostración</button></div></div>'}function login(){if(A.demo){user={name:"Repartidor demo",email:$("#e").value||"demo@vanireparte.local"};render();return}A.auth.signIn($("#e").value,$("#p").value).then(()=>A.auth.me()).then(u=>{user=u;render()}).catch(e=>alert(e.message))}function demo(){user={name:"Repartidor demo",email:"demo@vanireparte.local"};render()}function nav(){return '<div class="bottom"><button class="nav '+(page=="home"?"active":"")+'" onclick="go(\'home\')"><b>⌂</b>Inicio</button><button class="nav '+(page=="orders"?"active":"")+'" onclick="go(\'orders\')"><b>▣</b>Pedidos</button><button class="nav '+(page=="map"?"active":"")+'" onclick="go(\'map\')"><b>⌖</b>Mapa</button><button class="nav '+(page=="profile"?"active":"")+'" onclick="go(\'profile\')"><b>◉</b>Perfil</button></div>'}function top(){return '<div class="top"><div class="brand"><div class="logo">V</div><span>VaniReparte</span></div><div>♢ ⚙</div></div>'}function home(){return top()+'<div class="wrap"><div class="hero"><div>VaniReparte · COLABORACIÓN</div><h1>Tu esfuerzo también mueve el mundo</h1><p>Acepta ofertas, sigue rutas y confirma entregas.</p><button class="btn" style="margin-top:14px;background:#fff;color:#087e5a" onclick="online=!online;render()">'+(online?"Disponible":"Activar disponibilidad")+'</button><div class="scooter"></div></div><div class="stats"><div class="stat">Estado<b style="color:'+(online?"#087e5a":"#16201d")+'">'+(online?"En línea":"Fuera de línea")+'</b></div><div class="stat">Entregas<b>0</b></div><div class="stat">Calificación<b>—</b></div></div><div class="section"><h2>Nuevas ofertas</h2></div><div class="list"><div class="offer"><span class="pill">Nueva oferta</span><h3>Tienda La Esquina</h3><div class="small">3.2 km · recoger → 1.8 km · entregar</div><div class="row"><b class="pay">$48.00</b><div class="grow"></div><button class="btn primary" onclick="accept()">Aceptar</button></div></div><div class="offer"><span class="pill">Nueva oferta</span><h3>Casa Bella</h3><div class="small">2.1 km · recoger → 3.4 km · entregar</div><div class="row"><b class="pay">$65.00</b><div class="grow"></div><button class="btn primary" onclick="accept()">Aceptar</button></div></div></div></div>'+nav()}function accept(){if(!online){alert("Activa disponibilidad primero");return}route=true;go("map")}function orders(){return top()+'<div class="wrap"><h2>Pedidos y rutas</h2><div class="item"><div class="grow"><b>Ruta VR-208</b><div class="small">2 paquetes · aceptada</div></div><b>$48.00</b></div></div>'+nav()}function mapPage(){return top()+'<div class="wrap"><h2>Mapa y ruta</h2>'+(route?'<div class="map"><div class="line"></div><div class="pin" style="left:18px;top:45px">A</div><div class="pin" style="left:47%;top:120px">B</div><div class="pin" style="right:18px;bottom:40px">C</div></div><div class="item" style="margin-top:10px"><span class="grow">Ruta VR-208 · 2 paquetes</span><b>$48.00</b></div><button class="btn primary full" style="margin-top:10px" onclick="alert(\'GPS y eventos de entrega se conectarán al backend\')">Iniciar ruta</button>':'<div class="card"><h3>No hay ruta activa</h3><div class="small">Acepta una oferta para verla aquí.</div></div>')+'</div>'+nav()}function profile(){return top()+'<div class="wrap"><div class="item"><div class="logo">V</div><div class="grow"><b>'+user.name+'</b><div class="small">'+user.email+'</div></div></div><h2>Perfil de colaboración</h2><div class="item">🪪 <span class="grow">CURP</span>›</div><div class="item">🛵 <span class="grow">Vehículo</span>›</div><div class="item">💬 <span class="grow">Soporte</span>›</div><button class="btn dark full" style="margin-top:12px" onclick="user=null;auth()">Cerrar sesión</button></div>'+nav()}function go(p){page=p;render()}function render(){if(!user)return auth();app.innerHTML=page=="home"?home():page=="orders"?orders():page=="map"?mapPage():profile()}render();</script></body></html>
