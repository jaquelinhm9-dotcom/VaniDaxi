<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073d34">
<title>VaniReparte</title>
<style>
:root{--dark:#073d34;--green:#12b77e;--mint:#29d2a1;--bg:#f7f6f1;--ink:#10253f;--muted:#717c8d;--line:#e4e6ea;--card:#fff;--shadow:0 9px 26px rgba(18,43,47,.08);--red:#cb4451}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:540px;min-height:100vh;margin:auto;padding-bottom:86px;background:var(--bg)}
.top{position:sticky;top:0;z-index:10;background:rgba(247,246,241,.96);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.v{width:41px;height:41px;border-radius:13px;background:linear-gradient(145deg,#0b765d,#14b997 65%,#40d8a6);display:grid;place-items:center;color:#fff;font-size:23px;font-weight:1000}.brand b{font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.top button{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#fff}.page{padding:18px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.11em;color:#8b95a6}.title{font-size:32px;line-height:1.02;margin:5px 0 12px;letter-spacing:-.5px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px}.hero{background:linear-gradient(145deg,#06372f,#0c5a4c);color:#fff;border:0}.hero h1{font-size:34px;margin:10px 0}.hero p{color:#d3e8e1}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:900}.primary{background:linear-gradient(135deg,var(--green),var(--mint));color:#05372e}.secondary{background:#edf2f3;color:var(--dark)}.outline{background:#fff;color:var(--dark);border:1px solid #ced6db}.danger{background:#fff0f2;color:var(--red)}.full{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{font-size:27px;font-weight:900}.muted{color:var(--muted)}.small{font-size:11px}.badge{display:inline-flex;padding:7px 9px;border-radius:999px;background:#eef0f3;color:#657084;font-size:10px;font-weight:900}.badge.green{background:#e6f7f0;color:#087951}.badge.red{background:#fff0f2;color:var(--red)}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.list{display:grid;gap:9px}.item{padding:13px;border:1px solid var(--line);background:#fff;border-radius:16px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:20}.nav{background:none;border:0;color:#7c8795;font-size:9px}.nav b{display:block;font-size:18px}.nav.active{color:var(--green);font-weight:900}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0}.label{display:block;font-size:11px;font-weight:900;margin:10px 0 6px}.modal{position:fixed;inset:0;background:#082b258c;display:none;align-items:end;z-index:50}.modal.show{display:flex}.sheet{width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:18px}.close{float:right;border:0;background:#f1f3f5;width:35px;height:35px;border-radius:11px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#16352f;color:#fff;padding:11px 14px;border-radius:12px;z-index:70;display:none;font-size:12px}.toast.show{display:block}.map{height:235px;border-radius:20px;background:linear-gradient(32deg,transparent 0 46%,#fff 46% 48%,transparent 48%),linear-gradient(145deg,transparent 0 43%,#fff 43% 45%,transparent 45%),#ecebe5;position:relative;overflow:hidden}.pin{position:absolute;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:900}.p1{left:14%;top:58%}.p2{left:47%;top:37%}.p3{left:75%;top:20%}
</style></head>
<body><div id="app" class="app"></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<script src="app-config.js"></script><script src="supabase-client.js"></script>
<script>
const C=window.VaniCore,app=document.getElementById('app'),te=document.getElementById('toast');let user=null,profile=null,courier=null,page='home',packages=[],routes=[],activeRoute=null,routeStops=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(m){te.textContent=m;te.classList.add('show');setTimeout(()=>te.classList.remove('show'),2200)}function money(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2})}function top(){return '<div class="top"><div class="brand"><span class="v">V</span><div><b>VaniReparte</b><small>Tu ruta, tu ritmo</small></div></div><button onclick="logout()">↪</button></div>'}function bottom(){return '<div class="bottom"><button class="nav '+(page==='home'?'active':'')+'" onclick="go(\'home\')"><b>⌂</b>Inicio</button><button class="nav '+(page==='packages'?'active':'')+'" onclick="go(\'packages\')"><b>📦</b>Paquetes</button><button class="nav '+(page==='route'?'active':'')+'" onclick="go(\'route\')"><b>🧭</b>Ruta</button><button class="nav '+(page==='profile'?'active':'')+'" onclick="go(\'profile\')"><b>◉</b>Perfil</button></div>}function go(p){page=p;render()}
function openModal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function auth(){app.innerHTML='<div class="page" style="padding-top:44px"><div class="hero card"><span class="badge" style="background:#ffffff18;color:#fff">Colaboradores VaniReparte</span><h1>Más pedidos.<br>Más oportunidades.</h1><p>Regístrate para recibir y gestionar rutas cuando tu cuenta esté activa.</p></div><div class="card" style="margin-top:12px"><h2>Iniciar sesión</h2><label class="label">Correo</label><input id="e" class="input" type="email"><label class="label">Contraseña</label><input id="p" class="input" type="password"><button class="btn primary full" style="margin-top:14px" onclick="login()">Entrar</button><button class="btn outline full" style="margin-top:9px" onclick="registerCourier()">Crear cuenta de repartidor</button></div></div>'}
async function login(){try{await C.signIn($('#e').value.trim(),$('#p').value);await boot();toast('Sesión iniciada')}catch(e){toast(e.message||'No se pudo iniciar sesión')}}
function registerCourier(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Registro de repartidor</h2><p class="small muted">VaniReparte es una colaboración independiente. Tu cuenta podrá quedar pendiente de verificación.</p><label class="label">Nombre completo</label><input id="rn" class="input"><label class="label">Teléfono</label><input id="rt" class="input" type="tel"><label class="label">Correo</label><input id="re" class="input" type="email"><label class="label">Contraseña</label><input id="rp" class="input" type="password"><label class="row" style="margin-top:11px"><input id="rc" type="checkbox"> <span class="small">Acepto los términos de colaboración.</span></label><button class="btn primary full" style="margin-top:13px" onclick="createCourier()">Crear cuenta</button>')}
async function createCourier(){try{if(!$('#rc').checked)throw Error('Debes aceptar los términos.');const n=$('#rn').value.trim(),e=$('#re').value.trim(),p=$('#rp').value,ph=$('#rt').value.trim();if(!n||!e||p.length<8)throw Error('Completa los datos y usa una contraseña de 8 caracteres o más.');const now=new Date().toISOString();await C.signUp(e,p,{account_type:'courier',onboarding_role:'courier',name:n,display_name:n,phone:ph,terms_accepted_at:now,terms_version:'v1.0'});if(!C.session())await C.signIn(e,p);closeModal();await boot();toast('Cuenta creada');}catch(e){toast(e.message||'No se pudo crear la cuenta')}}
async function boot(){user=await C.me();profile=user?await C.profile():null;if(!user||!profile){C.signOut();auth();return}if(profile.role!=='courier'){C.signOut();toast('Esta aplicación es para cuentas de repartidor.');auth();return}const rows=await C.table.list('courier_profiles','user_id,status,full_name,curp,date_of_birth,phone,email,address,emergency_contact,vehicle_type,vehicle_make,vehicle_model,vehicle_year,vehicle_color,vehicle_plates,license_number,verification_level,rating,completed_deliveries,availability,last_location',{user_id:'eq.'+user.id});courier=rows[0]||null;await loadData();render()}
async function loadData(){packages=await C.table.list('package_requests','id,order_id,pickup_mode,status,pickup_address,pickup_window_start,pickup_window_end,ready_at,package_count,weight_kg,dimensions,seller_notes',{status:['eq.awaiting_pickup','eq.ready']}).catch(async()=>await C.table.list('package_requests','id,order_id,pickup_mode,status,pickup_address,pickup_window_start,pickup_window_end,ready_at,package_count,weight_kg,dimensions,seller_notes')).catch(()=>[]);routes=await C.table.list('delivery_routes','id,status,total_packages,pickup_stops,delivery_stops,total_distance_km,estimated_minutes,total_pay,route_score,accepted_at,completed_at,created_at',{courier_id:'eq.'+user.id},'order=created_at.desc').catch(()=>[]);activeRoute=routes.find(r=>['accepted','collecting','delivering','in_progress'].includes(r.status))||null;if(activeRoute)routeStops=await C.table.list('delivery_route_stops','id,sequence_no,stop_type,order_id,package_request_id,address,status,pickup_pin_verified,delivery_pin_verified,window_start,window_end',{route_id:'eq.'+activeRoute.id},'order=sequence_no.asc').catch(()=>[]);else routeStops=[]}
function home(){if(!courier)return '<div class="page"><div class="card empty">No se encontró tu perfil de repartidor.</div></div>';const active=courier.status==='active';return top()+'<div class="page"><div class="eyebrow">DISPONIBILIDAD</div><div class="row"><h1 class="title">Listo para repartir</h1><span class="badge '+(active?'green':'red')+'">'+(active?'Cuenta activa':'Pendiente')+'</span></div>'+(!active?'<div class="card" style="margin-bottom:12px"><b>Tu cuenta aún no está activa.</b><p class="small muted">Completa tu perfil y espera la verificación administrativa. No se mostrarán rutas que no puedas aceptar.</p><button class="btn secondary" onclick="go(\'profile\')">Completar perfil</button></div>':'')+'<div class="card"><div class="row"><div class="grow"><b>Disponibilidad</b><div class="small muted">Solo recibirás rutas cuando te pongas disponible.</div></div><span class="badge '+(courier.availability?'green':'')+'">'+(courier.availability?'DISPONIBLE':'NO DISPONIBLE')+'</span></div><button class="btn '+(courier.availability?'secondary':'primary')+' full" style="margin-top:13px" '+(active?'':'disabled')+' onclick="toggleAvailability()">'+(courier.availability?'Desactivar disponibilidad':'Activarme para recibir rutas')+'</button></div><div class="card" style="margin-top:12px"><div class="row"><div class="grow"><h2 style="margin:0">Ubicación y ruta</h2><div class="small muted">La ubicación se usará para rutas reales cuando exista asignación.</div></div></div><div class="map" style="margin-top:12px"><span class="pin p1">1</span><span class="pin p2">2</span><span class="pin p3">3</span></div></div><div class="grid2" style="margin-top:12px"><div class="card"><div class="small muted">Paquetes disponibles</div><div class="stat">'+packages.length+'</div></div><div class="card"><div class="small muted">Ruta activa</div><div class="stat">'+(activeRoute?activeRoute.total_packages||0:0)+'</div></div></div></div>'+bottom()}
async function toggleAvailability(){try{await C.table.update('courier_profiles',{availability:!courier.availability},{user_id:'eq.'+user.id});await boot();toast(courier.availability?'Ahora estás disponible':'Disponibilidad desactivada')}catch(e){toast(e.message||'No se pudo actualizar')}}
function packagesPage(){return top()+'<div class="page"><div class="eyebrow">OPORTUNIDADES</div><h1 class="title">Paquetes disponibles</h1><div class="small muted" style="margin-bottom:13px">Solo aparecen solicitudes reales creadas por vendedores.</div>'+(packages.length?'<div class="list">'+packages.map(p=>'<div class="item"><div class="row"><div class="grow"><b>'+esc(p.id.slice(0,8))+'</b><div class="small muted">'+esc(p.status)+' · '+Number(p.package_count||1)+' paquete(s)</div></div><span class="badge green">'+esc(p.pickup_mode||'recolección')+'</span></div><div class="small" style="margin-top:8px">Salida: '+esc((p.pickup_address||{}).city||'Ubicación indicada por el vendedor')+'</div><div class="small muted">'+(p.ready_at?new Date(p.ready_at).toLocaleString('es-MX'):'Sin hora definida')+'</div></div>').join('')+'</div>':'<div class="card empty"><div style="font-size:48px">📦</div><h3>No hay paquetes disponibles</h3><p class="muted">Los paquetes aparecerán cuando haya pedidos y solicitudes de logística reales.</p></div>')+'</div>'+bottom()}
function routePage(){return top()+'<div class="page"><div class="eyebrow">RUTA</div><h1 class="title">'+(activeRoute?'Ruta activa':'Sin ruta activa')+'</h1>'+(activeRoute?'<div class="card hero"><div class="row"><div class="grow"><span class="badge" style="background:#ffffff18;color:#fff">'+esc(activeRoute.status)+'</span><h2 style="margin:9px 0;color:#fff">'+Number(activeRoute.total_packages||0)+' paquetes</h2><p>'+Number(activeRoute.total_distance_km||0)+' km · '+Number(activeRoute.estimated_minutes||0)+' min estimados</p></div><b style="font-size:25px;color:#fff">'+money(activeRoute.total_pay)+'</b></div></div><div class="list" style="margin-top:12px">'+(routeStops.length?routeStops.map(s=>'<div class="item"><div class="row"><div class="grow"><b>Punto '+s.sequence_no+' · '+esc(s.stop_type)+'</b><div class="small muted">'+esc(s.status)+'</div></div><button class="btn secondary" onclick="confirmStop(\''+s.id+'\',\''+s.order_id+'\',\''+s.stop_type+'\',\''+s.package_request_id+'\')">'+(s.stop_type==='pickup'?'Confirmar recolección':'Confirmar entrega')+'</button></div></div>').join(''):'<div class="card empty">No hay paradas registradas para esta ruta.</div>')+'</div>':'<div class="card empty"><div style="font-size:48px">🧭</div><h3>Cuando exista una ruta aceptada aparecerá aquí</h3><p class="muted">La app no mostrará datos inventados.</p></div>')+'</div>'+bottom()}
function confirmStop(stopId,orderId,kind,pkgId){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Confirmar '+(kind==='pickup'?'recolección':'entrega')+'</h2><p class="small muted">Introduce el PIN de 4 dígitos del '+(kind==='pickup'?'vendedor':'comprador')+'.</p><input id="pin" class="input" inputmode="numeric" maxlength="4"><button class="btn primary full" style="margin-top:12px" onclick="sendEvent(\''+stopId+'\',\''+orderId+'\',\''+kind+'\',\''+pkgId+'\')">Confirmar</button>')}
async function sendEvent(stopId,orderId,kind,pkgId){try{const code=$('#pin').value.trim();if(!/^\d{4}$/.test(code))throw Error('PIN de 4 dígitos requerido.');const event=kind==='pickup'?'pickup_confirmed':'delivery_confirmed';await C.rpc('record_courier_delivery_event',{p_courier_id:user.id,p_event_type:event,p_route_id:activeRoute.id,p_route_stop_id:stopId,p_order_id:orderId,p_package_request_id:pkgId,p_code:code,p_metadata:{app:'VaniReparte'}});closeModal();await boot();toast(kind==='pickup'?'Recolección confirmada':'Entrega confirmada')}catch(e){toast(e.message||'No se pudo confirmar')}}
function profilePage(){return top()+'<div class="page"><div class="card"><div class="row"><div class="v">V</div><div class="grow"><h2 style="margin:0">'+esc(courier?.full_name||profile.full_name||'Repartidor')+'</h2><div class="small muted">'+esc(user.email||'')+'</div></div><span class="badge '+(courier?.status==='active'?'green':'red')+'">'+esc(courier?.status||'draft')+'</span></div></div><div class="section"><h2>Datos de colaboración</h2></div><div class="card"><label class="label">CURP</label><input id="cp_curp" class="input" value="'+esc(courier?.curp||'')+'"><label class="label">Fecha de nacimiento</label><input id="cp_dob" class="input" type="date" value="'+esc(courier?.date_of_birth||'')+'"><label class="label">Dirección</label><textarea id="cp_addr" class="input" rows="3">'+esc(courier?.address||'')+'</textarea><label class="label">Contacto de emergencia</label><input id="cp_em" class="input" value="'+esc(courier?.emergency_contact||'')+'"><label class="label">Tipo de vehículo</label><select id="cp_v" class="input"><option value="">Selecciona</option><option>Motocicleta</option><option>Automóvil</option><option>Bicicleta</option><option>Otro</option></select><label class="label">Marca / modelo / año</label><input id="cp_vm" class="input" value="'+esc([courier?.vehicle_make,courier?.vehicle_model,courier?.vehicle_year].filter(Boolean).join(' '))+'"><label class="label">Placas</label><input id="cp_pl" class="input" value="'+esc(courier?.vehicle_plates||'')+'"><label class="label">Licencia</label><input id="cp_li" class="input" value="'+esc(courier?.license_number||'')+'"><button class="btn primary full" style="margin-top:14px" onclick="saveProfile()">Guardar perfil</button></div><div class="section"><h2>Resumen</h2></div><div class="grid2"><div class="card"><div class="small muted">Entregas</div><div class="stat">'+Number(courier?.completed_deliveries||0)+'</div></div><div class="card"><div class="small muted">Calificación</div><div class="stat">'+(courier?.rating?Number(courier.rating).toFixed(1):'—')+'</div></div></div></div>'+bottom()}
async function saveProfile(){try{const vm=$('#cp_vm').value.trim().split(' ');await C.table.update('courier_profiles',{curp:$('#cp_curp').value.trim(),date_of_birth:$('#cp_dob').value||null,address:$('#cp_addr').value.trim(),emergency_contact:$('#cp_em').value.trim(),vehicle_type:$('#cp_v').value||null,vehicle_make:vm[0]||null,vehicle_model:vm.slice(1,-1).join(' ')||null,vehicle_year:vm.length?Number(vm.at(-1))||null:null,vehicle_plates:$('#cp_pl').value.trim(),license_number:$('#cp_li').value.trim(),updated_at:new Date().toISOString()},{user_id:'eq.'+user.id});await boot();toast('Perfil guardado')}catch(e){toast(e.message||'No se pudo guardar')}}
async function logout(){C.signOut();user=null;profile=null;courier=null;auth()}
function render(){if(!user){auth();return}if(page==='home')app.innerHTML=home();else if(page==='packages')app.innerHTML=packagesPage();else if(page==='route')app.innerHTML=routePage();else app.innerHTML=profilePage()}
(async()=>{try{await boot()}catch(e){C.signOut();auth();toast('No se pudo conectar con VaniReparte')}})();
</script></body></html>
