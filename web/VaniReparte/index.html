<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06110f"><title>VaniReparte</title><style>
:root{--bg:#06110f;--card:#0b1715;--green:#15d89a;--muted:#99b1a9;--line:#1d342e;--red:#ff6179}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#06110f,#081613);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#fff}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:90px}.shell{padding:0 16px 110px}.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:rgba(6,17,15,.92);backdrop-filter:blur(18px);border-bottom:1px solid #1b2b27}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:1000}.mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(145deg,#087e5a,#20e7a1);display:grid;place-items:center;color:#052017;font-weight:1000}.brand span{background:linear-gradient(90deg,#fff 45%,#2be9ab);-webkit-background-clip:text;background-clip:text;color:transparent}.top-actions{display:flex;gap:8px}.icon-btn{width:38px;height:38px;border-radius:12px;background:#0d1c18;color:#fff;border:1px solid var(--line)}.hero{position:relative;overflow:hidden;border-radius:28px;margin-top:12px;padding:22px;min-height:230px;background:linear-gradient(145deg,#084a3a,#0d8e60 48%,#16c985)}.hero h1{font-size:31px;line-height:1.04;max-width:245px;margin:10px 0 8px}.hero p{max-width:250px;color:#d7fff0;line-height:1.45}.scooter{position:absolute;right:18px;bottom:35px;width:125px;height:52px;border-radius:45% 45% 22% 22%;background:#05110e;transform:skewX(-10deg)}.scooter:before,.scooter:after{content:"";position:absolute;width:31px;height:31px;border:6px solid #05110e;border-radius:50%;background:#15d89a;bottom:-18px}.scooter:before{left:5px}.scooter:after{right:5px}.helmet{position:absolute;right:87px;bottom:90px;width:41px;height:41px;border-radius:50%;background:#05110e}.helmet:after{content:"";position:absolute;left:15px;bottom:-42px;width:8px;height:55px;background:#05110e;transform:rotate(-18deg);border-radius:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#fff;color:#11201b;border-radius:17px;padding:11px}.stat b{display:block;font-size:17px;margin-top:4px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.section h2{font-size:18px;margin:0}.card{background:#0b1715;border:1px solid var(--line);border-radius:20px;padding:15px}.offer{background:#fff;color:#101614;border-radius:20px;padding:14px}.offer h3{margin:6px 0;font-size:16px}.pay{font-size:22px;font-weight:1000;color:#09815d}.list{display:grid;gap:9px}.listitem{display:flex;align-items:center;gap:10px;background:#0e1e1a;border:1px solid #203b33;border-radius:16px;padding:12px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900}.primary{background:linear-gradient(90deg,#09bf7f,#22e9a6);color:#042016}.secondary{background:#13241f;color:#fff;border:1px solid #234038}.ghost{background:transparent;color:#d8fff0;border:1px solid #2b493f}.danger{background:#35141e;color:#ff8aa0;border:1px solid #5a2635}.full{width:100%}.small{font-size:11px}.muted{color:var(--muted)}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#133229;color:#82f6c7;font-size:9px;font-weight:900}.route-map{position:relative;min-height:270px;border-radius:22px;background:linear-gradient(145deg,#0d2d26,#0c1f1b);border:1px solid #24463c;overflow:hidden;padding:15px}.route-line{position:absolute;left:30px;right:30px;top:75px;height:4px;background:#19d79b;transform:rotate(-8deg)}.pin{width:30px;height:30px;border-radius:50%;background:#fff;color:#087e5c;display:grid;place-items:center;font-size:12px;font-weight:1000}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);z-index:40;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(6,17,15,.97);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav{border:0;background:none;color:#6e827b;font-size:9px}.nav b{display:block;font-size:18px}.nav.active{color:#2ae9ab}.modal{position:fixed;inset:0;background:rgba(2,8,6,.76);display:none;align-items:flex-end;z-index:80}.modal.show{display:flex}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#0b1715;border:1px solid #27453b;border-radius:26px 26px 0 0;padding:18px}.close{float:right;width:35px;height:35px;border-radius:11px;border:1px solid #315047;background:#11231e;color:#fff}.label{display:block;font-size:10px;font-weight:900;margin:11px 0 6px}.input{width:100%;padding:12px;border-radius:13px;border:1px solid #33524a;background:#08110f;color:#fff}.toast{position:fixed;left:50%;bottom:103px;transform:translateX(-50%);background:#fff;color:#062018;padding:11px 14px;border-radius:13px;display:none;z-index:90;font-size:12px}.toast.show{display:block}.auth{min-height:100vh;padding:25px 18px 38px;background:radial-gradient(circle at 50% -10%,#0a6049 0,#0f2a24 36%,#06110f 70%)}.auth-brand{display:flex;align-items:center;flex-direction:column;padding-top:22px}.auth-logo{width:82px;height:82px;border-radius:26px;background:linear-gradient(145deg,#08b977,#21f0a8);display:grid;place-items:center;color:#05251b;font-weight:1000;font-size:42px}.auth-brand h1{font-size:34px;margin:13px 0 4px}.auth-brand p{margin:0;color:#a8c4bb}.auth-card{margin-top:29px}.divider{display:flex;align-items:center;gap:9px;color:#6f887f;font-size:10px;margin:15px 0}.divider:before,.divider:after{content:"";height:1px;background:#244039;flex:1}.socials{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.social{border:1px solid #2b493f;background:#0c1916;color:#fff;border-radius:15px;padding:11px 6px;font-weight:900}.process{display:grid;gap:9px;margin-top:15px}.process-item{display:flex;gap:10px;border:1px solid #203a32;background:#0b1715;border-radius:17px;padding:12px}</style></head><body><div id="app" class="app"></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div><script src="app-config.js"></script><script src="supabase-client.js"></script><script>
const C=window.VaniCore,app=document.getElementById("app"),toastEl=document.getElementById("toast");let user=null,profile=null,courier=null,packages=[],routes=[],activeRoute=null,routeStops=[],tickets=[],page="home",pendingPhone=null,syncTimer=null;const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),money=n=>"$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2});function toast(m){toastEl.textContent=m;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2200)}function openModal(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}document.getElementById("modal").addEventListener("click",e=>e.target.id==="modal"&&closeModal());const icon=n=>({home:"⌂",orders:"▣",map:"⌖",user:"◉",bell:"♢",gear:"⚙"}[n]||"•");function go(p){page=p;render()}function top(){return '<div class="top"><div class="brand"><div class="mark">V</div><span>VaniReparte</span></div><div class="top-actions"><button class="icon-btn" onclick="toast(\'No hay notificaciones nuevas\')">'+icon("bell")+'</button><button class="icon-btn" onclick="go(\'profile\')">'+icon("gear")+'</button></div></div>'}function bottom(){return '<div class="bottom"><button class="nav '+(page==="home"?"active":"")+'" onclick="go(\'home\')"><b>'+icon("home")+'</b>Inicio</button><button class="nav '+(page==="packages"?"active":"")+'" onclick="go(\'packages\')"><b>'+icon("orders")+'</b>Pedidos</button><button class="nav '+(page==="route"?"active":"")+'" onclick="go(\'route\')"><b>'+icon("map")+'</b>Mapa</button><button class="nav '+(page==="profile"?"active":"")+'" onclick="go(\'profile\')"><b>'+icon("user")+'</b>Perfil</button></div>'}function auth(){app.innerHTML='<div class="auth"><div class="auth-brand"><div class="auth-logo">V</div><h1>Vani<span style="color:#31eca9">Reparte</span></h1><p>Tu esfuerzo también mueve el mundo</p></div><div class="card auth-card"><h2>Iniciar sesión</h2><div class="small muted">Cuenta exclusiva para repartidores.</div><label class="label">Correo</label><input id="e" class="input" type="email"><label class="label">Contraseña</label><input id="p" class="input" type="password"><button class="btn primary full" style="margin-top:13px" onclick="login()">Iniciar sesión</button><button class="btn ghost full" style="margin-top:9px" onclick="registerCourier()">Crear cuenta</button><div class="divider">O continúa con</div><div class="socials"><button class="social" onclick="socialLogin(\'google\')">G</button><button class="social" onclick="socialLogin(\'facebook\')">f</button><button class="social" onclick="socialLogin(\'apple\')"></button><button class="social" onclick="phoneRegister()">☎</button></div><button class="btn ghost full" style="margin-top:10px" onclick="requestPasswordReset()">¿Olvidaste tu contraseña?</button></div><div class="process"><div class="process-item">① <div><b>Regístrate</b><div class="small muted">Completa tus datos y términos de colaboración.</div></div></div><div class="process-item">② <div><b>Verificación</b><div class="small muted">La empresa revisa tu perfil antes de activar oportunidades.</div></div></div><div class="process-item">③ <div><b>Acepta pedidos</b><div class="small muted">Las ofertas aparecen cuando existen solicitudes reales.</div></div></div><div class="process-item">④ <div><b>Entrega</b><div class="small muted">GPS, ruta y PIN conectados a la operación.</div></div></div></div></div>'}async function socialLogin(p){try{await C.oauth(p)}catch(e){toast(e.message||"No se pudo iniciar")}}function registerCourier(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Crear cuenta de repartidor</h2><label class="label">Nombre completo</label><input id="rn" class="input"><label class="label">Correo</label><input id="re" class="input" type="email"><label class="label">Teléfono</label><input id="rt" class="input" type="tel"><label class="label">Contraseña</label><input id="rp" class="input" type="password"><label class="row" style="margin-top:10px"><input id="rc" type="checkbox"><span class="small muted">Acepto los términos de colaboración.</span></label><button class="btn primary full" style="margin-top:13px" onclick="createCourier()">Crear cuenta</button>')}function phoneRegister(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Registro con teléfono</h2><label class="label">Nombre</label><input id="pn" class="input"><label class="label">Teléfono</label><input id="pt" class="input" type="tel"><label class="row" style="margin-top:10px"><input id="pc" type="checkbox"><span class="small muted">Acepto los términos.</span></label><button class="btn primary full" style="margin-top:13px" onclick="sendPhoneCode()">Enviar código</button>')}async function sendPhoneCode(){try{const n=$("#pn").value.trim(),p=$("#pt").value.trim();if(!n||!p||!$("#pc").checked)throw Error("Completa datos y acepta los términos.");pendingPhone={name:n,phone:p};await C.sendOtp(p,{account_type:"courier",onboarding_role:"courier",name:n,display_name:n,full_name:n,terms_accepted_at:new Date().toISOString(),terms_version:"v1.0"});document.getElementById("sheet").innerHTML='<button class="close" onclick="closeModal()">✕</button><h2>Verificar teléfono</h2><input id="ptc" class="input" inputmode="numeric" maxlength="8"><button class="btn primary full" style="margin-top:12px" onclick="verifyPhoneCode()">Verificar</button>'}catch(e){toast(e.message||"No se pudo enviar")}}async function verifyPhoneCode(){try{const code=$("#ptc").value.trim();if(!pendingPhone||!code)throw Error("Escribe el código.");await C.verifyOtp(pendingPhone.phone,code);pendingPhone=null;closeModal();await boot();toast("Cuenta creada")}catch(e){toast(e.message||"Código no válido")}}async function login(){try{await C.signIn($("#e").value.trim(),$("#p").value);await boot();toast("Sesión iniciada")}catch(e){toast(e.message||"No se pudo iniciar")}}async function createCourier(){try{if(!$("#rc").checked)throw Error("Debes aceptar los términos.");const n=$("#rn").value.trim(),e=$("#re").value.trim(),p=$("#rp").value,ph=$("#rt").value.trim();if(!n||!e||p.length<8)throw Error("Completa los datos y usa 8 caracteres o más.");await C.signUp(e,p,{account_type:"courier",onboarding_role:"courier",name:n,display_name:n,full_name:n,phone:ph,terms_accepted_at:new Date().toISOString(),terms_version:"v1.0"});if(!C.session()){closeModal();openModal('<button class="close" onclick="closeModal()">✕</button><h2>Revisa tu correo</h2><p class="small muted">Confirma tu cuenta y después inicia sesión.</p>');return}closeModal();await boot();toast("Cuenta creada")}catch(e){toast(e.message||"No se pudo crear")}}function requestPasswordReset(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Recuperar contraseña</h2><label class="label">Correo</label><input id="reset" class="input" type="email"><button class="btn primary full" style="margin-top:12px" onclick="sendReset()">Enviar enlace</button>')}async function sendReset(){try{await C.recoverPassword($("#reset").value.trim(),location.href.split("#")[0]);closeModal();toast("Revisa tu correo")}catch(e){toast(e.message||"No se pudo enviar")}}function passwordResetView(){app.innerHTML='<div class="auth"><div class="auth-brand"><div class="auth-logo">V</div><h1>Vani<span style="color:#31eca9">Reparte</span></h1></div><div class="card auth-card"><h2>Nueva contraseña</h2><input id="newpw" class="input" type="password"><button class="btn primary full" style="margin-top:12px" onclick="finishPasswordReset()">Guardar</button></div></div>'}async function finishPasswordReset(){try{const p=$("#newpw").value;if(p.length<8)throw Error("Usa 8 caracteres o más.");await C.updatePassword(p);await boot();toast("Contraseña actualizada")}catch(e){toast(e.message||"No se pudo actualizar")}}async function loadData(){try{const d=await C.edge("vanireparte-packages","GET");packages=Array.isArray(d?.offers)?d.offers:[]}catch(_){packages=[]}routes=await C.table.list("delivery_routes","id,status,total_packages,pickup_stops,delivery_stops,total_distance_km,estimated_minutes,total_pay,route_score,accepted_at,completed_at,created_at",{courier_id:"eq."+user.id},"order=created_at.desc").catch(()=>[]);activeRoute=routes.find(r=>["accepted","collecting","delivering","in_progress"].includes(r.status))||null;routeStops=activeRoute?await C.table.list("delivery_route_stops","id,sequence_no,stop_type,order_id,package_request_id,address,status,pickup_pin_verified,delivery_pin_verified,window_start,window_end",{route_id:"eq."+activeRoute.id},"order=sequence_no.asc").catch(()=>[]):[]}async function boot(){const a=await C.consumeAuthHash();if(a?.type==="recovery"){passwordResetView();return}if(a?.type==="error")toast(a.message);user=await C.me();profile=user?await C.profile():null;if(!user||!profile){C.signOut();auth();return}if(profile.role!=="courier"){C.signOut();auth();toast("Esta app es exclusiva para repartidores.");return}const cr=await C.table.list("courier_profiles","user_id,status,full_name,curp,date_of_birth,phone,email,address,emergency_contact,vehicle_type,vehicle_make,vehicle_model,vehicle_year,vehicle_color,vehicle_plates,license_number,verification_level,rating,completed_deliveries,availability,last_location",{user_id:"eq."+user.id});courier=cr[0]||null;tickets=await C.table.list("support_tickets","id,email,category,subject,status,priority,created_at,resolution_status",{user_id:"eq."+user.id},"order=created_at.desc").catch(()=>[]);await loadData();render();startSync()}function home(){const online=!!courier?.availability,offers=packages.slice(0,3).map(p=>'<div class="offer"><span class="pill">Nueva oferta</span><h3>'+esc(p.title||p.store_name||"Entrega VaniDaxi")+'</h3><div class="small muted">'+esc(p.pickup_label||"Recoger")+" → "+esc(p.dropoff_label||"Entregar")+'</div><div class="row" style="margin-top:10px"><div class="pay">'+money(p.pay||p.amount||0)+'</div><div class="grow"></div><button class="btn primary" onclick="acceptPackage(\''+esc(p.id)+'\')">Aceptar</button></div></div>').join("");return top()+'<div class="shell"><div class="hero"><div class="small">VaniReparte · COLABORACIÓN</div><h1>Tu esfuerzo también mueve el mundo</h1><p>Recibe oportunidades reales, acepta rutas y confirma entregas.</p><button class="btn" style="margin-top:16px;background:#fff;color:#087d5a" onclick="toggleAvailability()">'+(online?"Disponible":"Activar disponibilidad")+'</button><div class="helmet"></div><div class="scooter"></div></div><div class="stats"><div class="stat"><div class="small muted">Estado</div><b style="color:'+(online?"#079765":"#111a17")+'">'+(online?"En línea":"Fuera de línea")+'</b></div><div class="stat"><div class="small muted">Entregas</div><b>'+Number(courier?.completed_deliveries||0)+'</b></div><div class="stat"><div class="small muted">Calificación</div><b>'+((courier?.rating)?Number(courier.rating).toFixed(1):"—")+'</b></div></div><div class="section"><h2>Ofertas cercanas</h2><button class="btn secondary" onclick="loadData().then(render)">Actualizar</button></div><div class="list">'+(offers||'<div class="card"><b>No hay ofertas disponibles</b><div class="small muted">Las oportunidades aparecen cuando existen solicitudes reales.</div></div>')+'</div>'+(activeRoute?'<div class="section"><h2>Ruta activa</h2></div><div class="card"><div class="row"><div class="grow"><b>'+Number(activeRoute.total_packages||0)+' paquetes</b><div class="small muted">'+Number(activeRoute.total_distance_km||0)+' km · '+Number(activeRoute.estimated_minutes||0)+' min</div></div><div class="pay">'+money(activeRoute.total_pay)+'</div></div><button class="btn primary full" style="margin-top:10px" onclick="go(\'route\')">Ver ruta</button></div>':"")+'<div class="row" style="margin-top:12px"><button class="btn secondary grow" onclick="shareLocation()">Compartir ubicación</button><button class="btn secondary grow" onclick="go(\'profile\')">Mi perfil</button></div></div>'+bottom()}function packagesPage(){return top()+'<div class="shell"><div class="section"><h2>Pedidos y rutas</h2></div><div class="card"><b>'+packages.length+' oferta(s) disponible(s)</b><div class="small muted">Las ofertas reales aparecen cuando existen solicitudes.</div></div><div class="section"><h2>Historial</h2></div><div class="list">'+(routes.slice(0,6).map(r=>'<div class="listitem"><div class="grow"><b>Ruta '+esc(String(r.id).slice(0,8))+'</b><div class="small muted">'+esc(r.status)+' · '+Number(r.total_packages||0)+' paquetes</div></div><b>'+money(r.total_pay)+'</b></div>').join("")||'<div class="notice">Aún no hay rutas.</div>')+'</div></div>'+bottom()}function mapUrl(s){const a=s?.address||{};if(a.lat&&a.lng)return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a.lat+','+a.lng);const t=[a.address_line1,a.city,a.state].filter(Boolean).join(", ");return t?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(t):null}function routePage(){const stops=routeStops.map((s,i)=>{const u=mapUrl(s);return '<div class="listitem"><div class="pin">'+(i+1)+'</div><div class="grow"><b>'+esc(s.stop_type==="pickup"?"Recoger paquete":"Entregar paquete")+'</b><div class="small muted">'+esc(s.address?.address_line1||s.address?.address||"Dirección registrada")+'</div><div class="small muted">'+esc(s.status||"pending")+'</div></div>'+(u?'<a class="btn secondary" target="_blank" rel="noopener" href="'+u+'">Ir</a>':"")+'</div>'}).join("");return top()+'<div class="shell"><div class="section"><h2>Mapa y ruta</h2></div>'+(activeRoute?'<div class="route-map"><div class="route-line"></div><div class="pin" style="position:absolute;left:18px;top:50px">A</div><div class="pin" style="position:absolute;left:47%;top:120px">B</div><div class="pin" style="position:absolute;right:18px;bottom:40px">C</div><div class="card" style="position:absolute;left:15px;right:15px;bottom:12px;background:#07100d"><div class="row"><div class="grow"><b>'+Number(activeRoute.total_packages||0)+' paquetes</b><div class="small muted">'+Number(activeRoute.total_distance_km||0)+' km · '+Number(activeRoute.estimated_minutes||0)+' min</div></div><div class="pay">'+money(activeRoute.total_pay)+'</div></div></div></div><div class="list" style="margin-top:12px">'+stops+'</div>':'<div class="card" style="text-align:center;padding:35px"><div style="font-size:46px">⌖</div><h3>No hay ruta activa</h3><p class="muted">Acepta una oferta para recibir una ruta.</p></div>')+'</div>'+bottom()}async function toggleAvailability(){try{await C.table.update("courier_profiles",{availability:!courier.availability},{user_id:"eq."+user.id});await boot();toast(courier?.availability?"Disponible":"Fuera de línea")}catch(e){toast(e.message||"No se pudo actualizar")}}function shareLocation(){if(!navigator.geolocation)return toast("GPS no disponible.");navigator.geolocation.getCurrentPosition(async p=>{try{await C.table.update("courier_profiles",{last_location:{lat:Number(p.coords.latitude.toFixed(6)),lng:Number(p.coords.longitude.toFixed(6)),accuracy_m:Number(p.coords.accuracy||0),updated_at:new Date().toISOString()}},{user_id:"eq."+user.id});await boot();toast("Ubicación actualizada")}catch(e){toast(e.message||"No se pudo guardar")}},e=>toast("No se pudo obtener: "+e.message),{enableHighAccuracy:true,timeout:10000,maximumAge:15000})}async function acceptPackage(id){try{if(courier?.status!=="active"||!courier?.availability)throw Error("Activa disponibilidad y espera la activación de tu cuenta.");const p=packages.find(x=>x.id===id);if(!p)throw Error("Oferta no disponible.");const d=await C.edge("vanireparte-packages","POST",{action:"accept_route",package_ids:[p.id]});if(!d?.accepted)throw Error(d?.error||"No se pudo aceptar.");await boot();go("route");toast("Ruta aceptada")}catch(e){toast(e.message||"No se pudo aceptar")}}function confirmStop(id,orderId,kind,pkgId){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Confirmar '+(kind==="pickup"?"recolección":"entrega")+'</h2><input id="pin" class="input" inputmode="numeric" maxlength="4"><button class="btn primary full" style="margin-top:12px" onclick="sendEvent(\''+esc(id)+'\',\''+esc(orderId)+'\',\''+esc(kind)+'\',\''+esc(pkgId||"")+'\')">Confirmar</button>')}async function sendEvent(id,orderId,kind,pkgId){try{const code=$("#pin").value.trim();if(!/^\\d{4}$/.test(code))throw Error("PIN de 4 dígitos requerido.");await C.edge("vanireparte-delivery-events","POST",{event_type:kind==="pickup"?"pickup_confirmed":"delivery_confirmed",route_id:activeRoute.id,route_stop_id:id,order_id:orderId,package_request_id:pkgId||null,code,metadata:{app:"VaniReparte"}});closeModal();await boot();toast(kind==="pickup"?"Recolección confirmada":"Entrega confirmada")}catch(e){toast(e.message||"No se pudo confirmar")}}function startStop(id,orderId,kind,pkgId){C.edge("vanireparte-delivery-events","POST",{event_type:kind==="pickup"?"pickup_started":"delivery_started",route_id:activeRoute.id,route_stop_id:id,order_id:orderId,package_request_id:pkgId||null,metadata:{app:"VaniReparte"}}).then(()=>boot()).then(()=>go("route")).catch(e=>toast(e.message||"No se pudo iniciar"))}function reportFailure(id,orderId,kind,pkgId){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Registrar incidencia</h2><textarea id="fail" class="input" rows="5" placeholder="Describe lo ocurrido"></textarea><button class="btn primary full" style="margin-top:12px" onclick="sendFailure(\''+esc(id)+'\',\''+esc(orderId)+'\',\''+esc(kind)+'\',\''+esc(pkgId||"")+'\')">Registrar</button>')}async function sendFailure(id,orderId,kind,pkgId){try{const note=$("#fail").value.trim();if(!note)throw Error("Describe la incidencia.");await C.edge("vanireparte-delivery-events","POST",{event_type:"delivery_failed",route_id:activeRoute.id,route_stop_id:id,order_id:orderId,package_request_id:pkgId||null,metadata:{app:"VaniReparte",note}});closeModal();await boot();toast("Incidencia registrada")}catch(e){toast(e.message||"No se pudo registrar")}}async function completeRoute(){try{if(!activeRoute)throw Error("No hay ruta activa.");await C.edge("vanireparte-delivery-events","POST",{event_type:"route_completed",route_id:activeRoute.id,metadata:{app:"VaniReparte"}});await boot();go("home");toast("Ruta finalizada")}catch(e){toast(e.message||"No se pudo finalizar")}}function supportForm(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Centro de ayuda</h2><label class="label">Categoría</label><select id="spc" class="input"><option>General</option><option>Ruta</option><option>Entrega</option><option>Cuenta</option></select><label class="label">Asunto</label><input id="sps" class="input"><button class="btn primary full" style="margin-top:12px" onclick="saveSupportTicket()">Enviar</button>')}async function saveSupportTicket(){try{const s=$("#sps").value.trim();if(!s)throw Error("Escribe el asunto.");await C.table.insert("support_tickets",{user_id:user.id,email:user.email,category:$("#spc").value,subject:s,status:"open",priority:"normal"});closeModal();await boot();toast("Solicitud enviada")}catch(e){toast(e.message||"No se pudo enviar")}}async function saveProfile(){try{const vm=$("#cp_vm").value.trim().split(/\s+/);await C.table.update("courier_profiles",{curp:$("#cp_curp").value.trim(),date_of_birth:$("#cp_dob").value||null,address:$("#cp_addr").value.trim(),emergency_contact:$("#cp_em").value.trim(),vehicle_type:$("#cp_v").value||null,vehicle_make:vm[0]||null,vehicle_model:vm.length>2?vm.slice(1,-1).join(" "):(vm[1]||null),vehicle_year:vm.length?Number(vm[vm.length-1])||null:null,vehicle_plates:$("#cp_pl").value.trim(),license_number:$("#cp_li").value.trim()},{user_id:"eq."+user.id});await boot();toast("Perfil guardado")}catch(e){toast(e.message||"No se pudo guardar")}}function profilePage(){return top()+'<div class="shell"><div class="card"><div class="row"><div class="mark">V</div><div class="grow"><b>'+esc(courier?.full_name||profile?.full_name||user.email)+'</b><div class="small muted">'+esc(user.email||"")+'</div></div><span class="pill">'+esc(courier?.status||"draft")+'</span></div></div><div class="section"><h2>Datos de colaboración</h2></div><div class="card"><label class="label">CURP</label><input id="cp_curp" class="input" value="'+esc(courier?.curp||"")+'"><label class="label">Fecha de nacimiento</label><input id="cp_dob" class="input" type="date" value="'+esc(courier?.date_of_birth||"")+'"><label class="label">Dirección</label><textarea id="cp_addr" class="input" rows="3">'+esc(courier?.address||"")+'</textarea><label class="label">Contacto de emergencia</label><input id="cp_em" class="input" value="'+esc(courier?.emergency_contact||"")+'"><label class="label">Vehículo</label><select id="cp_v" class="input"><option value="">Selecciona</option><option value="Motocicleta">Motocicleta</option><option value="Automóvil">Automóvil</option><option value="Bicicleta">Bicicleta</option><option value="Otro">Otro</option></select><label class="label">Marca / modelo / año</label><input id="cp_vm" class="input" value="'+esc([courier?.vehicle_make,courier?.vehicle_model,courier?.vehicle_year].filter(Boolean).join(" "))+'"><label class="label">Placas</label><input id="cp_pl" class="input" value="'+esc(courier?.vehicle_plates||"")+'"><label class="label">Licencia</label><input id="cp_li" class="input" value="'+esc(courier?.license_number||"")+'"><button class="btn primary full" style="margin-top:12px" onclick="saveProfile()">Guardar cambios</button></div><div class="section"><h2>Cuenta</h2></div><div class="list"><button class="listitem" onclick="supportForm()">💬 <span class="grow">Centro de ayuda</span>›</button><a class="listitem" href="../../legal/privacy.html">🔒 <span class="grow">Privacidad</span>›</a><a class="listitem" href="../../legal/terms.html">📄 <span class="grow">Términos</span>›</a></div><button class="btn danger full" style="margin-top:12px" onclick="logout()">Cerrar sesión</button></div>'+bottom()}function logout(){C.signOut();user=null;profile=null;courier=null;auth()}function startSync(){if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(async()=>{if(document.hidden||!user)return;try{await loadData();render()}catch(_){}},12000)}function render(){if(!user)return auth();if(page==="home")app.innerHTML=home();else if(page==="packages")app.innerHTML=packagesPage();else if(page==="route")app.innerHTML=routePage();else app.innerHTML=profilePage()}Object.assign(window,{login,registerCourier,createCourier,socialLogin,phoneRegister,sendPhoneCode,verifyPhoneCode,requestPasswordReset,sendReset,finishPasswordReset,boot,go,closeModal,toggleAvailability,shareLocation,acceptPackage,confirmStop,sendEvent,startStop,reportFailure,sendFailure,completeRoute,supportForm,saveSupportTicket,saveProfile,logout,toast,loadData});boot().catch(()=>auth())</script></body></html>
