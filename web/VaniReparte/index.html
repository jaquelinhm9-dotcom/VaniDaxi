<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073d34"><title>VaniReparte</title>
<style>
:root{--dark:#073d34;--green:#10b77c;--mint:#2bd3a3;--bg:#f7f6f1;--ink:#10253f;--muted:#717c8d;--line:#e2e5e8;--card:#fff;--red:#c83e4d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:540px;min-height:100vh;margin:auto;padding-bottom:86px;background:var(--bg)}
.top{position:sticky;top:0;z-index:10;background:#f7f6f1f5;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.v{width:41px;height:41px;border-radius:13px;background:linear-gradient(145deg,#0a765d,#15b899 65%,#40d7a7);display:grid;place-items:center;color:#fff;font-size:23px;font-weight:1000}.brand b{font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.top button{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#fff}.page{padding:18px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.11em;color:#8a95a4}.title{font-size:31px;line-height:1.03;margin:6px 0 12px;letter-spacing:-.4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:16px}.hero{background:linear-gradient(145deg,#06372f,#0a5b4c);color:#fff;border:0}.hero h1{font-size:34px;line-height:1.03;margin:10px 0}.hero p{color:#d3e8e1}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:900}.primary{background:linear-gradient(135deg,var(--green),var(--mint));color:#07362d}.secondary{background:#edf2f2;color:var(--dark)}.outline{background:#fff;color:var(--dark);border:1px solid #cbd5d8}.danger{background:#fff0f2;color:var(--red)}.full{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:27px;font-weight:900}.muted{color:var(--muted)}.small{font-size:11px}.badge{display:inline-flex;align-items:center;padding:7px 9px;border-radius:999px;background:#eef1f3;color:#647084;font-size:10px;font-weight:900}.badge.green{background:#e6f7f0;color:#087951}.badge.red{background:#fff0f2;color:var(--red)}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.list{display:grid;gap:9px}.item{padding:13px;background:#fff;border:1px solid var(--line);border-radius:16px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:20}.nav{background:none;border:0;color:#7a8594;font-size:9px}.nav b{display:block;font-size:18px}.nav.active{color:var(--green);font-weight:900}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0}.label{display:block;font-size:11px;font-weight:900;margin:10px 0 6px}.map{height:255px;border-radius:20px;overflow:hidden;background:#ecebe5;border:1px solid var(--line)}.route-map{height:285px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#e9ece7}.leaflet-container{font:12px Inter,system-ui,sans-serif}.leaflet-control-attribution{font-size:9px}.modal{position:fixed;inset:0;background:#082b258c;display:none;align-items:end;z-index:50}.modal.show{display:flex}.sheet{width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:18px}.close{float:right;border:0;background:#f1f3f5;width:35px;height:35px;border-radius:11px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#16352f;color:#fff;padding:11px 14px;border-radius:12px;z-index:70;display:none;font-size:12px}.toast.show{display:block}
</style></head><body>
<div id='app' class='app'></div><div id='modal' class='modal'><div id='sheet' class='sheet'></div></div><div id='toast' class='toast'></div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src='app-config.js'></script><script src='supabase-client.js'></script>
<script>
const C=window.VaniCore;
const app=document.getElementById("app"),toastEl=document.getElementById("toast");
let user=null,profile=null,courier=null,page="home",packages=[],routes=[],activeRoute=null,routeStops=[],tickets=[],routeMap=null,homeMap=null;let syncTimer=null,syncBusy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2200)}
function money(n){return "$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2})}
function openModal(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function go(p){page=p;render()}
function top(){return "<div class='top'><div class='brand'><span class='v'>V</span><div><b>VaniReparte</b><small>Tu ruta, tu ritmo</small></div></div><button onclick='logout()'>↪</button></div>"}
function bottom(){return "<div class='bottom'><button class='nav "+(page==="home"?"active":"")+"' onclick=\"go('home')\"><b>⌂</b>Inicio</button><button class='nav "+(page==="packages"?"active":"")+"' onclick=\"go('packages')\"><b>📦</b>Paquetes</button><button class='nav "+(page==="route"?"active":"")+"' onclick=\"go('route')\"><b>🧭</b>Ruta</button><button class='nav "+(page==="profile"?"active":"")+"' onclick=\"go('profile')\"><b>◉</b>Perfil</button></div>"}
function auth(){app.innerHTML="<div class='page' style='padding-top:28px'><div class='hero card'><span class='badge' style='background:#ffffff18;color:#fff'>VaniReparte · Colaboración</span><h1>Más pedidos.<br>Más oportunidades.</h1><p>Regístrate, completa tu perfil y recibe oportunidades reales de reparto cuando tu cuenta esté activa.</p></div><div class='card' style='margin-top:12px'><div class='section' style='margin-top:0'><h2>Iniciar sesión</h2><span class='badge'>Repartidor</span></div><label class='label'>Correo</label><input id='e' class='input' type='email' autocomplete='username' placeholder='tu@correo.com'><label class='label'>Contraseña</label><input id='p' class='input' type='password' autocomplete='current-password' placeholder='Tu contraseña'><button class='btn primary full' style='margin-top:14px' onclick='login()'>Iniciar sesión</button><button class='btn outline full' style='margin-top:9px' onclick='registerCourier()'>Crear cuenta de repartidor</button><button class='link full' style='margin-top:10px' onclick='requestPasswordReset()'>¿Olvidaste tu contraseña?</button></div><div class='section'><h2>Así funciona</h2></div><div class='grid2'><div class='card'><div style='font-size:28px'>📝</div><b>1. Regístrate</b><div class='small muted' style='margin-top:4px'>Completa tus datos y documentación solicitada.</div></div><div class='card'><div style='font-size:28px'>✅</div><b>2. Verificación</b><div class='small muted' style='margin-top:4px'>La empresa revisa y activa la cuenta.</div></div><div class='card'><div style='font-size:28px'>📦</div><b>3. Acepta rutas</b><div class='small muted' style='margin-top:4px'>Ve solicitudes reales y acepta las que puedas realizar.</div></div><div class='card'><div style='font-size:28px'>📍</div><b>4. Entrega</b><div class='small muted' style='margin-top:4px'>Usa GPS, PIN y estados de ruta para cerrar cada servicio.</div></div></div><div class='card' style='margin-top:12px'><b>Importante</b><p class='small muted' style='margin-bottom:0'>La aplicación no muestra rutas ni ganancias inventadas: las oportunidades aparecen cuando existen solicitudes reales disponibles para tu cuenta.</p></div></div>"}
function requestPasswordReset(){const email=prompt("Escribe el correo de tu cuenta VaniReparte:");if(!email)return;C.recoverPassword(email.trim().toLowerCase(),location.origin+location.pathname).then(()=>toast("Revisa tu correo para restablecer la contraseña.")).catch(e=>toast(e.message||"No se pudo enviar el correo."))}
function passwordResetView(){app.innerHTML="<div class='page' style='padding-top:45px'><div class='hero card'><span class='badge' style='background:#ffffff18;color:#fff'>Seguridad de cuenta</span><h1>Restablece tu contraseña.</h1><p>Elige una contraseña nueva para volver a VaniReparte.</p></div><div class='card' style='margin-top:12px'><label class='label'>Nueva contraseña</label><input id='newpw' class='input' type='password' autocomplete='new-password'><label class='label'>Confirmar contraseña</label><input id='newpw2' class='input' type='password' autocomplete='new-password'><button class='btn primary full' style='margin-top:14px' onclick='finishPasswordReset()'>Guardar nueva contraseña</button></div></div>"}
async function finishPasswordReset(){const a=document.getElementById("newpw").value,b=document.getElementById("newpw2").value;if(a.length<8||a!==b){toast("Las contraseñas deben coincidir y tener al menos 8 caracteres.");return}try{await C.updatePassword(a);C.signOut();auth();toast("Contraseña actualizada. Inicia sesión nuevamente.")}catch(e){toast(e.message||"No se pudo actualizar la contraseña.")}}
async function login(){try{await C.signIn(document.getElementById("e").value.trim(),document.getElementById("p").value);await boot();toast("Sesión iniciada")}catch(e){toast(e.message||"No se pudo iniciar sesión")}}
function registerCourier(){openModal("<button class='close' onclick='closeModal()'>✕</button><h2>Registro de repartidor</h2><p class='small muted'>VaniReparte funciona mediante colaboración independiente. La cuenta queda pendiente de verificación hasta ser activada.</p><label class='label'>Nombre completo</label><input id='rn' class='input'><label class='label'>Teléfono</label><input id='rt' class='input' type='tel'><label class='label'>Correo</label><input id='re' class='input' type='email'><label class='label'>Contraseña</label><input id='rp' class='input' type='password'><label class='row' style='margin-top:11px'><input id='rc' type='checkbox'> <span class='small'>Acepto los términos de colaboración.</span></label><button class='btn primary full' style='margin-top:13px' onclick='createCourier()'>Crear cuenta</button>")}
async function createCourier(){try{if(!document.getElementById("rc").checked)throw Error("Debes aceptar los términos.");const n=document.getElementById("rn").value.trim(),e=document.getElementById("re").value.trim(),p=document.getElementById("rp").value,ph=document.getElementById("rt").value.trim();if(!n||!e||p.length<8)throw Error("Completa los datos y usa una contraseña de 8 caracteres o más.");const now=new Date().toISOString();await C.signUp(e,p,{account_type:"courier",onboarding_role:"courier",name:n,display_name:n,phone:ph,terms_accepted_at:now,terms_version:"v1.0"});if(!C.session())await C.signIn(e,p);closeModal();await boot();toast("Cuenta creada")}catch(e){toast(e.message||"No se pudo crear la cuenta")}}
async function boot(){if(C.consumeRecovery()){passwordResetView();return}user=await C.me();profile=user?await C.profile():null;if(!user||!profile){C.signOut();auth();return}if(profile.role!=="courier"){C.signOut();auth();toast("Esta aplicación es para cuentas de repartidor.");return}const rows=await C.table.list("courier_profiles","user_id,status,full_name,curp,date_of_birth,phone,email,address,emergency_contact,vehicle_type,vehicle_make,vehicle_model,vehicle_year,vehicle_color,vehicle_plates,license_number,verification_level,rating,completed_deliveries,availability,last_location",{user_id:"eq."+user.id});courier=rows[0]||null;tickets=await C.table.list("support_tickets","id,email,category,subject,status,priority,created_at,resolution_status",{user_id:"eq."+user.id},"order=created_at.desc").catch(()=>[]);await loadData();render();startSync()}
async function loadData(){try{const data=await C.edge("vanireparte-packages","GET");packages=Array.isArray(data?.offers)?data.offers:[]}catch(_){packages=[]}routes=await C.table.list("delivery_routes","id,status,total_packages,pickup_stops,delivery_stops,total_distance_km,estimated_minutes,total_pay,route_score,accepted_at,completed_at,created_at",{courier_id:"eq."+user.id},"order=created_at.desc").catch(()=>[]);activeRoute=routes.find(r=>["accepted","collecting","delivering","in_progress"].includes(r.status))||null;routeStops=activeRoute?await C.table.list("delivery_route_stops","id,sequence_no,stop_type,order_id,package_request_id,address,status,pickup_pin_verified,delivery_pin_verified,window_start,window_end",{route_id:"eq."+activeRoute.id},"order=sequence_no.asc").catch(()=>[]):[]}
function home(){const active=courier&&courier.status==="active";return top()+"<div class='page'><div class='eyebrow'>DISPONIBILIDAD</div><div class='row'><h1 class='title'>Listo para repartir</h1><span class='badge "+(active?"green":"red")+"'>"+(active?"Cuenta activa":"Pendiente")+"</span></div>"+(!active?"<div class='card' style='margin-bottom:12px'><b>Cuenta pendiente de activación.</b><p class='small muted'>Completa tu perfil y espera la verificación administrativa.</p><button class='btn secondary' onclick=\"go('profile')\">Completar perfil</button></div>":"")+"<div class='card'><div class='row'><div class='grow'><b>Disponibilidad</b><div class='small muted'>Activa tu disponibilidad cuando estés listo para aceptar trabajo.</div></div><span class='badge "+(courier&&courier.availability?"green":"")+"'>"+(courier&&courier.availability?"DISPONIBLE":"NO DISPONIBLE")+"</span></div><button class='btn "+(courier&&courier.availability?"secondary":"primary")+" full' style='margin-top:13px' "+(active?"":"disabled")+" onclick='toggleAvailability()'>"+(courier&&courier.availability?"Desactivar disponibilidad":"Activarme para recibir rutas")+"</button></div><div class='card' style='margin-top:12px'><b>Ubicación y ruta</b><div class='small muted'>El mapa muestra tu última ubicación guardada cuando está disponible.</div><div id='home-map' class='map' style='margin-top:12px'></div><button class='btn secondary full' style='margin-top:10px' onclick='shareLocation()'>Actualizar mi ubicación GPS</button></div><div class='grid2' style='margin-top:12px'><div class='card'><div class='small muted'>Paquetes disponibles</div><div class='stat'>"+packages.length+"</div></div><div class='card'><div class='small muted'>Ruta activa</div><div class='stat'>"+(activeRoute?Number(activeRoute.total_packages||0):0)+"</div></div></div></div>"+bottom()}
async function toggleAvailability(){try{await C.table.update("courier_profiles",{availability:!courier.availability},{user_id:"eq."+user.id});await boot();toast(courier&&courier.availability?"Disponibilidad activada":"Disponibilidad desactivada")}catch(e){toast(e.message||"No se pudo actualizar")}}
function shareLocation(){if(!navigator.geolocation){toast("Este dispositivo no ofrece GPS al navegador.");return}navigator.geolocation.getCurrentPosition(async pos=>{try{const point={lat:Number(pos.coords.latitude.toFixed(6)),lng:Number(pos.coords.longitude.toFixed(6)),accuracy_m:Number(pos.coords.accuracy||0),updated_at:new Date().toISOString()};await C.table.update("courier_profiles",{last_location:point},{user_id:"eq."+user.id});await boot();toast("Ubicación actualizada")}catch(e){toast(e.message||"No se pudo guardar la ubicación")}},err=>toast("No se pudo obtener la ubicación: "+err.message),{enableHighAccuracy:true,timeout:10000,maximumAge:15000})}
async function acceptPackage(id){try{if(!courier||courier.status!=="active"||!courier.availability)throw Error("Activa tu disponibilidad y espera a que tu cuenta esté activa.");const p=packages.find(x=>x.id===id);if(!p)throw Error("El paquete ya no está disponible.");const data=await C.edge("vanireparte-packages","POST",{action:"accept_route",package_ids:[p.id]});if(!data?.accepted)throw Error(data?.error||"No se pudo aceptar el paquete.");await boot();go("route");toast("Paquete aceptado")}catch(e){toast(e.message||"No se pudo aceptar el paquete")}}
function packagesPage(){return top()+"<div class='page'><div class='eyebrow'>OPORTUNIDADES</div><h1 class='title'>Paquetes disponibles</h1><div class='small muted' style='margin-bottom:13px'>Solo se muestran solicitudes reales de vendedores.</div>"+(packages.length?"<div class='list'>"+packages.map(p=>"<div class='item'><div class='row'><div class='grow'><b>"+esc(p.id.slice(0,8))+"</b><div class='small muted'>"+esc(p.status)+" · "+Number(p.package_count||1)+" paquete(s)</div></div><span class='badge green'>"+esc(p.pickup_mode||"recolección")+"</span></div><div class='small' style='margin-top:8px'>Salida: "+esc((p.pickup_address&&p.pickup_address.city)||"Dirección indicada por el vendedor")+"</div><div class='small muted'>"+(p.ready_at?new Date(p.ready_at).toLocaleString("es-MX"):"Sin hora definida")+"</div><button class='btn primary full' style='margin-top:10px' onclick='acceptPackage(\""+esc(p.id)+"\")' "+((courier&&courier.status==="active"&&courier.availability)?"":"disabled")+">Aceptar paquete</button></div>").join("")+"</div>":"<div class='card' style='text-align:center;padding:34px 15px'><div style='font-size:48px'>📦</div><h3>No hay paquetes disponibles</h3><p class='muted'>Aparecerán cuando existan pedidos y solicitudes de logística reales.</p></div>")+"</div>"+bottom()}
function stopCoords(s){const a=s&&s.address;const lat=Number(a?.lat??a?.latitude);const lng=Number(a?.lng??a?.lon??a?.longitude);return Number.isFinite(lat)&&Number.isFinite(lng)?{lat,lng}:null}
function buildLeafletMap(elId,points,mode){const el=document.getElementById(elId);if(!el||typeof L==="undefined")return null;const valid=points.filter(Boolean);if(!valid.length)return null;const map=L.map(el,{zoomControl:true,scrollWheelZoom:false});L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);const bounds=L.latLngBounds(valid.map(p=>[p.lat,p.lng]));valid.forEach((p,i)=>{L.marker([p.lat,p.lng]).addTo(map).bindPopup(mode==="route"?"Parada "+(i+1):"Mi ubicación");});if(valid.length>1)L.polyline(valid.map(p=>[p.lat,p.lng]),{weight:4}).addTo(map);map.fitBounds(bounds,{padding:[18,18]});return map}
function renderHomeMap(){if(homeMap){homeMap.remove();homeMap=null}const p=courier?.last_location?{lat:Number(courier.last_location.lat),lng:Number(courier.last_location.lng)}:null;homeMap=buildLeafletMap("home-map",p?[p]:[],"home");const el=document.getElementById("home-map");if(el&&!homeMap)el.innerHTML="<div style='height:100%;display:grid;place-items:center;padding:20px;text-align:center;color:#717c8d'>Pulsa «Actualizar mi ubicación GPS» para mostrar tu posición real aquí.</div>"}
function renderRouteMap(){if(routeMap){routeMap.remove();routeMap=null}const points=routeStops.map(stopCoords).filter(Boolean);routeMap=buildLeafletMap("route-map",points,"route");const el=document.getElementById("route-map");if(el&&!routeMap)el.innerHTML="<div style='height:100%;display:grid;place-items:center;padding:20px;text-align:center;color:#717c8d'>Esta ruta no tiene coordenadas suficientes para mostrar el mapa.</div>"}
function routePage(){if(!activeRoute)return top()+"<div class='page'><div class='eyebrow'>RUTA</div><h1 class='title'>Sin ruta activa</h1><div class='card' style='text-align:center;padding:34px 15px'><div style='font-size:48px'>🧭</div><h3>Cuando exista una ruta aceptada aparecerá aquí</h3><p class='muted'>La app no inventa recorridos ni ganancias.</p></div></div>"+bottom();const done=routeStops.length>0&&routeStops.every(s=>["delivered","picked_up"].includes(s.status));const stopsHtml=routeStops.length?routeStops.map(s=>{const coord=stopCoords(s);const mapLink=coord?"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(coord.lat+","+coord.lng):"";const started=s.status==="in_progress";const completed=["delivered","picked_up"].includes(s.status);const action=completed?"<button class='btn secondary' disabled>Completado</button>":started?"<button class='btn primary' onclick=\"confirmStop('"+s.id+"','"+s.order_id+"','"+s.stop_type+"','"+(s.package_request_id||"")+"')\">Confirmar "+(s.stop_type==="pickup"?"recolección":"entrega")+"</button>":"<button class='btn secondary' onclick=\"startStop('"+s.id+"','"+s.order_id+"','"+s.stop_type+"','"+(s.package_request_id||"")+"')\">Iniciar "+(s.stop_type==="pickup"?"recolección":"entrega")+"</button>";return "<div class='item'><div class='row'><div class='grow'><b>Punto "+s.sequence_no+" · "+esc(s.stop_type==="pickup"?"Recogida":"Entrega")+"</b><div class='small muted'>"+esc(s.status)+"</div><div class='small'>"+esc(s.address?.address_line1||s.address?.address||"Dirección registrada")+"</div></div>"+action+"</div>"+(mapLink?"<a class='small' style='display:inline-block;margin-top:9px;color:#0b765d;font-weight:800;text-decoration:none' target='_blank' rel='noopener' href='"+mapLink+"'>Abrir navegación →</a>":"")+"</div>"}).join(""):"<div class='card' style='text-align:center'>No hay paradas registradas.</div>";return top()+"<div class='page'><div class='eyebrow'>RUTA</div><h1 class='title'>Ruta activa</h1><div class='card hero'><div class='row'><div class='grow'><span class='badge' style='background:#ffffff18;color:#fff'>"+esc(activeRoute.status)+"</span><h2 style='margin:9px 0;color:#fff'>"+Number(activeRoute.total_packages||0)+" paquetes</h2><p>"+Number(activeRoute.total_distance_km||0)+" km · "+Number(activeRoute.estimated_minutes||0)+" min</p></div><b style='font-size:24px;color:#fff'>"+money(activeRoute.total_pay)+"</b></div></div><div id='route-map' class='route-map' style='margin-top:12px'></div><div class='list' style='margin-top:12px'>"+stopsHtml+"</div>"+(done?"<button class='btn primary full' style='margin-top:13px' onclick='completeRoute()'>Finalizar ruta</button>":"<div class='notice' style='margin-top:13px'>Inicia cada parada antes de confirmar la recogida o entrega.</div>")+"</div>"+bottom()}

async function startStop(stopId,orderId,kind,pkgId){try{const event=kind==="pickup"?"pickup_started":"delivery_started";await C.edge("vanireparte-delivery-events","POST",{event_type:event,route_id:activeRoute.id,route_stop_id:stopId,order_id:orderId,package_request_id:pkgId||null,metadata:{app:"VaniReparte"}});await boot();go("route");toast(kind==="pickup"?"Recolección iniciada":"Entrega iniciada")}catch(e){toast(e.message||"No se pudo iniciar la parada")}}
function confirmStop(stopId,orderId,kind,pkgId){openModal("<button class='close' onclick='closeModal()'>✕</button><h2>Confirmar "+(kind==="pickup"?"recolección":"entrega")+"</h2><p class='small muted'>Introduce el PIN de 4 dígitos proporcionado por el "+(kind==="pickup"?"vendedor":"comprador")+".</p><input id='pin' class='input' inputmode='numeric' maxlength='4'><button class='btn primary full' style='margin-top:12px' onclick=\"sendEvent('"+stopId+"','"+orderId+"','"+kind+"','"+pkgId+"')\">Confirmar</button>")}
async function sendEvent(stopId,orderId,kind,pkgId){try{const code=document.getElementById("pin").value.trim();if(!/^\d{4}$/.test(code))throw Error("PIN de 4 dígitos requerido.");const event=kind==="pickup"?"pickup_confirmed":"delivery_confirmed";await C.edge("vanireparte-delivery-events","POST",{event_type:event,route_id:activeRoute.id,route_stop_id:stopId,order_id:orderId,package_request_id:pkgId,code,metadata:{app:"VaniReparte"}});closeModal();await boot();toast(kind==="pickup"?"Recolección confirmada":"Entrega confirmada")}catch(e){toast(e.message||"No se pudo confirmar")}}
async function completeRoute(){try{if(!activeRoute)throw Error("No hay ruta activa.");await C.edge("vanireparte-delivery-events","POST",{event_type:"route_completed",route_id:activeRoute.id,metadata:{app:"VaniReparte"}});await boot();go("home");toast("Ruta finalizada")}catch(e){toast(e.message||"No se pudo finalizar la ruta")}}
function supportForm(){openModal("<button class='close' onclick='closeModal()'>✕</button><h2>Centro de ayuda</h2><p class='small muted'>Envía una solicitud al centro de atención de VaniReparte.</p><label class='label'>Categoría</label><select id='sp_cat' class='input'><option value='general'>General</option><option value='route'>Ruta</option><option value='delivery'>Entrega</option><option value='account'>Cuenta</option><option value='vehicle'>Vehículo</option></select><label class='label'>Asunto</label><input id='sp_sub' class='input' placeholder='¿En qué necesitas ayuda?'><button class='btn primary full' style='margin-top:13px' onclick='saveSupportTicket()'>Enviar solicitud</button>")}
async function saveSupportTicket(){try{const subject=document.getElementById("sp_sub").value.trim();if(!subject)throw Error("Escribe el asunto.");await C.table.insert("support_tickets",{user_id:user.id,email:user.email,category:document.getElementById("sp_cat").value,subject,status:"open",priority:"normal"});closeModal();await boot();toast("Solicitud enviada a atención")}catch(e){toast(e.message||"No se pudo enviar la solicitud")}}
function profilePage(){const rows=tickets.length?tickets.slice(0,5).map(t=>"<div class='item'><div class='row'><div class='grow'><b>"+esc(t.subject)+"</b><div class='small muted'>"+esc(t.category)+" · "+esc(t.status)+"</div></div><span class='badge "+(t.status==="closed"?"green":"")+"'>"+esc(t.priority||"normal")+"</span></div></div>").join(""):"<div class='card' style='text-align:center'><p class='muted'>No tienes solicitudes de atención.</p></div>";return top()+"<div class='page'><div class='card'><div class='row'><div class='v'>V</div><div class='grow'><h2 style='margin:0'>"+esc((courier&&courier.full_name)||profile.full_name||"Repartidor")+"</h2><div class='small muted'>"+esc(user.email||"")+"</div></div><span class='badge "+(courier&&courier.status==="active"?"green":"red")+"'>"+esc((courier&&courier.status)||"draft")+"</span></div></div><div class='section'><h2>Datos de colaboración</h2></div><div class='card'><label class='label'>CURP</label><input id='cp_curp' class='input' value='"+esc((courier&&courier.curp)||"")+"'><label class='label'>Fecha de nacimiento</label><input id='cp_dob' class='input' type='date' value='"+esc((courier&&courier.date_of_birth)||"")+"'><label class='label'>Dirección</label><textarea id='cp_addr' class='input' rows='3'>"+esc((courier&&courier.address)||"")+"</textarea><label class='label'>Contacto de emergencia</label><input id='cp_em' class='input' value='"+esc((courier&&courier.emergency_contact)||"")+"'><label class='label'>Tipo de vehículo</label><select id='cp_v' class='input'><option value=''>Selecciona</option><option value='Motocicleta'>Motocicleta</option><option value='Automóvil'>Automóvil</option><option value='Bicicleta'>Bicicleta</option><option value='Otro'>Otro</option></select><label class='label'>Marca / modelo / año</label><input id='cp_vm' class='input' value='"+esc([courier&&courier.vehicle_make,courier&&courier.vehicle_model,courier&&courier.vehicle_year].filter(Boolean).join(" "))+"'><label class='label'>Placas</label><input id='cp_pl' class='input' value='"+esc((courier&&courier.vehicle_plates)||"")+"'><label class='label'>Licencia</label><input id='cp_li' class='input' value='"+esc((courier&&courier.license_number)||"")+"'><button class='btn primary full' style='margin-top:14px' onclick='saveProfile()'>Guardar perfil</button></div><div class='section'><h2>Resumen real</h2></div><div class='grid2'><div class='card'><div class='small muted'>Entregas</div><div class='stat'>"+Number((courier&&courier.completed_deliveries)||0)+"</div></div><div class='card'><div class='small muted'>Calificación</div><div class='stat'>"+((courier&&courier.rating)?Number(courier.rating).toFixed(1):"—")+"</div></div></div><div class='section'><h2>Atención</h2><button class='btn primary' onclick='supportForm()'>Nueva solicitud</button></div><div class='list'>"+rows+"</div></div>"+bottom()}
async function saveProfile(){try{const vm=document.getElementById("cp_vm").value.trim().split(/\s+/);await C.table.update("courier_profiles",{curp:document.getElementById("cp_curp").value.trim(),date_of_birth:document.getElementById("cp_dob").value||null,address:document.getElementById("cp_addr").value.trim(),emergency_contact:document.getElementById("cp_em").value.trim(),vehicle_type:document.getElementById("cp_v").value||null,vehicle_make:vm[0]||null,vehicle_model:vm.length>2?vm.slice(1,-1).join(" "):(vm[1]||null),vehicle_year:vm.length?Number(vm[vm.length-1])||null:null,vehicle_plates:document.getElementById("cp_pl").value.trim(),license_number:document.getElementById("cp_li").value.trim()},{user_id:"eq."+user.id});await boot();toast("Perfil guardado")}catch(e){toast(e.message||"No se pudo guardar")}}
async function logout(){C.signOut();user=null;profile=null;courier=null;auth()}
function startSync(){if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(async()=>{if(syncBusy||!user||document.hidden)return;syncBusy=true;try{await loadData();tickets=await C.table.list("support_tickets","id,email,category,subject,status,priority,created_at,resolution_status",{user_id:"eq."+user.id},"order=created_at.desc").catch(()=>[]);if(page==="home"||page==="packages"||page==="route"){render()}}catch(_){ }finally{syncBusy=false}},12000)}
function render(){if(!user){auth();return}if(page==="home"){app.innerHTML=home();setTimeout(renderHomeMap,0)}else if(page==="packages"){app.innerHTML=packagesPage()}else if(page==="route"){app.innerHTML=routePage();setTimeout(renderRouteMap,0)}else app.innerHTML=profilePage()}
(async()=>{try{await boot()}catch(e){C.signOut();auth()}})();
</script></body></html>
