<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2346">
<title>VaniDaxi</title>
<style>
:root{--navy:#0b2346;--blue:#2e6cf6;--orange:#ff8a00;--orange2:#ffb51c;--bg:#f5f7fb;--card:#fff;--ink:#112544;--muted:#78849a;--line:#e2e7ef;--green:#149f73;--red:#c63d4f;--shadow:0 10px 28px rgba(17,37,68,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;padding-bottom:88px;background:#f8fafc}
.top{height:64px;position:sticky;top:0;z-index:20;background:#ffffffef;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:900}.v{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--orange),var(--orange2));display:grid;place-items:center;color:var(--navy);font-size:21px;font-weight:1000}.actions{display:flex;gap:7px}.icon{width:39px;height:39px;border:1px solid var(--line);background:#f5f7fb;border-radius:13px;color:var(--navy)}
.page{padding:14px 15px 100px}.hero{border-radius:25px;padding:22px;background:linear-gradient(145deg,#0d294f,#1a467f);color:#fff}.hero .kicker{display:inline-flex;padding:7px 10px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff20;font-size:10px;font-weight:900}.hero h1{font-size:31px;line-height:1.04;margin:14px 0 9px}.hero p{color:#d6e2f4}.cta{margin-top:15px;border:0;border-radius:14px;padding:13px 16px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:var(--navy);font-weight:900}.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:11px 13px;border-radius:15px;margin-bottom:12px}.search input{border:0;outline:0;flex:1;background:transparent}.section{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}.section h2{font-size:18px;margin:0}.link{border:0;background:transparent;color:#2c66d8;font-weight:900}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.category{min-height:108px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;gap:6px;background:linear-gradient(145deg,#fff,#f2f6ff)}.category .emoji{height:55px;border-radius:14px;background:#edf3ff;display:grid;place-items:center;font-size:29px}.small{font-size:11px}.muted{color:var(--muted)}.product{padding:0;overflow:hidden;text-align:left}.photo{height:145px;background:radial-gradient(circle,#fff,#edf1f7);display:grid;place-items:center;font-size:58px}.product .body{padding:12px}.price{font-size:20px;font-weight:900;margin-top:4px}.badge{display:inline-flex;padding:6px 8px;border-radius:999px;background:#edf1ff;color:#3356b8;font-size:10px;font-weight:900}.badge.orange{background:#fff1d8;color:#9c5c00}.badge.green{background:#e7f7f1;color:#087853}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900}.primary{background:var(--navy);color:#fff}.secondary{background:#edf2f7;color:var(--navy)}.outline{background:#fff;color:var(--navy);border:1px solid #cfd7e3}.danger{background:#fff0f2;color:var(--red)}.full{width:100%}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.list{display:grid;gap:9px}.listitem{display:flex;gap:10px;align-items:center;padding:13px;background:#fff;border:1px solid var(--line);border-radius:16px}.stat{font-size:26px;font-weight:900}.empty{text-align:center;padding:34px 15px}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;outline:0;background:#fff}.label{display:block;font-size:11px;font-weight:900;margin:10px 0 6px}.notice{padding:11px 12px;border-radius:13px;background:#eef5ff;color:#36527a;font-size:11px;line-height:1.45}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:30}.nav{border:0;background:none;color:#7b8798;font-size:9px}.nav b{display:block;font-size:18px}.nav.active{color:var(--orange);font-weight:900}.modal{position:fixed;inset:0;background:#0b1d3b8a;display:none;align-items:end;z-index:70}.modal.show{display:flex}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:27px 27px 0 0;padding:18px}.close{float:right;border:0;background:#f1f3f6;width:35px;height:35px;border-radius:11px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#132744;color:#fff;padding:11px 14px;border-radius:12px;z-index:80;display:none;font-size:12px}.toast.show{display:block}
</style></head><body>
<div id='app' class='app'></div><div id='modal' class='modal'><div id='sheet' class='sheet'></div></div><div id='toast' class='toast'></div>
<script src='app-config.js'></script><script src='supabase-client.js'></script>
<script>
const C=window.VaniCore,app=document.getElementById("app"),toastEl=document.getElementById("toast");
let user=null,profile=null,role="customer",page="home",cats=[],products=[],cart=JSON.parse(localStorage.getItem("vani_cart")||"[]"),orders=[],address=null,store=null,sellerProducts=[],sellerOrders=[],sellerOrderCount=0,sellerGross=0,sellerCost=0,sellerCommission=0,sellerProfit=0,searchTerm="";
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function money(n){return "$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2})}
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2200)}
function saveCart(){localStorage.setItem("vani_cart",JSON.stringify(cart))}
function openModal(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()})
function go(p){page=p;render()}
function top(){return "<div class='top'><div class='brand'><span class='v'>V</span>VaniDaxi</div><div class='actions'><button class='icon' onclick='go(\"cart\")'>🛒</button><button class='icon' onclick='go(\"account\")'>◉</button></div></div>"}
function nav(){return "<div class='bottom'><button class='nav "+(page==="home"?"active":"")+"' onclick='go(\"home\")'><b>⌂</b>Inicio</button><button class='nav "+(page==="categories"?"active":"")+"' onclick='go(\"categories\")'><b>▦</b>Categorías</button><button class='nav "+(page==="cart"?"active":"")+"' onclick='go(\"cart\")'><b>🛒</b>Carrito</button><button class='nav "+(page==="orders"?"active":"")+"' onclick='go(\"orders\")'><b>▣</b>Pedidos</button><button class='nav "+(page==="account"||page==="seller"?"active":"")+"' onclick='go(\"account\")'><b>◉</b>Cuenta</button></div>"}
function loginView(){app.innerHTML="<div class='page' style='padding-top:45px'><div class='hero'><span class='kicker'>Compra · vende · recibe</span><h1>Lo que necesitas, cuando lo necesitas.</h1><p>Una sola plataforma con datos reales.</p></div><div class='card' style='margin-top:12px'><h2>Iniciar sesión</h2><label class='label'>Correo</label><input id='le' class='input' type='email'><label class='label'>Contraseña</label><input id='lp' class='input' type='password'><button class='btn primary full' style='margin-top:14px' onclick='login()'>Entrar</button><button class='btn outline full' style='margin-top:9px' onclick='register(\"customer\")'>Crear cuenta de comprador</button><button class='btn outline full' style='margin-top:9px' onclick='register(\"seller\")'>Registrarme como vendedor</button></div><div class='grid3' style='margin-top:12px'><div class='card'><div style='font-size:27px'>🛒</div><b class='small'>Comprar</b></div><div class='card'><div style='font-size:27px'>🏪</div><b class='small'>Vender</b></div><div class='card'><div style='font-size:27px'>📦</div><b class='small'>Recibir</b></div></div></div>"}
function register(initial){openModal("<button class='close' onclick='closeModal()'>✕</button><h2>Crear cuenta</h2><label class='label'>Tipo de cuenta</label><select id='rr' class='input'><option value='customer' "+(initial==="customer"?"selected":"")+">Comprador</option><option value='seller' "+(initial==="seller"?"selected":"")+">Vendedor</option></select><label class='label'>Nombre</label><input id='rn' class='input'><label class='label'>Correo</label><input id='re' class='input' type='email'><label class='label'>Contraseña</label><input id='rp' class='input' type='password'><label class='label'>Confirmar contraseña</label><input id='rp2' class='input' type='password'><label class='row' style='margin-top:11px'><input id='terms' type='checkbox'> <span class='small'>Acepto los términos de VaniDaxi.</span></label><button class='btn primary full' style='margin-top:13px' onclick='createAccount()'>Crear cuenta</button>")}
async function login(){try{await C.signIn($("#le").value.trim(),$("#lp").value);await boot();toast("Sesión iniciada")}catch(e){toast(e.message||"No se pudo iniciar sesión")}}
async function createAccount(){try{const n=$("#rn").value.trim(),e=$("#re").value.trim(),p=$("#rp").value,p2=$("#rp2").value,r=$("#rr").value;if(!n||!e||p.length<8||p!==p2)throw Error("Revisa los datos y usa una contraseña de 8 caracteres o más.");if(!$("#terms").checked)throw Error("Debes aceptar los términos.");const now=new Date().toISOString();await C.signUp(e,p,{account_type:r,onboarding_role:r==="customer"?undefined:r,name:n,display_name:n,full_name:n,terms_accepted_at:now,terms_version:"v1.0"});if(!C.session())await C.signIn(e,p);closeModal();await boot();toast("Cuenta creada")}catch(e){toast(e.message||"No se pudo crear la cuenta")}}
async function boot(){user=await C.me();profile=user?await C.profile():null;if(!user||!profile){C.signOut();loginView();return}role=profile.role||"customer";await loadBase();if(role==="seller")await loadSeller();render();const q=new URLSearchParams(location.search);if(q.get("payment")){const state=q.get("payment");if(state==="success")toast("Pago aprobado; tu pedido se actualizará en segundos.");else if(state==="pending")toast("Pago pendiente de confirmación.");else if(state==="failure")toast("El pago no se completó.");if(history.replaceState)history.replaceState({},document.title,location.pathname)}}
async function loadBase(){cats=await C.table.list("categories","id,name,slug,description,image_url",{is_active:"eq.true"},"order=name.asc").catch(()=>[]);products=await C.table.list("products","id,seller_id,category_id,name,description,price,compare_at_price,stock,image_url,status,categories(name),seller_stores(store_name)",{status:"eq.approved"},"order=created_at.desc").catch(()=>[]);orders=await C.table.list("orders","id,order_number,status,total,delivery_status,created_at",{user_id:"eq."+user.id},"order=created_at.desc").catch(()=>[]);const ads=await C.table.list("addresses","id,full_name,phone,address_line1,address_line2,city,state,postal_code,country,is_default,location",{user_id:"eq."+user.id},"order=is_default.desc,created_at.desc").catch(()=>[]);address=ads[0]||null}
async function loadSeller(){store=(await C.rpc("get_my_seller_store",{}).catch(()=>[]))[0]||null;sellerProducts=store?await C.table.list("products","id,category_id,name,description,price,cost_price,stock,sku,status,image_url",{seller_id:"eq."+store.id},"order=created_at.desc").catch(()=>[]):[];sellerOrderCount=0;sellerGross=0;sellerCost=0;sellerCommission=0;sellerProfit=0;sellerOrders=[];if(store){const items=await C.table.list("order_items","id,order_id,total_price,quantity,unit_cost,cost_total",{seller_id:"eq."+store.id},"order=created_at.desc").catch(()=>[]);sellerOrderCount=new Set(items.map(x=>x.order_id)).size;sellerGross=items.reduce((s,x)=>s+Number(x.total_price||0),0);sellerCost=items.reduce((s,x)=>s+Number(x.cost_total||0),0);const orderIds=[...new Set(items.map(x=>x.order_id))];sellerOrders=orderIds.length?await C.table.list("orders","id,order_number,status,total,delivery_provider,delivery_status,shipping_address,created_at",{id:orderIds},"order=created_at.desc").catch(()=>[]):[];const comm=await C.table.list("platform_commissions","order_id,commission_amount",{seller_id:"eq."+store.id},"order=created_at.desc").catch(()=>[]);sellerCommission=comm.reduce((s,x)=>s+Number(x.commission_amount||0),0);sellerProfit=sellerGross-sellerCost-sellerCommission}}
function home(){const cs=cats.slice(0,6).map(c=>"<button class='card category' onclick='chooseCategory(\""+esc(c.id)+"\")'><div class='emoji'>▦</div><b>"+esc(c.name)+"</b><span class='small muted'>"+esc(c.description||"")+"</span></button>").join("");const ps=products.slice(0,4).map(productCard).join("");return top()+"<div class='page'><div class='search'><span>⌕</span><input value='"+esc(searchTerm)+"' placeholder='Buscar productos, marcas o tiendas...' oninput='searchTerm=this.value;render()'></div><div class='hero'><span class='kicker'>VaniDaxi</span><h1>Compra, vende y recibe.</h1><p>Los productos que ves aquí provienen de publicaciones aprobadas.</p><button class='cta' onclick='go(\"categories\")'>Explorar ahora →</button></div><div class='section'><h2>Categorías</h2><button class='link' onclick='go(\"categories\")'>Ver todas →</button></div><div class='grid3'>"+cs+"</div><div class='section'><h2>Productos</h2></div><div class='grid2'>"+(ps||"<div class='card empty' style='grid-column:1/-1'><div style='font-size:45px'>🛍️</div><h3>Aún no hay productos publicados</h3><p class='muted'>Aparecerán cuando un vendedor publique y el producto sea aprobado.</p></div>")+"</div></div>"+nav()}
function productCard(p){return "<button class='card product' onclick='showProduct(\""+esc(p.id)+"\")'><div class='photo'>"+(p.image_url?"<img src='"+esc(p.image_url)+"' style='max-width:82%;max-height:120px'>":"🛍️")+"</div><div class='body'><div class='small muted'>"+esc(p.categories?.name||"Producto")+"</div><b>"+esc(p.name)+"</b><div class='price'>"+money(p.price)+"</div><div class='small muted'>Stock: "+Number(p.stock||0)+"</div></div></button>"}
function chooseCategory(id){localStorage.setItem("vani_category",id);go("categories")}
function categoryPage(){const chosen=localStorage.getItem("vani_category"),visible=products.filter(p=>(!chosen||p.category_id===chosen)&&((p.name+" "+(p.categories?.name||"")).toLowerCase().includes(searchTerm.toLowerCase())));return top()+"<div class='page'><div class='section'><h2>Categorías</h2><button class='link' onclick='localStorage.removeItem(\"vani_category\");render()'>Todas</button></div><div class='grid3'>"+cats.map(c=>"<button class='card category "+(chosen===c.id?"":"soft")+"' onclick='chooseCategory(\""+esc(c.id)+"\")'><div class='emoji'>▦</div><b>"+esc(c.name)+"</b></button>").join("")+"</div><div class='search' style='margin-top:12px'><span>⌕</span><input value='"+esc(searchTerm)+"' placeholder='Buscar productos...' oninput='searchTerm=this.value;render()'></div><div class='grid2'>"+(visible.length?visible.map(productCard).join(""):"<div class='card empty' style='grid-column:1/-1'><div style='font-size:44px'>🔎</div><h3>No hay productos publicados aquí</h3><p class='muted'>Los resultados aparecerán cuando existan publicaciones aprobadas.</p></div>")+"</div></div>"+nav()}
function showProduct(id){const p=products.find(x=>x.id===id);if(!p)return;openModal("<button class='close' onclick='closeModal()'>✕</button><div class='photo' style='border-radius:18px'>"+(p.image_url?"<img src='"+esc(p.image_url)+"' style='max-width:82%;max-height:180px'>":"🛍️")+"</div><div class='small muted' style='margin-top:11px'>"+esc(p.categories?.name||"Producto")+"</div><h2>"+esc(p.name)+"</h2><p class='muted'>"+esc(p.description||"Sin descripción.")+"</p><div class='stat'>"+money(p.price)+"</div><div class='row'><span class='badge'>Stock "+Number(p.stock||0)+"</span><span class='badge orange'>"+esc(p.seller_stores?.store_name||"Vendedor")+"</span></div><button class='btn primary full' style='margin-top:13px' onclick='addCart(\""+esc(p.id)+"\")'>Agregar al carrito</button>")}
function addCart(id){const i=cart.find(x=>x.product_id===id);if(i)i.qty=Math.min(100,i.qty+1);else cart.push({product_id:id,qty:1});saveCart();closeModal();toast("Agregado al carrito")}
function cartPage(){const rows=cart.map(i=>{const p=products.find(x=>x.id===i.product_id);return p?"<div class='listitem'><div style='font-size:27px'>🛍️</div><div class='grow'><b>"+esc(p.name)+"</b><div class='small muted'>"+money(p.price)+" · Cantidad "+i.qty+"</div></div><button class='btn secondary' onclick='removeCart(\""+esc(p.id)+"\")'>Quitar</button></div>":""}).join("");const total=cart.reduce((s,i)=>{const p=products.find(x=>x.id===i.product_id);return s+(p?p.price*i.qty:0)},0);return top()+"<div class='page'><div class='section'><h2>Mi carrito</h2></div>"+(rows||"<div class='card empty'><div style='font-size:48px'>🛒</div><h3>Tu carrito está vacío</h3><button class='btn primary' onclick='go(\"home\")'>Explorar productos</button></div>")+(rows?"<div class='card' style='margin-top:12px'><div class='row'><span>Total</span><b style='font-size:23px'>"+money(total)+"</b></div><button class='btn primary full' style='margin-top:12px' onclick='checkout()'>Continuar al pedido</button></div>":"")+"</div>"+nav()}
function removeCart(id){cart=cart.filter(x=>x.product_id!==id);saveCart();render()}
function checkout(){if(!cart.length)return;let h="<button class='close' onclick='closeModal()'>✕</button><h2>Confirmar pedido</h2>";if(!address)h+="<p class='muted'>Necesitas una dirección de entrega.</p><button class='btn outline full' onclick='addressForm()'>Agregar dirección</button>";else h+="<div class='card'><b>"+esc(address.full_name)+"</b><div class='small muted'>"+esc(address.address_line1)+", "+esc(address.city)+", "+esc(address.state)+" "+esc(address.postal_code)+"</div></div><button class='btn primary full' style='margin-top:12px' onclick='placeOrder()'>Crear pedido</button>";openModal(h)}
async function placeOrder(){try{const id=await C.rpc("create_commercial_order",{p_items:cart,p_shipping_address:address,p_promotion_id:null,p_promo_code:null});const pay=await C.edge("mercadopago-checkout","POST",{order_id:id});cart=[];saveCart();closeModal();if(pay&&pay.checkout_url){window.location.href=pay.checkout_url;return}await loadBase();go("orders");toast("Pedido creado: "+String(id).slice(0,8))}catch(e){toast(e.message||"No se pudo crear el pedido")}}
async function showDeliveryPin(orderId){try{const rows=await C.rpc("get_my_delivery_code",{p_order_id:orderId,p_kind:"delivery"});const code=Array.isArray(rows)?rows[0]?.code:rows?.code;if(!code)throw Error("El PIN todavía no está disponible.");openModal("<button class='close' onclick='closeModal()'>✕</button><h2>PIN de entrega</h2><p class='muted'>Comparte este PIN únicamente cuando el repartidor esté contigo.</p><div class='stat' style='text-align:center;letter-spacing:8px'>"+esc(code)+"</div>")}catch(e){toast(e.message||"No se pudo obtener el PIN")}}
function ordersPage(){return top()+"<div class='page'><div class='section'><h2>Mis pedidos</h2></div>"+(orders.length?"<div class='list'>"+orders.map(o=>"<div class='card'><div class='row'><div class='grow'><b>"+esc(o.order_number)+"</b><div class='small muted'>"+new Date(o.created_at).toLocaleString("es-MX")+"</div></div><span class='badge "+(o.delivery_status==="delivered"?"green":"")+"'>"+esc(o.delivery_status||o.status)+"</span></div><div class='row' style='margin-top:9px'><span>Total</span><b>"+money(o.total)+"</b></div><div class='row' style='margin-top:10px'><span class='small muted'>Entrega: "+esc(o.delivery_status||o.status)+"</span><button class='btn secondary' onclick='showDeliveryPin(\""+esc(o.id)+"\")'>Ver PIN</button></div></div>").join("")+"</div>":"<div class='card empty'><div style='font-size:45px'>📦</div><h3>No tienes pedidos registrados</h3><p class='muted'>Aquí aparecerán tus compras reales.</p></div>")+"</div>"+nav()}
function addressForm(){openModal("<button class='close' onclick='closeModal()'>✕</button><h2>Dirección de entrega</h2><label class='label'>Nombre</label><input id='an' class='input' value='"+esc(address?.full_name||profile.full_name||"")+"'><label class='label'>Teléfono</label><input id='ap' class='input' value='"+esc(address?.phone||profile.phone||"")+"'><label class='label'>Calle y número</label><input id='al1' class='input' value='"+esc(address?.address_line1||"")+"'><label class='label'>Colonia / referencia</label><input id='al2' class='input' value='"+esc(address?.address_line2||"")+"'><label class='label'>Ciudad</label><input id='ac' class='input' value='"+esc(address?.city||"Mazatlán")+"'><label class='label'>Estado</label><input id='as' class='input' value='"+esc(address?.state||"Sinaloa")+"'><label class='label'>Código postal</label><input id='az' class='input' value='"+esc(address?.postal_code||"")+"'><button class='btn primary full' style='margin-top:13px' onclick='saveAddress()'>Guardar</button>")}
function getGps(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(Error("GPS no disponible en este dispositivo."));navigator.geolocation.getCurrentPosition(p=>resolve({lat:Number(p.coords.latitude.toFixed(6)),lng:Number(p.coords.longitude.toFixed(6)),accuracy_m:Number(p.coords.accuracy||0)}),e=>reject(Error("No se pudo obtener la ubicación: "+e.message)),{enableHighAccuracy:true,timeout:10000,maximumAge:15000})})}
async function saveAddress(){try{const row={user_id:user.id,full_name:$("#an").value.trim(),phone:$("#ap").value.trim(),address_line1:$("#al1").value.trim(),address_line2:$("#al2").value.trim(),city:$("#ac").value.trim(),state:$("#as").value.trim(),postal_code:$("#az").value.trim(),country:"México",is_default:true,location:address?.location||null};if(!row.full_name||!row.address_line1||!row.city||!row.state||!row.postal_code)throw Error("Completa la dirección.");try{row.location=await getGps()}catch(_){}if(address)await C.table.update("addresses",row,{id:"eq."+address.id});else await C.table.insert("addresses",row);closeModal();await loadBase();toast(row.location?"Dirección guardada con ubicación":"Dirección guardada sin GPS");if(page==="cart")render()}catch(e){toast(e.message||"No se pudo guardar")}}
function accountPage(){return top()+"<div class='page'><div class='card'><div class='row'><span class='v'>V</span><div class='grow'><h2 style='margin:0'>"+esc(profile.full_name||"Mi cuenta")+"</h2><div class='small muted'>"+esc(user.email||"")+"</div></div><span class='badge'>"+esc(role==="seller"?"Vendedor":"Comprador")+"</span></div></div><div class='section'><h2>Dirección</h2></div>"+(address?"<div class='card'><b>"+esc(address.full_name)+"</b><div class='small muted'>"+esc(address.address_line1)+", "+esc(address.city)+", "+esc(address.state)+" "+esc(address.postal_code)+"</div><button class='btn secondary' style='margin-top:10px' onclick='addressForm()'>Editar</button></div>":"<div class='card empty'><p class='muted'>No tienes dirección guardada.</p><button class='btn primary' onclick='addressForm()'>Agregar dirección</button></div>")+(role==="seller"?"<div class='section'><h2>Mi tienda</h2></div><div class='card'><div class='row'><div class='grow'><b>"+esc(store?.store_name||"Tienda pendiente")+"</b><div class='small muted'>Estado: "+esc(store?.status||"pending")+"</div></div><button class='btn secondary' onclick='go(\"seller\")'>Abrir panel</button></div></div>":"")+"<button class='btn danger full' style='margin-top:18px' onclick='logout()'>Cerrar sesión</button></div>"+nav()}
async function showPickupPin(orderId){try{const rows=await C.rpc("get_my_delivery_code",{p_order_id:orderId,p_kind:"pickup"});const code=Array.isArray(rows)?rows[0]?.code:rows?.code;if(!code)throw Error("El PIN de recolección todavía no está disponible.");openModal("<button class='close' onclick='closeModal()'>✕</button><h2>PIN de recolección</h2><p class='muted'>Dáselo al repartidor únicamente cuando esté recogiendo el paquete.</p><div class='stat' style='text-align:center;letter-spacing:8px'>"+esc(code)+"</div>")}catch(e){toast(e.message||"No se pudo obtener el PIN")}}
function pickupForm(orderId){openModal("<button class='close' onclick='closeModal()'>✕</button><h2>Solicitar recolección</h2><p class='small muted'>La ubicación GPS se pedirá únicamente al guardar esta solicitud.</p><label class='label'>Calle y número</label><input id='pk_addr' class='input' placeholder='Dirección del vendedor'><label class='label'>Ciudad</label><input id='pk_city' class='input' value='Mazatlán'><label class='label'>Estado</label><input id='pk_state' class='input' value='Sinaloa'><label class='label'>Paquetes</label><input id='pk_count' class='input' type='number' min='1' value='1'><button class='btn primary full' style='margin-top:13px' onclick='savePickupRequest(\""+esc(orderId)+"\")'>Crear solicitud</button>")}
async function savePickupRequest(orderId){try{const addressText=$("#pk_addr").value.trim();if(!addressText)throw Error("Indica la dirección de recolección.");const gps=await getGps();await C.rpc("create_seller_package_request",{p_order_id:orderId,p_pickup_address:{address_line1:addressText,city:$("#pk_city").value.trim()||"Mazatlán",state:$("#pk_state").value.trim()||"Sinaloa",country:"México",lat:gps.lat,lng:gps.lng,accuracy_m:gps.accuracy_m},p_pickup_window_start:new Date().toISOString(),p_pickup_window_end:new Date(Date.now()+2*60*60*1000).toISOString(),p_package_count:Math.max(1,Number($("#pk_count").value||1)),p_weight_kg:null,p_dimensions:null,p_ready_at:new Date().toISOString()});closeModal();await loadSeller();render();toast("Solicitud de recolección creada")}catch(e){toast(e.message||"No se pudo crear la solicitud")}}
function sellerPage(){const inv=sellerProducts.length?sellerProducts.map(p=>"<div class='listitem'><div style='font-size:27px'>📦</div><div class='grow'><b>"+esc(p.name)+"</b><div class='small muted'>"+money(p.price)+" · Stock "+Number(p.stock||0)+"</div></div><span class='badge'>"+esc(p.status)+"</span></div>").join(""):"<div class='card empty'><div style='font-size:44px'>📦</div><h3>No hay productos</h3><p class='muted'>Crea tu primer producto.</p></div>";const ownOrders=sellerOrders.length?sellerOrders.map(o=>"<div class='listitem'><div class='grow'><b>"+esc(o.order_number)+"</b><div class='small muted'>"+esc(o.status)+" · Entrega: "+esc(o.delivery_status||"pending")+"</div><div class='small'>"+money(o.total)+"</div></div>"+(o.delivery_provider==="vanidaxi"&&["paid","processing","shipped"].includes(o.status)?(o.delivery_status==="pending"||o.delivery_status==="preparing"?"<button class='btn primary' onclick='pickupForm(\""+esc(o.id)+"\")'>Solicitar recolección</button>":"<button class='btn secondary' onclick='showPickupPin(\""+esc(o.id)+"\")'>Ver PIN</button>"):"")+"</div>").join(""):"<div class='card empty'><p class='muted'>Aún no hay pedidos de esta tienda.</p></div>";return top()+"<div class='page'><div class='hero'><span class='kicker'>Panel del vendedor</span><h1>"+esc(store?.store_name||"Mi tienda")+"</h1><p>Inventario, ingresos, egresos y logística conectados a tus datos reales.</p></div><div class='grid2' style='margin-top:12px'><div class='card'><div class='small muted'>Productos</div><div class='stat'>"+sellerProducts.length+"</div></div><div class='card'><div class='small muted'>Pedidos</div><div class='stat'>"+sellerOrderCount+"</div></div><div class='card'><div class='small muted'>Ingresos</div><div class='stat'>"+money(sellerGross)+"</div></div><div class='card'><div class='small muted'>Egresos</div><div class='stat'>"+money(sellerCost)+"</div></div><div class='card'><div class='small muted'>Comisión VaniDaxi</div><div class='stat'>"+money(sellerCommission)+"</div></div><div class='card'><div class='small muted'>Ganancia</div><div class='stat'>"+money(sellerProfit)+"</div></div></div><div class='section'><h2>Inventario</h2><button class='btn primary' onclick='productForm()'>＋ Producto</button></div><div class='list'>"+inv+"</div><div class='section'><h2>Pedidos y logística</h2></div><div class='list'>"+ownOrders+"</div><div class='section'><h2>Tienda y configuración</h2></div><div class='card'><b>Operación</b><p class='small muted'>En Mazatlán puedes solicitar recolección de tus pedidos. Fuera de la zona el pedido puede continuar con paquetería del vendedor.</p><button class='btn secondary' onclick='storeForm()'>Configurar tienda</button></div><div class='card' style='margin-top:10px'><b>Premium</b><p class='small muted'>Solicita almacenamiento y preparación desde VaniDaxi.</p><button class='btn outline' onclick='premium()'>Solicitar Premium</button></div></div>"+nav()}
function storeForm(){openModal("<button class='close' onclick='closeModal()'>✕</button><h2>Configurar tienda</h2><label class='label'>Nombre</label><input id='sn' class='input' value='"+esc(store?.store_name||"")+"'><label class='label'>Descripción</label><textarea id='sd' class='input' rows='4'>"+esc(store?.description||"")+"</textarea><button class='btn primary full' style='margin-top:13px' onclick='saveStore()'>Guardar</button>")}
async function saveStore(){try{store=(await C.rpc("upsert_my_seller_store",{p_store_name:$("#sn").value.trim(),p_description:$("#sd").value.trim(),p_logo_url:null,p_banner_url:null}))[0]||store;closeModal();await loadSeller();render();toast("Tienda guardada")}catch(e){toast(e.message||"No se pudo guardar")}}
function productForm(){openModal("<button class='close' onclick='closeModal()'>✕</button><h2>Nuevo producto</h2><label class='label'>Categoría</label><select id='pc' class='input'>"+cats.map(c=>"<option value='"+c.id+"'>"+esc(c.name)+"</option>").join("")+"</select><label class='label'>Nombre</label><input id='pn' class='input'><label class='label'>Descripción</label><textarea id='pd' class='input' rows='3'></textarea><label class='label'>Precio</label><input id='pp' class='input' type='number' step='0.01'><label class='label'>Costo</label><input id='pk' class='input' type='number' step='0.01'><label class='label'>Stock</label><input id='ps' class='input' type='number' value='1'><label class='label'>SKU</label><input id='pu' class='input'><label class='label'>Imagen URL opcional</label><input id='pi' class='input'><button class='btn primary full' style='margin-top:13px' onclick='saveProduct()'>Crear producto</button>")}
async function saveProduct(){try{const name=$("#pn").value.trim(),price=Number($("#pp").value),stock=Number($("#ps").value||0);if(!name||price<0||stock<0)throw Error("Completa nombre, precio y stock.");await C.rpc("create_seller_product",{p_category_id:$("#pc").value,p_name:name,p_description:$("#pd").value.trim(),p_price:price,p_compare_at_price:null,p_cost_price:Number($("#pk").value||0),p_stock:stock,p_sku:$("#pu").value.trim()||null,p_image_url:$("#pi").value.trim()||null,p_images:[]});closeModal();await loadSeller();render();toast("Producto creado y enviado a revisión")}catch(e){toast(e.message||"No se pudo crear el producto")}}
async function premium(){try{await C.rpc("request_seller_premium",{p_monthly_price:0});toast("Solicitud enviada")}catch(e){toast(e.message||"No se pudo enviar la solicitud")}}
async function logout(){C.signOut();user=null;profile=null;render()}
function render(){if(!user){loginView();return}if(page==="home")app.innerHTML=home();else if(page==="categories")app.innerHTML=categoryPage();else if(page==="cart")app.innerHTML=cartPage();else if(page==="orders")app.innerHTML=ordersPage();else if(page==="account")app.innerHTML=accountPage();else if(page==="seller")app.innerHTML=sellerPage();else app.innerHTML=home()}
(async()=>{try{await boot()}catch(e){C.signOut();loginView()}})();
</script></body></html>
