<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08060f"><title>VaniDaxi</title><style>:root{--p:#7b28ff;--p2:#e33ce0;--bg:#08060f}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:#fff}.app{max-width:520px;min-height:100vh;margin:auto;background:#f7f7fa;color:#17131d;padding-bottom:80px}.top{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #eee;padding:11px 15px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px;font-weight:1000;font-size:20px}.logo{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#5b1cff,#f046d7);display:grid;place-items:center;color:#fff;font-weight:1000}.brand span{background:linear-gradient(90deg,#16121a 40%,#7b28ff 58%,#e33ce0);-webkit-background-clip:text;color:transparent}.wrap{padding:14px 16px}.search{background:#f0eef3;border-radius:15px;padding:12px;display:flex;gap:8px}.search input{border:0;background:transparent;outline:0;flex:1}.hero{margin-top:12px;background:linear-gradient(135deg,#5a1dff,#9236ff 55%,#eb44d8);border-radius:25px;padding:20px;min-height:205px;position:relative;overflow:hidden;color:#fff}.hero h1{font-size:30px;max-width:245px;line-height:1.04}.bag{position:absolute;right:28px;bottom:25px;width:84px;height:78px;background:#101017;border-radius:22px}.bag:after{content:"V";display:grid;place-items:center;height:100%;color:#c84cff;font-weight:1000;font-size:40px}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 0 9px}.cats,.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.grid{grid-template-columns:1fr 1fr}.cat{border:0;background:none;color:#221c28;text-align:center}.dot{background:#eeeaf2;border-radius:15px;padding:15px 5px;font-size:22px}.product{background:#fff;border-radius:20px;overflow:hidden;border:1px solid #ece7f0}.photo{height:145px;background:#f1edf5;display:grid;place-items:center;font-size:48px}.body{padding:11px}.body h3{min-height:35px;font-size:14px}.price{font-size:18px;font-weight:1000}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900}.primary{background:linear-gradient(90deg,#6b24ff,#c03de8);color:#fff}.dark{background:#19131f;color:#fff}.full{width:100%}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #e1dce5;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}.grow{flex:1}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #e5e0e8;display:grid;grid-template-columns:repeat(5,1fr);z-index:5;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.nav{border:0;background:none;color:#817888;font-size:9px}.nav b{display:block;font-size:18px}.active{color:#7224ff}.auth{min-height:100vh;background:radial-gradient(circle at 50% -10%,#4d176c,#180e23 40%,#08060f 72%);padding:28px 18px}.auth .logo{width:82px;height:82px;margin:auto;font-size:40px}.auth h1{text-align:center;font-size:34px;color:#fff}.auth p{text-align:center;color:#c8bfd0}.authCard{background:#120d1d;border:1px solid #39284a;border-radius:23px;padding:16px;color:#fff;margin-top:24px}.input{width:100%;padding:12px;border:1px solid #3b2b4a;background:#0f0a16;color:#fff;border-radius:13px}.label{font-size:10px;font-weight:900;display:block;margin:11px 0 6px}.socials{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.social{border:1px solid #3b2b4a;background:#17101f;color:#fff;border-radius:13px;padding:10px;font-weight:900}.promo{display:grid;gap:8px;margin-top:12px}.promo div{background:#120d1d;border:1px solid #39284a;border-radius:16px;padding:12px;color:#fff}.modal{position:fixed;inset:0;background:#050307b8;display:none;align-items:flex-end;z-index:20}.on{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px}.close{float:right}.small{font-size:11px;color:#777}</style></head><body><div id="app" class="app"></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><script src="app-config.js"></script><script src="supabase-client.js"></script><script>
const A=VaniAPI,$=s=>document.querySelector(s);let user=null,page="home",role="customer";const cats=["Tecnología","Moda","Hogar","Deportes","Belleza"],prods=[["Audífonos Bluetooth",499,"🎧"],["Tenis Casual Unisex",899,"👟"],["Bolsa urbana",649,"👜"],["Lámpara minimalista",399,"💡"]];function modal(h){$("#sheet").innerHTML=h;$("#modal").classList.add("on")}function closeModal(){$("#modal").classList.remove("on")}function auth(){app.innerHTML='<div class="auth"><div class="logo">V</div><h1>Vani<span style="color:#c64cff">Daxi</span></h1><p>Tu mundo, más cerca</p><div class="authCard"><h2>Iniciar sesión</h2><label class="label">Correo</label><input id="e" class="input"><label class="label">Contraseña</label><input id="p" class="input" type="password"><button class="btn primary full" style="margin-top:12px" onclick="login()">Iniciar sesión</button><button class="btn" style="width:100%;margin-top:8px;background:#fff" onclick="register()">Crear cuenta</button><div style="text-align:center;font-size:10px;color:#8c8192;margin:14px 0">O continúa con</div><div class="socials"><button class="social" onclick="A.auth.oauth(&quot;google&quot;)">G</button><button class="social" onclick="A.auth.oauth(&quot;facebook&quot;)">f</button><button class="social" onclick="A.auth.oauth(&quot;apple&quot;)"></button><button class="social" onclick="alert(&quot;SMS se conecta en la configuración final&quot;)">☎</button></div></div><div class="promo"><div><b>🛒 Compradores</b><div class="small" style="color:#bbb">Compra y recibe.</div></div><div><b>🏪 Vendedores</b><div class="small" style="color:#bbb">Publica y administra.</div></div><div><b>🚚 VaniReparte</b><div class="small" style="color:#bbb">Aplicación independiente.</div></div><button class="btn dark full" onclick="demo()">Ver demostración</button></div></div>'}function login(){if(A.demo){user={name:"Usuario demo",email:$("#e").value||"demo@local"};render();return}A.auth.signIn($("#e").value,$("#p").value).then(()=>A.auth.me()).then(u=>{user=u;render()}).catch(e=>alert(e.message))}function register(){modal('<button class="close" onclick="closeModal()">✕</button><h2>Crear cuenta</h2><label class="label">Tipo</label><select id="r" class="input"><option value="customer">Comprador</option><option value="seller">Vendedor</option></select><label class="label">Nombre</label><input id="n" class="input"><label class="label">Correo</label><input id="re" class="input" type="email"><label class="label">Contraseña</label><input id="rp" class="input" type="password"><button class="btn primary full" style="margin-top:12px" onclick="createAccount()">Crear cuenta</button>')}function createAccount(){if(A.demo){user={name:$("#n").value||"Usuario",email:$("#re").value||"demo@local"};role=$("#r").value;closeModal();render();return}A.auth.signUp($("#re").value,$("#rp").value,{account_type:"customer",onboarding_role:"customer",name:$("#n").value,full_name:$("#n").value}).then(()=>{alert("Revisa tu correo");closeModal()}).catch(e=>alert(e.message))}function demo(){user={name:"Usuario demo",email:"demo@vanidaxi.local"};render()}function nav(){return '<div class="bottom"><button class="nav '+(page=="home"?"active":"")+'" onclick="go('home')"><b>⌂</b>Inicio</button><button class="nav '+(page=="cats"?"active":"")+'" onclick="go('cats')"><b>▦</b>Categorías</button><button class="nav '+(page=="cart"?"active":"")+'" onclick="go('cart')"><b>🛒</b>Carrito</button><button class="nav '+(page=="orders"?"active":"")+'" onclick="go('orders')"><b>▣</b>Pedidos</button><button class="nav '+(page=="account"?"active":"")+'" onclick="go('account')"><b>◉</b>Perfil</button></div>'}function top(){return '<div class="top"><div class="brand"><div class="logo">V</div><span>VaniDaxi</span></div><div>♢ ⚙</div></div>'}function home(){return top()+'<div class="wrap"><div class="search">⌕ <input placeholder="Buscar productos, tiendas o categorías"></div><div class="hero"><div>VaniDaxi · COMPRA Y VENDE</div><h1>Lo que necesitas, en un solo lugar</h1><p>Compra fácil, seguro y rápido.</p><button class="btn primary" onclick="go('cats')">Explorar ahora</button><div class="bag"></div></div><div class="section"><h2>Categorías</h2><button style="border:0;background:none;color:#7224ff" onclick="go('cats')">Ver todo</button></div><div class="cats">'+cats.map((c,i)=>'<button class="cat"><div class="dot">'+["⌘","✦","⌂","◈","✿"][i]+'</div><span>'+c+'</span></button>').join("")+'</div><div class="section"><h2>Ofertas especiales</h2></div><div class="grid">'+prods.map((p,i)=>'<div class="product"><div class="photo">'+p[2]+'</div><div class="body"><div class="small">'+cats[i%5]+'</div><h3>'+p[0]+'</h3><div class="price">$'+p[1]+'.00</div><button class="btn primary full" onclick="add('+i+')">Agregar</button></div></div>').join("")+'</div><div class="card" style="margin-top:12px"><b>Vende en VaniDaxi</b><div class="small">Panel con inventario, ingresos, egresos y ganancias.</div><button class="btn primary" style="margin-top:9px" onclick="role='seller';page='seller';render()">Quiero ser vendedor</button></div></div>'+nav()}function catsPage(){return top()+'<div class="wrap"><div class="section"><h2>Categorías</h2></div><div class="grid">'+cats.map(c=>'<button class="item" onclick="go(\'home\')"><span class="grow"><b>'+c+'</b></span>›</button>').join("")+'</div></div>'+nav()}function add(i){modal('<button class="close" onclick="closeModal()">✕</button><h2>'+prods[i][0]+'</h2><div style="font-size:60px;text-align:center;padding:15px">'+prods[i][2]+'</div><div class="price">$'+prods[i][1]+'.00</div><button class="btn primary full" onclick="closeModal();go(\'cart\')">Agregar al carrito</button>')}function cartPage(){return top()+'<div class="wrap"><h2>Carrito</h2><div class="item"><span>🎧 Audífonos Bluetooth</span><b>$499.00</b></div><div class="card" style="margin-top:10px"><div><b>Total $499.00</b></div><button class="btn primary full" style="margin-top:10px" onclick="alert(\'El checkout real se conecta después de configurar pagos\')">Continuar</button></div></div>'+nav()}function ordersPage(){return top()+'<div class="wrap"><h2>Mis pedidos</h2><div class="card"><h3>No hay pedidos todavía</h3><div class="small">Cuando la conexión esté activa aquí aparecerán los pedidos reales.</div></div></div>'+nav()}function account(){return top()+'<div class="wrap"><div class="item"><div class="logo">V</div><div class="grow"><b>'+user.name+'</b><div class="small">'+user.email+'</div></div><span>'+role+'</span></div><h2>Configuración</h2><div class="list"><div class="item">📍 <span class="grow">Dirección</span>›</div><div class="item">💬 <span class="grow">Ayuda y soporte</span>›</div><div class="item">🔔 <span class="grow">Notificaciones</span>›</div></div><button class="btn dark full" style="margin-top:12px" onclick="user=null;auth()">Cerrar sesión</button></div>'+nav()}function seller(){return top()+'<div class="wrap"><div class="hero" style="min-height:0"><div>PANEL DEL VENDEDOR</div><h1>Mi tienda</h1><p>Todo tu negocio en un solo lugar.</p></div><div class="section"><h2>Resumen</h2></div><div class="grid"><div class="item"><span>Ventas</span><b>$2,450</b></div><div class="item"><span>Pedidos</span><b>18</b></div><div class="item"><span>Ganancias</span><b>$1,960</b></div><div class="item"><span>Inventario</span><b>24</b></div></div><div class="section"><h2>Últimos pedidos</h2></div><div class="list"><div class="item"><span class="grow">#VD-1024 · En preparación</span><b>$899</b></div><div class="item"><span class="grow">#VD-1023 · En camino</span><b>$499</b></div></div></div>'+nav()}function go(p){page=p;render()}function render(){if(!user)return auth();app.innerHTML=page=="home"?home():page=="cats"?catsPage():page=="cart"?cartPage():page=="orders"?ordersPage():page=="seller"?seller():account()}render();</script></body></html>
