<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c2346"><title>VaniDaxi</title>
<style>
:root{--navy:#0b2346;--navy2:#173a70;--orange:#ff8b00;--orange2:#ffb51b;--bg:#f5f7fb;--card:#fff;--ink:#102447;--muted:#77839a;--line:#e4e9f1;--green:#15a875;--red:#cf4050;--shadow:0 10px 28px rgba(19,39,73,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;background:#f8fafc;padding-bottom:84px}.top{height:64px;position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:21px}.brand .v{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:var(--navy);display:grid;place-items:center;font-size:22px;font-weight:1000}.actions{display:flex;gap:7px}.icon{width:39px;height:39px;border:1px solid var(--line);background:#f5f7fb;border-radius:13px;color:var(--navy)}
.page{padding:14px 15px 100px}.hero{border-radius:25px;padding:22px;background:linear-gradient(145deg,#0e294f,#19437c);color:#fff}.hero .kicker{display:inline-block;background:#ffffff18;border:1px solid #ffffff22;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900}.hero h1{font-size:31px;line-height:1.04;margin:15px 0 10px;letter-spacing:-.5px}.hero p{margin:0;color:#d7e1f4}.cta{margin-top:16px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#11223e;border:0;border-radius:14px;padding:13px 16px;font-weight:900}.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:11px 13px;border-radius:15px;margin-bottom:13px}.search input{border:0;outline:0;flex:1;background:transparent;color:var(--ink)}
.section{display:flex;align-items:center;justify-content:space-between;margin:19px 0 10px}.section h2{font-size:19px;margin:0}.link{border:0;background:transparent;color:#2d67d8;font-weight:900}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:14px;box-shadow:var(--shadow)}.soft{background:linear-gradient(145deg,#fff,#f3f7ff)}.category{min-height:108px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-align:left}.category .emoji{height:58px;background:#edf3ff;border-radius:15px;display:grid;place-items:center;font-size:30px}.muted{color:var(--muted)}.small{font-size:12px}.empty{text-align:center;padding:34px 15px}.product{padding:0;overflow:hidden}.photo{height:155px;background:radial-gradient(circle,#fff,#edf2f8);display:grid;place-items:center;font-size:60px}.product .body{padding:13px}.price{font-size:20px;font-weight:900;margin-top:3px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eef2ff;color:#3455b7;font-size:10px;font-weight:900}.badge.green{background:#e9f8f1;color:#097d54}.badge.orange{background:#fff1d9;color:#9b5c00}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900}.primary{background:var(--navy);color:#fff}.secondary{background:#eef2f8;color:var(--navy)}.outline{background:#fff;color:var(--navy);border:1px solid #cfd8e7}.danger{background:#fff0f2;color:var(--red)}.full{width:100%}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.list{display:grid;gap:9px}.listitem{display:flex;gap:10px;align-items:center;padding:13px;background:#fff;border:1px solid var(--line);border-radius:16px}.stat{font-size:26px;font-weight:900;margin:4px 0}.input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;outline:none;background:#fff}.label{font-size:11px;font-weight:900;margin:10px 0 6px;display:block}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20}.nav{border:0;background:transparent;color:#7a879d;font-size:9px}.nav b{display:block;font-size:18px;line-height:18px}.nav.active{color:var(--orange);font-weight:900}
.modal{position:fixed;inset:0;background:#0b1d3b8f;display:none;align-items:end;z-index:40}.modal.show{display:flex}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px}.close{float:right;border:0;background:#f2f4f7;width:35px;height:35px;border-radius:11px}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);padding:11px 14px;border-radius:12px;background:#142747;color:#fff;z-index:60;display:none;font-size:12px}.toast.show{display:block}
.tabs{display:flex;gap:7px;overflow:auto}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;white-space:nowrap}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.notice{padding:11px 12px;border-radius:13px;background:#eef5ff;color:#36537c;font-size:11px;line-height:1.45}.warn{background:#fff7e8;color:#875c12}.ok{background:#eaf8f2;color:#0b7650}
@media(min-width:700px){.app{box-shadow:0 0 0 1px #dfe4eb}}
</style></head>
<body><div id="app" class="app"></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<script src="app-config.js"></script><script src="supabase-client.js"></script>
<script>
const C=window.VaniCore, app=document.getElementById('app'), toastEl=document.getElementById('toast');
let role='customer', page='home', profile=null, user=null, cats=[], products=[], cart=JSON.parse(localStorage.getItem('vani_cart')||'[]'), address=null, orders=[], store=null, sellerProducts=[], searchTerm='';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function money(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2})}
function showToast(m){toastEl.textContent=m;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2200)}
function saveCart(){localStorage.setItem('vani_cart',JSON.stringify(cart))}
function top(extra=''){return '<div class="top"><div class="brand"><span class="v">V</span>VaniDaxi</div><div class="actions">'+extra+'</div></div>'}
function nav(){return '<div class="bottom"><button class="nav '+(page==='home'?'active':'')+'" onclick="go(\'home\')"><b>⌂</b>Inicio</button><button class="nav '+(page==='categories'?'active':'')+'" onclick="go(\'categories\')"><b>▦</b>Categorías</button><button class="nav '+(page==='cart'?'active':'')+'" onclick="go(\'cart\')"><b>🛒</b>Carrito</button><button class="nav '+(page==='orders'?'active':'')+'" onclick="go(\'orders\')"><b>▣</b>Pedidos</button><button class="nav '+(page==='account'||page==='seller'?'active':'')+'" onclick="go(\'account\')"><b>◉</b>Cuenta</button></div>'}
function go(p){page=p;render()}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function authView(){app.innerHTML='<div class="page" style="padding-top:48px"><div class="hero"><span class="kicker">Compra · vende · recibe</span><h1>Lo que necesitas, cuando lo necesitas.</h1><p>Una sola plataforma para compradores y vendedores.</p></div><div class="card" style="margin-top:12px"><div class="section"><h2>Empieza con tu cuenta</h2></div><button class="btn primary full" onclick="showLogin()">Iniciar sesión</button><button class="btn outline full" style="margin-top:9px" onclick="showRegister('customer')">Crear cuenta de comprador</button><button class="btn outline full" style="margin-top:9px" onclick="showRegister('seller')">Registrarme como vendedor</button></div><div class="grid3" style="margin-top:12px"><div class="card soft"><div style="font-size:28px">🛒</div><b class="small">Compra</b><div class="small muted">Encuentra productos publicados.</div></div><div class="card soft"><div style="font-size:28px">🏪</div><b class="small">Vende</b><div class="small muted">Publica y controla tu tienda.</div></div><div class="card soft"><div style="font-size:28px">🚚</div><b class="small">Recibe</b><div class="small muted">Sigue tus pedidos.</div></div></div></div>'}
function showLogin(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Iniciar sesión</h2><p class="small muted">Usa el correo y contraseña de tu cuenta.</p><label class="label">Correo</label><input id="a_email" class="input" type="email" autocomplete="email"><label class="label">Contraseña</label><input id="a_pass" class="input" type="password" autocomplete="current-password"><button class="btn primary full" style="margin-top:14px" onclick="login()">Entrar</button><button class="link full" style="margin-top:10px" onclick="showRegister(\'customer\')">Crear cuenta</button><div class="notice" style="margin-top:12px">El acceso social queda disponible cuando se activen los proveedores OAuth del proyecto.</div>')}
function showRegister(initial){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Crear cuenta</h2><p class="small muted">Los datos se guardan en VaniDaxi.</p><label class="label">Tipo de cuenta</label><select id="r_role" class="input"><option value="customer" '+(initial==="customer"?'selected':'')+'>Comprador</option><option value="seller" '+(initial==="seller"?'selected':'')+'>Vendedor</option></select><label class="label">Nombre</label><input id="r_name" class="input" autocomplete="name"><label class="label">Correo</label><input id="r_email" class="input" type="email" autocomplete="email"><label class="label">Contraseña</label><input id="r_pass" class="input" type="password" autocomplete="new-password"><label class="label">Confirmar contraseña</label><input id="r_pass2" class="input" type="password"><label class="row" style="margin-top:12px"><input id="r_terms" type="checkbox"> <span class="small">Acepto los términos de VaniDaxi.</span></label><button class="btn primary full" style="margin-top:14px" onclick="register()">Crear cuenta</button>')}
async function login(){try{const e=$('#a_email').value.trim(),p=$('#a_pass').value;if(!e||!p)throw Error('Completa correo y contraseña.');await C.signIn(e,p);closeModal();await boot();showToast('Sesión iniciada');}catch(e){showToast(friendly(e))}}
async function register(){try{const rr=$('#r_role').value,n=$('#r_name').value.trim(),e=$('#r_email').value.trim(),p=$('#r_pass').value,p2=$('#r_pass2').value;if(!n||!e||!p||p!==p2)throw Error('Revisa nombre, correo y contraseñas.');if(p.length<8)throw Error('La contraseña debe tener al menos 8 caracteres.');if(!$('#r_terms').checked)throw Error('Debes aceptar los términos.');const now=new Date().toISOString();const meta={account_type:rr,onboarding_role:rr==='customer'?undefined:rr,name:n,display_name:n,full_name:n,terms_accepted_at:now,terms_version:'v1.0'};await C.signUp(e,p,meta);if(!C.session()){await C.signIn(e,p)}closeModal();await boot();showToast('Cuenta creada');}catch(e){showToast(friendly(e))}}
function friendly(e){let m=e?.message||String(e);m=m.replace(/{"message":"?/g,'').replace(/"}$/,'');if(/invalid login credentials/i.test(m))return 'Correo o contraseña incorrectos.';if(/email not confirmed/i.test(m))return 'Revisa tu correo para confirmar la cuenta.';if(/already registered|already exists/i.test(m))return 'Ese correo ya está registrado.';return m}
async function boot(){user=await C.me();profile=user?await C.profile():null;if(!user||!profile){C.signOut();role='customer';authView();return}role=profile.role||'customer';await loadBase();if(role==='seller')await loadSeller();render()}
async function loadBase(){cats=await C.table.list('categories','id,name,slug,description,image_url',{is_active:'eq.true'},'order=name.asc');products=await C.table.list('products','id,seller_id,category_id,name,description,price,compare_at_price,stock,image_url,status,categories(name),seller_stores(store_name)',{status:'eq.approved'},'order=created_at.desc').catch(()=>[]);orders=await C.table.list('orders','id,order_number,status,total,shipping_address,delivery_status,created_at',{user_id:'eq.'+user.id},'order=created_at.desc').catch(()=>[]);const ad=await C.table.list('addresses','id,full_name,phone,address_line1,address_line2,city,state,postal_code,country,is_default',{user_id:'eq.'+user.id},'order=is_default.desc,created_at.desc').catch(()=>[]);address=ad[0]||null}
async function loadSeller(){store=(await C.rpc('get_my_seller_store',{}).catch(()=>[]))?.[0]||null;sellerProducts=store?await C.table.list('products','id,category_id,name,description,price,cost_price,stock,sku,status,image_url',{seller_id:'eq.'+store.id},'order=created_at.desc').catch(()=>[]):[]}
function buyerHome(){const cs=cats.slice(0,6).map(c=>'<button class="card category soft" onclick="goCat(\''+esc(c.id)+'\')"><div class="emoji">▦</div><b>'+esc(c.name)+'</b><span class="small muted">'+esc(c.description||'')+'</span></button>').join('');const ps=products.slice(0,4).map(productCard).join('');return top('<button class="icon" onclick="showAccountMenu()">⋯</button>')+'<div class="page"><div class="search"><span>⌕</span><input value="'+esc(searchTerm)+'" placeholder="Buscar productos, marcas o tiendas..." oninput="searchTerm=this.value;render()"></div><div class="hero"><span class="kicker">VaniDaxi</span><h1>Compra, vende y recibe en un solo lugar.</h1><p>Encuentra productos reales publicados por vendedores.</p><button class="cta" onclick="go(\'categories\')">Explorar ahora →</button></div><div class="section"><h2>Categorías</h2><button class="link" onclick="go(\'categories\')">Ver todas →</button></div><div class="grid3">'+cs+'</div><div class="section"><h2>Productos</h2></div><div class="grid2">'+(ps||'<div class="card empty" style="grid-column:1/-1"><div style="font-size:48px">🛍️</div><h3>Aún no hay productos publicados</h3><p class="muted">Aquí aparecerán productos aprobados cuando los vendedores los publiquen.</p></div>')+'</div></div>'+nav()}
function productCard(p){return '<button class="card product" onclick="product(\''+p.id+'\')"><div class="photo">'+(p.image_url?'<img src="'+esc(p.image_url)+'" style="max-width:80%;max-height:120px">':'🛍️')+'</div><div class="body"><div class="small muted">'+esc(p.categories?.name||'Producto')+'</div><b>'+esc(p.name)+'</b><div class="price">'+money(p.price)+'</div><div class="small muted">Stock: '+Number(p.stock||0)+'</div></div></button>'}
function goCat(id){localStorage.setItem('vani_cat',id);go('categories')}
function categoryPage(){const chosen=localStorage.getItem('vani_cat');const visible=products.filter(p=>(!chosen||p.category_id===chosen)&&((p.name+' '+(p.categories?.name||'')).toLowerCase().includes(searchTerm.toLowerCase())));return top('<button class="icon" onclick="go(\'cart\')">🛒</button>')+'<div class="page"><div class="section"><h2>Categorías</h2><button class="link" onclick="localStorage.removeItem(\'vani_cat\');render()">Todas</button></div><div class="tabs">'+cats.map(c=>'<button class="tab '+((chosen===c.id||(!chosen&&cats[0]?.id===c.id))?'on':'')+'" onclick="goCat(\''+c.id+'\')">'+esc(c.name)+'</button>').join('')+'</div><div class="search" style="margin-top:12px"><span>⌕</span><input value="'+esc(searchTerm)+'" placeholder="Buscar..." oninput="searchTerm=this.value;render()"></div><div class="grid2">'+(visible.length?visible.map(productCard).join(''):'<div class="card empty" style="grid-column:1/-1"><div style="font-size:44px">🔎</div><h3>No hay productos publicados aquí</h3><p class="muted">Los resultados aparecerán cuando existan productos aprobados.</p></div>')+'</div></div>'+nav()}
function product(id){const p=products.find(x=>x.id===id);if(!p)return;openModal('<button class="close" onclick="closeModal()">✕</button><div class="photo" style="border-radius:18px">'+(p.image_url?'<img src="'+esc(p.image_url)+'" style="max-width:80%;max-height:180px">':'🛍️')+'</div><div class="small muted" style="margin-top:12px">'+esc(p.categories?.name||'Producto')+'</div><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.description||'Sin descripción.')+'</p><div class="stat">'+money(p.price)+'</div><div class="row"><span class="badge">Stock '+Number(p.stock||0)+'</span><span class="badge orange">'+esc(p.seller_stores?.store_name||'Vendedor')+'</span></div><button class="btn primary full" style="margin-top:14px" onclick="addCart(\''+p.id+'\')">Agregar al carrito</button>')}
function addCart(id){const p=products.find(x=>x.id===id);if(!p)return;const i=cart.find(x=>x.product_id===id);if(i)i.qty=Math.min(100,i.qty+1);else cart.push({product_id:id,qty:1});saveCart();closeModal();showToast('Agregado al carrito');render()}
function cartPage(){const rows=cart.map(i=>{const p=products.find(x=>x.id===i.product_id);if(!p)return '';return '<div class="listitem"><div style="font-size:28px">🛍️</div><div class="grow"><b>'+esc(p.name)+'</b><div class="small muted">'+money(p.price)+' · Cantidad '+i.qty+'</div></div><button class="btn secondary" onclick="cartRemove(\''+p.id+'\')">Quitar</button></div>'}).join('');const total=cart.reduce((s,i)=>{const p=products.find(x=>x.id===i.product_id);return s+(p?p.price*i.qty:0)},0);return top('<button class="icon" onclick="go(\'home\')">⌂</button>')+'<div class="page"><div class="section"><h2>Mi carrito</h2></div>'+(rows||'<div class="card empty"><div style="font-size:50px">🛒</div><h3>Tu carrito está vacío</h3><button class="btn primary" onclick="go(\'home\')">Explorar productos</button></div>')+(rows?'<div class="card" style="margin-top:12px"><div class="row"><span>Total</span><b style="font-size:23px">'+money(total)+'</b></div><button class="btn primary full" style="margin-top:12px" onclick="checkout()">Continuar al pedido</button></div>':'')+'</div>'+nav()}
function cartRemove(id){cart=cart.filter(x=>x.product_id!==id);saveCart();render()}
async function checkout(){if(!cart.length)return;let body='<button class="close" onclick="closeModal()">✕</button><h2>Confirmar pedido</h2><p class="small muted">'+(address?'Se usará tu dirección guardada.':'Necesitas guardar una dirección de entrega.')+'</p>';if(address){body+='<div class="card"><b>'+esc(address.full_name)+'</b><div class="small muted">'+esc(address.address_line1)+', '+esc(address.city)+', '+esc(address.state)+' '+esc(address.postal_code)+'</div></div><button class="btn primary full" style="margin-top:12px" onclick="placeOrder()">Crear pedido</button>';}else{body+='<button class="btn outline full" onclick="accountAddress()">Agregar dirección</button>';}openModal(body)}
async function placeOrder(){try{if(!address)throw Error('Agrega una dirección.');const items=cart.map(i=>({product_id:i.product_id,qty:i.qty}));const id=await C.rpc('create_commercial_order',{p_items:items,p_shipping_address:address,p_promotion_id:null,p_promo_code:null});cart=[];saveCart();closeModal();await loadBase();page='orders';render();showToast('Pedido creado: '+String(id).slice(0,8))}catch(e){showToast(friendly(e))}}
function ordersPage(){return top('<button class="icon" onclick="go(\'home\')">⌂</button>')+'<div class="page"><div class="section"><h2>Mis pedidos</h2></div>'+(orders.length?'<div class="list">'+orders.map(o=>'<div class="card"><div class="row"><div class="grow"><b>'+esc(o.order_number)+'</b><div class="small muted">'+new Date(o.created_at).toLocaleString('es-MX')+'</div></div><span class="badge '+(o.delivery_status==='delivered'?'green':'')+'">'+esc(o.delivery_status||o.status)+'</span></div><div class="row" style="margin-top:9px"><span>Total</span><b>'+money(o.total)+'</b></div></div>').join('')+'</div>':'<div class="card empty"><div style="font-size:45px">📦</div><h3>No tienes pedidos registrados</h3><p class="muted">Cuando realices una compra aparecerá aquí.</p></div>')+'</div>'+nav()}
function accountPage(){return top('<button class="icon" onclick="logout()">↪</button>')+'<div class="page"><div class="card"><div class="row"><div class="brand"><span class="v">V</span></div><div class="grow"><h2 style="margin:0">'+esc(profile.full_name||'Mi cuenta')+'</h2><div class="small muted">'+esc(user.email||'')+'</div></div><span class="badge">'+esc(role==='seller'?'Vendedor':'Comprador')+'</span></div></div><div class="section"><h2>Dirección de entrega</h2></div>'+(address?'<div class="card"><b>'+esc(address.full_name)+'</b><div class="small muted">'+esc(address.address_line1)+', '+esc(address.city)+', '+esc(address.state)+' '+esc(address.postal_code)+'</div><button class="btn secondary" style="margin-top:10px" onclick="accountAddress()">Editar</button></div>':'<div class="card empty"><p class="muted">Aún no tienes una dirección guardada.</p><button class="btn primary" onclick="accountAddress()">Agregar dirección</button></div>')+(role==='seller'?'<div class="section"><h2>Mi tienda</h2></div><div class="card"><div class="row"><div class="grow"><b>'+esc(store?.store_name||'Tienda pendiente')+'</b><div class="small muted">Estado: '+esc(store?.status||'pending')+'</div></div><button class="btn secondary" onclick="go(\'seller\')">Abrir panel</button></div></div>':'')+'<button class="btn danger full" style="margin-top:18px" onclick="logout()">Cerrar sesión</button></div>'+nav()}
function accountAddress(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Dirección de entrega</h2><label class="label">Nombre</label><input id="ad_name" class="input" value="'+esc(address?.full_name||profile.full_name||'')+'"><label class="label">Teléfono</label><input id="ad_phone" class="input" value="'+esc(address?.phone||profile.phone||'')+'"><label class="label">Calle y número</label><input id="ad_l1" class="input" value="'+esc(address?.address_line1||'')+'"><label class="label">Colonia / referencia</label><input id="ad_l2" class="input" value="'+esc(address?.address_line2||'')+'"><label class="label">Ciudad</label><input id="ad_city" class="input" value="'+esc(address?.city||'Mazatlán')+'"><label class="label">Estado</label><input id="ad_state" class="input" value="'+esc(address?.state||'Sinaloa')+'"><label class="label">Código postal</label><input id="ad_cp" class="input" value="'+esc(address?.postal_code||'')+'"><button class="btn primary full" style="margin-top:14px" onclick="saveAddress()">Guardar</button>')}
async function saveAddress(){try{const row={user_id:user.id,full_name:$('#ad_name').value.trim(),phone:$('#ad_phone').value.trim(),address_line1:$('#ad_l1').value.trim(),address_line2:$('#ad_l2').value.trim(),city:$('#ad_city').value.trim(),state:$('#ad_state').value.trim(),postal_code:$('#ad_cp').value.trim(),country:'México',is_default:true};if(!row.full_name||!row.address_line1||!row.city||!row.state||!row.postal_code)throw Error('Completa la dirección.');if(address)await C.table.update('addresses',row,{id:'eq.'+address.id});else await C.table.insert('addresses',row);closeModal();await loadBase();render();showToast('Dirección guardada')}catch(e){showToast(friendly(e))}}
function sellerPage(){const inv=sellerProducts.length?sellerProducts.map(p=>'<div class="listitem"><div style="font-size:28px">📦</div><div class="grow"><b>'+esc(p.name)+'</b><div class="small muted">'+money(p.price)+' · Stock '+p.stock+'</div></div><span class="badge">'+esc(p.status)+'</span></div>').join(''):'<div class="card empty"><div style="font-size:45px">📦</div><h3>No hay productos</h3><p class="muted">Publica el primero desde tu panel.</p></div>';return top('<button class="icon" onclick="go(\'account\')">‹</button>')+'<div class="page"><div class="hero"><span class="kicker">Panel del vendedor</span><h1>'+esc(store?.store_name||'Mi tienda')+'</h1><p>Gestiona inventario, pedidos, finanzas y logística.</p></div><div class="grid3" style="margin-top:12px"><div class="card"><div class="small muted">Productos</div><div class="stat">'+sellerProducts.length+'</div></div><div class="card"><div class="small muted">Pedidos</div><div class="stat">'+orders.filter(o=>false).length+'</div></div><div class="card"><div class="small muted">Ventas</div><div class="stat">$0</div></div></div><div class="section"><h2>Inventario</h2><button class="btn primary" onclick="sellerProductForm()">＋ Producto</button></div><div class="list">'+inv+'</div><div class="section"><h2>Logística</h2></div><div class="card"><b>Operación local</b><p class="small muted">En Mazatlán, VaniDaxi podrá coordinar recolección y entrega. Fuera de la zona, el vendedor podrá usar paquetería.</p><button class="btn secondary" onclick="sellerStoreForm()">Configurar tienda</button></div><div class="section"><h2>Premium</h2></div><div class="card"><b>Almacenamiento y preparación</b><p class="small muted">Solicita el servicio Premium cuando quieras operar inventario con VaniDaxi.</p><button class="btn outline" onclick="requestPremium()">Solicitar Premium</button></div></div>'+nav()}
function sellerStoreForm(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Configurar tienda</h2><label class="label">Nombre</label><input id="st_name" class="input" value="'+esc(store?.store_name||'')+'"><label class="label">Descripción</label><textarea id="st_desc" class="input" rows="4">'+esc(store?.description||'')+'</textarea><button class="btn primary full" style="margin-top:14px" onclick="saveStore()">Guardar tienda</button>')}
async function saveStore(){try{store=(await C.rpc('upsert_my_seller_store',{p_store_name:$('#st_name').value.trim(),p_description:$('#st_desc').value.trim(),p_logo_url:null,p_banner_url:null}))[0]||store;closeModal();render();showToast('Tienda guardada')}catch(e){showToast(friendly(e))}}
function sellerProductForm(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Nuevo producto</h2><label class="label">Categoría</label><select id="pr_cat" class="input">'+cats.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><label class="label">Nombre</label><input id="pr_name" class="input"><label class="label">Descripción</label><textarea id="pr_desc" class="input" rows="3"></textarea><label class="label">Precio</label><input id="pr_price" class="input" type="number" step="0.01"><label class="label">Costo (privado)</label><input id="pr_cost" class="input" type="number" step="0.01"><label class="label">Stock</label><input id="pr_stock" class="input" type="number" value="1"><label class="label">SKU</label><input id="pr_sku" class="input"><label class="label">Imagen URL (opcional)</label><input id="pr_img" class="input"><button class="btn primary full" style="margin-top:14px" onclick="saveProduct()">Publicar producto</button>')}
async function saveProduct(){try{const n=$('#pr_name').value.trim(),price=Number($('#pr_price').value),stock=Number($('#pr_stock').value||0);if(!n||!(price>=0)||stock<0)throw Error('Completa nombre, precio y stock.');await C.rpc('create_seller_product',{p_category_id:$('#pr_cat').value,p_name:n,p_description:$('#pr_desc').value.trim(),p_price:price,p_compare_at_price:null,p_cost_price:Number($('#pr_cost').value||0),p_stock:stock,p_sku:$('#pr_sku').value.trim()||null,p_image_url:$('#pr_img').value.trim()||null,p_images:[]});closeModal();await loadSeller();render();showToast('Producto creado y enviado a revisión')}catch(e){showToast(friendly(e))}}
async function requestPremium(){try{await C.rpc('request_seller_premium',{p_monthly_price:0});showToast('Solicitud enviada')}catch(e){showToast(friendly(e))}}
function showAccountMenu(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>VaniDaxi</h2><button class="listitem full" onclick="closeModal();go(\'account\')">Mi cuenta</button><button class="listitem full" style="margin-top:8px" onclick="closeModal();go(\'orders\')">Mis pedidos</button>'+(role==='seller'?'<button class="listitem full" style="margin-top:8px" onclick="closeModal();go(\'seller\')">Panel del vendedor</button>':'')+'</div>')}
async function logout(){C.signOut();user=null;profile=null;render()}
function render(){if(!user){authView();return}if(page==='home')app.innerHTML=buyerHome();else if(page==='categories')app.innerHTML=categoryPage();else if(page==='cart')app.innerHTML=cartPage();else if(page==='orders')app.innerHTML=ordersPage();else if(page==='account')app.innerHTML=accountPage();else if(page==='seller')app.innerHTML=sellerPage();else app.innerHTML=buyerHome()}
$('#modal').addEventListener('submit',e=>e.preventDefault());
(async()=>{try{await boot()}catch(e){authView();showToast('No se pudo conectar con VaniDaxi')}})();
</script></body></html>
