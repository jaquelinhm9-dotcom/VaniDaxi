eight:1000}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.section h2{font-size:18px;margin:0}.link{border:0;background:none;color:#cf67ff;font-weight:900}.cat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cat{border:0;background:none;color:#fff;text-align:center}.cat-dot{height:53px;border-radius:17px;display:grid;place-items:center;font-size:22px;margin-bottom:6px;border:1px solid #332546}.cat span{font-size:10px;color:#ddd5e6}.offer-grid,.seller-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.product{background:#fff;color:#18131c;border-radius:20px;overflow:hidden}.photo{height:148px;background:linear-gradient(145deg,#f8f4ff,#ece4f7);display:grid;place-items:center}.photo img,.detail-photo img{width:100%;height:100%;object-fit:cover}.ph{font-size:55px}.product-body{padding:12px}.mini{font-size:10px;color:#7b7087}.product h3{font-size:14px;min-height:35px;margin:5px 0}.price{font-size:18px;font-weight:1000}.add{width:100%;border:0;border-radius:12px;background:linear-gradient(90deg,#6c24ff,#c03dff);color:#fff;padding:10px;margin-top:8px;font-weight:900}.card{background:linear-gradient(#120d1d,#0f0b16);border:1px solid var(--line);border-radius:20px;padding:15px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;color:#17121b;border-radius:17px;padding:11px}.stat b{display:block;font-size:18px;margin-top:4px}.seller-tile{background:#151020;border:1px solid #302241;border-radius:17px;padding:13px;color:#fff;text-align:left}.seller-tile b{display:block;font-size:18px;margin-top:4px}.list{display:grid;gap:9px}.listitem{display:flex;align-items:center;gap:10px;background:#120d1d;border:1px solid var(--line);border-radius:16px;padding:12px}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:9px;font-weight:900;background:#251732;color:#e5b8ff}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900}.primary{background:linear-gradient(90deg,#6c24ff,#c13dff);color:#fff}.secondary{background:#20162a;color:#fff;border:1px solid #3a2948}.ghost{background:transparent;color:#fff;border:1px solid #432e53}.danger{background:#32131c;color:#ff8ba1;border:1px solid #5b2433}.full{width:100%}.small{font-size:11px}.muted{color:var(--muted)}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(8,6,15,.97);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.nav{border:0;background:none;color:#756b82;font-size:9px}.nav b{display:block;font-size:18px;margin-bottom:2px}.nav.active{color:#d04aff}.modal{position:fixed;inset:0;background:rgba(2,1,5,.74);display:none;align-items:flex-end;z-index:80}.modal.show{display:flex}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#120d1d;border:1px solid #38274a;border-radius:26px 26px 0 0;padding:18px}.close{float:right;width:35px;height:35px;border-radius:11px;border:1px solid #3a2948;background:#20152b;color:#fff}.label{display:block;font-size:10px;font-weight:900;margin:11px 0 6px}.input{width:100%;padding:12px;border-radius:13px;border:1px solid #3a2a48;background:#0f0a16;color:#fff;outline:0}.notice{background:#1d1427;border:1px solid #352241;border-radius:14px;padding:12px;font-size:11px;color:#cbbbd9;line-height:1.45}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#fff;color:#160f1d;padding:11px 14px;border-radius:13px;display:none;z-index:90;font-size:12px}.toast.show{display:block}.auth{min-height:100vh;padding:25px 18px 38px;background:radial-gradient(circle at 50% -10%,#4d1c73 0,#170e22 36%,#08060f 70%)}.auth-brand{display:flex;flex-direction:column;align-items:center;padding-top:22px}.auth-logo{width:82px;height:82px;border-radius:26px;background:linear-gradient(145deg,#5b1cff,#f046d7);display:grid;place-items:center;font-size:42px;font-weight:1000}.auth-brand h1{font-size:34px;margin:13px 0 4px}.auth-brand p{margin:0;color:#c7bfd0}.auth-card{margin-top:29px}.divider{display:flex;gap:9px;align-items:center;color:#8d8198;font-size:10px;margin:15px 0}.divider:before,.divider:after{content:"";height:1px;background:#31243d;flex:1}.socials{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.social{border:1px solid #382847;background:#110c19;color:#fff;border-radius:15px;padding:11px 6px;font-weight:900}.promo{display:grid;gap:9px;margin-top:14px}.promo-card{border:1px solid #37243f;background:#120d1d;border-radius:18px;padding:13px}.timeline{display:grid;gap:12px}.timeline-item{display:grid;grid-template-columns:26px 1fr;gap:10px}.timeline-dot{width:26px;height:26px;border-radius:50%;background:#251631;color:#d24cff;display:grid;place-items:center}.detail-photo{height:240px;background:#f0ebf8;display:grid;place-items:center;border-radius:20px;overflow:hidden}

</style></head><body class="daxi-app"><div id="app" class="app"></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div><script src="app-config.js"></script><script src="supabase-client.js"></script><script>
const C=window.VaniCore,app=document.getElementById("app"),toastEl=document.getElementById("toast");let user=null,profile=null,role="customer",page="home",cats=[],products=[],orders=[],tickets=[],address=null,store=null,sellerProducts=[],sellerOrders=[],sellerOrderCount=0,sellerGross=0,sellerCost=0,sellerCommission=0,sellerProfit=0,cart=JSON.parse(localStorage.getItem("vani_cart")||"[]"),searchTerm="",categoryFilter=null,syncTimer=null,pendingPhone=null;const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),money=n=>"$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2});function toast(m){toastEl.textContent=m;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2200)}function openModal(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}document.getElementById("modal").addEventListener("click",e=>e.target.id==="modal"&&closeModal());const icon=n=>({home:"⌂",grid:"▦",cart:"🛒",orders:"▣",user:"◉",bell:"♢",gear:"⚙",search:"⌕"}[n]||"•");function go(p){page=p;render()}function top(){return '<div class="top"><div class="brand"><div class="mark">V</div><span>VaniDaxi</span></div><div class="top-actions"><button class="icon-btn" onclick="toast(\'No hay notificaciones nuevas\')">'+icon("bell")+'</button><button class="icon-btn" onclick="go(\'account\')">'+icon("gear")+'</button></div></div>'}function nav(){return '<div class="bottom"><button class="nav '+(page==="home"?"active":"")+'" onclick="go(\'home\')"><b>'+icon("home")+'</b>Inicio</button><button class="nav '+(page==="categories"?"active":"")+'" onclick="go(\'categories\')"><b>'+icon("grid")+'</b>Categorías</button><button class="nav '+(page==="cart"?"active":"")+'" onclick="go(\'cart\')"><b>'+icon("cart")+'</b>Carrito</button><button class="nav '+(page==="orders"?"active":"")+'" onclick="go(\'orders\')"><b>'+icon("orders")+'</b>Pedidos</button><button class="nav '+(page==="account"||page==="seller"?"active":"")+'" onclick="go(\'account\')"><b>'+icon("user")+'</b>Perfil</button></div>'}function authView(){app.innerHTML='<div class="auth"><div class="auth-brand"><div class="auth-logo">V</div><h1>Vani<span style="color:#c44cff">Daxi</span></h1><p>Tu mundo, más cerca</p></div><div class="card auth-card"><h2>Iniciar sesión</h2><div class="small muted">Compra y vende en un solo lugar.</div><label class="label">Correo</label><input id="le" class="input" type="email"><label class="label">Contraseña</label><input id="lp" class="input" type="password"><button class="btn primary full" style="margin-top:13px" onclick="login()">Iniciar sesión</button><button class="btn ghost full" style="margin-top:9px" onclick="register(\'customer\')">Crear cuenta</button><div class="divider">O continúa con</div><div class="socials"><button class="social" onclick="socialLogin(\'google\')">G</button><button class="social" onclick="socialLogin(\'facebook\')">f</button><button class="social" onclick="socialLogin(\'apple\')"></button><button class="social" onclick="phoneRegister()">☎</button></div><button class="link full" style="margin-top:14px" onclick="requestPasswordReset()">¿Olvidaste tu contraseña?</button></div><div class="promo"><div class="promo-card"><b>🛒 Regístrate como comprador</b><div class="small muted">Encuentra, compra y recibe.</div></div><div class="promo-card"><b>🏪 Regístrate como vendedor</b><div class="small muted">Publica y administra tu tienda.</div></div><div class="promo-card"><b>🚚 VaniReparte</b><div class="small muted">Los repartidores usan la app independiente.</div></div></div></div>'}async function socialLogin(p){try{await C.oauth(p)}catch(e){toast(e.message||"No se pudo iniciar")}}function setPendingRole(r){localStorage.setItem("vani_pending_role",r)}async function applyPendingRole(){const w=localStorage.getItem("vani_pending_role");if(!w)return;try{if(w==="seller"&&profile?.role!=="seller"){await C.rpc("become_seller",{});profile=await C.profile()}localStorage.removeItem("vani_pending_role")}catch(e){toast(e.message||"No se pudo activar vendedor")}}function register(initial){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Crear cuenta</h2><label class="label">Tipo</label><select id="rr" class="input"><option value="customer" '+(initial==="customer"?"selected":"")+'>Comprador</option><option value="seller" '+(initial==="seller"?"selected":"")+'>Vendedor</option></select><label class="label">Nombre</label><input id="rn" class="input"><label class="label">Correo</label><input id="re" class="input" type="email"><label class="label">Contraseña</label><input id="rp" class="input" type="password"><label class="label">Confirmar contraseña</label><input id="rp2" class="input" type="password"><label class="row" style="margin-top:10px"><input id="terms" type="checkbox"><span class="small muted">Acepto los términos.</span></label><button class="btn primary full" style="margin-top:13px" onclick="createAccount()">Crear cuenta</button>')}function phoneRegister(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Continuar con teléfono</h2><label class="label">Tipo</label><select id="pr" class="input"><option value="customer">Comprador</option><option value="seller">Vendedor</option></select><label class="label">Nombre</label><input id="pn" class="input"><label class="label">Teléfono</label><input id="pt" class="input" type="tel"><label class="row" style="margin-top:10px"><input id="ptm" type="checkbox"><span class="small muted">Acepto los términos.</span></label><button class="btn primary full" style="margin-top:13px" onclick="sendPhoneCode()">Enviar código</button>')}async function sendPhoneCode(){try{const r=$("#pr").value,n=$("#pn").value.trim(),p=$("#pt").value.trim();if(!n||!p||!$("#ptm").checked)throw Error("Completa datos y acepta los términos.");pendingPhone={role:r,phone:p};if(r==="seller")setPendingRole("seller");await C.sendOtp(p,{account_type:"customer",onboarding_role:"customer",name:n,display_name:n,full_name:n,terms_accepted_at:new Date().toISOString(),terms_version:"v1.0"});document.getElementById("sheet").innerHTML='<button class="close" onclick="closeModal()">✕</button><h2>Verificar teléfono</h2><input id="pcode" class="input" inputmode="numeric" maxlength="8"><button class="btn primary full" style="margin-top:12px" onclick="verifyPhoneCode()">Verificar</button>'}catch(e){toast(e.message||"No se pudo enviar")}}async function verifyPhoneCode(){try{const code=$("#pcode").value.trim();if(!pendingPhone||!code)throw Error("Escribe el código.");await C.verifyOtp(pendingPhone.phone,code);if(pendingPhone.role==="seller")await C.rpc("become_seller",{});pendingPhone=null;closeModal();await boot();toast("Cuenta lista")}catch(e){toast(e.message||"Código no válido")}}async function login(){try{await C.signIn($("#le").value.trim(),$("#lp").value);await boot();toast("Sesión iniciada")}catch(e){toast(e.message||"No se pudo iniciar")}}async function createAccount(){try{const n=$("#rn").value.trim(),e=$("#re").value.trim(),p=$("#rp").value,p2=$("#rp2").value,r=$("#rr").value;if(!n||!e||p.length<8||p!==p2||!$("#terms").checked)throw Error("Revisa los datos y acepta los términos.");if(r==="seller")setPendingRole("seller");await C.signUp(e,p,{account_type:"customer",onboarding_role:"customer",name:n,display_name:n,full_name:n,terms_accepted_at:new Date().toISOString(),terms_version:"v1.0"});if(!C.session()){closeModal();openModal('<button class="close" onclick="closeModal()">✕</button><h2>Revisa tu correo</h2><p class="small muted">Confirma tu cuenta y después inicia sesión.</p>');return}closeModal();await boot();toast("Cuenta creada")}catch(e){toast(e.message||"No se pudo crear")}}async function requestPasswordReset(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Recuperar contraseña</h2><label class="label">Correo</label><input id="reset" class="input"><button class="btn primary full" style="margin-top:12px" onclick="sendReset()">Enviar enlace</button>')}async function sendReset(){try{await C.recoverPassword($("#reset").value.trim(),location.href.split("#")[0]);closeModal();toast("Revisa tu correo")}catch(e){toast(e.message||"No se pudo enviar")}}function passwordResetView(){app.innerHTML='<div class="auth"><div class="auth-brand"><div class="auth-logo">V</div><h1>Vani<span style="color:#c44cff">Daxi</span></h1></div><div class="card auth-card"><h2>Nueva contraseña</h2><input id="newpw" class="input" type="password"><button class="btn primary full" style="margin-top:12px" onclick="finishPasswordReset()">Guardar</button></div></div>'}async function finishPasswordReset(){try{const p=$("#newpw").value;if(p.length<8)throw Error("Usa 8 caracteres o más.");await C.updatePassword(p);await boot();toast("Contraseña actualizada")}catch(e){toast(e.message||"No se pudo actualizar")}}async function loadBase(){cats=await C.table.list("categories","id,name,slug,description,image_url",{is_active:"eq.true"},"order=name.asc").catch(()=>[]);products=await C.table.list("products","id,seller_id,category_id,name,description,price,compare_at_price,stock,image_url,status,categories(name),seller_stores(store_name)",{status:"eq.approved"},"order=created_at.desc").catch(()=>[]);orders=await C.table.list("orders","id,order_number,status,total,delivery_status,created_at",{user_id:"eq."+user.id},"order=created_at.desc").catch(()=>[]);tickets=await C.table.list("support_tickets","id,email,category,subject,status,priority,created_at,resolution_status,order_id",{user_id:"eq."+user.id},"order=created_at.desc").catch(()=>[]);const a=await C.table.list("addresses","id,full_name,phone,address_line1,address_line2,city,state,postal_code,country,is_default,location",{user_id:"eq."+user.id},"order=is_default.desc,created_at.desc").catch(()=>[]);address=a[0]||null}async function loadSeller(){store=(await C.rpc("get_my_seller_store",{}).catch(()=>[]))[0]||null;sellerProducts=store?await C.table.list("products","id,category_id,name,description,price,cost_price,stock,sku,status,image_url",{seller_id:"eq."+store.id},"order=created_at.desc").catch(()=>[]):[];sellerOrderCount=0;sellerGross=0;sellerCost=0;sellerCommission=0;sellerProfit=0;sellerOrders=[];if(store){const items=await C.table.list("order_items","id,order_id,total_price,quantity,unit_cost,cost_total",{seller_id:"eq."+store.id},"order=created_at.desc").catch(()=>[]);sellerOrderCount=new Set(items.map(x=>x.order_id)).size;sellerGross=items.reduce((s,x)=>s+Number(x.total_price||0),0);sellerCost=items.reduce((s,x)=>s+Number(x.cost_total||0),0);const ids=[...new Set(items.map(x=>x.order_id))];sellerOrders=ids.length?await C.table.list("orders","id,order_number,status,total,delivery_provider,delivery_status,shipping_address,created_at",{id:ids},"order=created_at.desc").catch(()=>[]):[];const comm=await C.table.list("platform_commissions","order_id,commission_amount",{seller_id:"eq."+store.id},"order=created_at.desc").catch(()=>[]);sellerCommission=comm.reduce((s,x)=>s+Number(x.commission_amount||0),0);sellerProfit=sellerGross-sellerCost-sellerCommission}}function productCard(p){return '<div class="product"><div class="photo">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'<div class="ph">🛍</div>')+'</div><div class="product-body"><div class="mini">'+esc(p.categories?.name||"Producto")+'</div><h3>'+esc(p.name)+'</h3><div class="price">'+money(p.price)+'</div><button class="add" onclick="showProduct(\''+esc(p.id)+'\')">Ver producto</button></div></div>'}function homePage(){const shown=products.filter(p=>!categoryFilter||p.category_id===categoryFilter).filter(p=>!searchTerm||String(p.name).toLowerCase().includes(searchTerm.toLowerCase())).slice(0,8),cs=cats.slice(0,5).map((c,i)=>'<button class="cat" onclick="chooseCategory(\''+esc(c.id)+'\')"><div class="cat-dot">'+["⌘","✦","⌂","◈","✿"][i]+'</div><span>'+esc(c.name)+'</span></button>').join("");return top()+'<div class="shell"><div class="search">'+icon("search")+'<input value="'+esc(searchTerm)+'" placeholder="Buscar productos, tiendas o categorías" oninput="searchTerm=this.value;render()"></div><div class="hero"><div class="small">VaniDaxi · COMPRA Y VENDE</div><h1>Lo que necesitas, en un solo lugar</h1><p>Compra fácil, seguro y rápido.</p><button class="btn primary" style="margin-top:15px" onclick="go(\'categories\')">Explorar ahora</button><div class="bag">V</div></div><div class="section"><h2>Categorías</h2><button class="link" onclick="go(\'categories\')">Ver todo</button></div><div class="cat-row">'+cs+'</div><div class="section"><h2>Ofertas especiales</h2></div><div class="offer-grid">'+(shown.map(productCard).join("")||'<div class="card"><b>No hay productos disponibles todavía</b><div class="small muted">Las publicaciones aprobadas aparecerán aquí.</div></div>')+'</div><div class="card" style="margin-top:12px;display:flex;gap:12px;align-items:center"><div class="mark">▤</div><div class="grow"><b>Vende en VaniDaxi</b><div class="small muted">Administra inventario, ingresos, egresos y ganancias.</div></div><button class="btn primary" onclick="go(\'account\')">Vender</button></div></div>'+nav()}function categoriesPage(){return top()+'<div class="shell"><div class="section"><h2>Categorías</h2></div><div class="seller-grid">'+cats.map((c,i)=>'<button class="seller-tile" onclick="chooseCategory(\''+esc(c.id)+'\')"><div style="font-size:26px">'+["⌘","✦","⌂","◈","✿","☀"][i%6]+'</div><b>'+esc(c.name)+'</b><div class="small muted">'+esc(c.description||"Explora productos")+'</div></button>').join("")+'</div></div>'+nav()}function chooseCategory(id){categoryFilter=id;go("home")}function showProduct(id){const p=products.find(x=>x.id===id);if(!p)return;openModal('<button class="close" onclick="closeModal()">✕</button><div class="detail-photo">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'<div class="ph">🛍</div>')+'</div><h2>'+esc(p.name)+'</h2><div style="font-size:25px;font-weight:1000">'+money(p.price)+'</div><p class="muted">'+esc(p.description||"Sin descripción")+'</p><button class="btn primary full" onclick="addCart(\''+esc(p.id)+'\')">Agregar al carrito</button>')}function addCart(id){const i=cart.find(x=>x.product_id===id);i?i.qty++:cart.push({product_id:id,qty:1});localStorage.setItem("vani_cart",JSON.stringify(cart));closeModal();toast("Agregado al carrito")}function removeCart(id){cart=cart.filter(x=>x.product_id!==id);localStorage.setItem("vani_cart",JSON.stringify(cart));render()}function cartPage(){const rows=cart.map(i=>{const p=products.find(x=>x.id===i.product_id);return p?'<div class="listitem"><div class="grow"><b>'+esc(p.name)+'</b><div class="small muted">'+money(p.price)+' · x'+i.qty+'</div></div><button class="btn secondary" onclick="removeCart(\''+esc(p.id)+'\')">Quitar</button></div>':""}).join(""),t=cart.reduce((s,i)=>{const p=products.find(x=>x.id===i.product_id);return s+(p?p.price*i.qty:0)},0);return top()+'<div class="shell"><div class="section"><h2>Mi carrito</h2></div>'+(rows?'<div class="list">'+rows+'</div><div class="card" style="margin-top:12px"><div class="row"><span>Total</span><b>'+money(t)+'</b></div><button class="btn primary full" style="margin-top:11px" onclick="checkout()">Continuar</button></div>':'<div class="card" style="text-align:center;padding:35px"><div style="font-size:48px">🛒</div><h3>Tu carrito está vacío</h3></div>')+'</div>'+nav()}function checkout(){let h='<button class="close" onclick="closeModal()">✕</button><h2>Confirmar pedido</h2>';if(!address)h+='<p class="muted">Agrega una dirección antes de comprar.</p><button class="btn secondary full" onclick="addressForm()">Agregar dirección</button>';else h+='<div class="card"><b>'+esc(address.full_name)+'</b><div class="small muted">'+esc(address.address_line1)+", "+esc(address.city)+", "+esc(address.state)+' '+esc(address.postal_code)+'</div></div><button class="btn primary full" style="margin-top:12px" onclick="placeOrder()">Crear pedido y pagar</button>';openModal(h)}async function placeOrder(){try{const id=await C.rpc("create_commercial_order",{p_items:cart,p_shipping_address:address,p_promotion_id:null,p_promo_code:null}),pay=await C.edge("mercadopago-checkout","POST",{order_id:id});cart=[];localStorage.setItem("vani_cart","[]");closeModal();if(pay?.checkout_url){location.href=pay.checkout_url;return}await loadBase();go("orders");toast("Pedido creado")}catch(e){toast(e.message||"No se pudo crear el pedido")}}function ordersPage(){return top()+'<div class="shell"><div class="section"><h2>Mis pedidos</h2></div>'+(orders.length?'<div class="list">'+orders.map(o=>'<div class="card"><div class="row"><div class="grow"><b>'+esc(o.order_number)+'</b><div class="small muted">'+new Date(o.created_at).toLocaleString("es-MX")+'</div></div><span class="pill">'+esc(o.delivery_status||o.status)+'</span></div><div class="row" style="margin-top:10px"><b>'+money(o.total)+'</b><button class="btn secondary" onclick="showOrderTimeline(\''+esc(o.id)+'\')">Seguimiento</button><button class="btn secondary" onclick="showDeliveryPin(\''+esc(o.id)+'\')">PIN</button></div></div>').join("")+'</div>':'<div class="card" style="text-align:center;padding:35px"><div style="font-size:44px">📦</div><h3>No hay pedidos todavía</h3></div>')+'</div>'+nav()}async function showOrderTimeline(id){const o=orders.find(x=>x.id===id)||sellerOrders.find(x=>x.id===id);if(!o)return;openModal('<button class="close" onclick="closeModal()">✕</button><h2>Seguimiento</h2><div id="tl" class="timeline"></div>');try{const rows=await C.table.list("order_delivery_events","id,status,custody,tracking,notes,created_at",{order_id:"eq."+id},"order=created_at.desc");$("#tl").innerHTML=rows.length?rows.map(e=>'<div class="timeline-item"><div class="timeline-dot">✓</div><div><b>'+esc(e.status)+'</b><div class="small muted">'+new Date(e.created_at).toLocaleString("es-MX")+'</div></div></div>').join(""):'<div class="notice">El seguimiento aparecerá conforme avance el pedido.</div>'}catch(e){toast(e.message||"No se pudo cargar")}}async function showDeliveryPin(id){try{const r=await C.rpc("get_my_delivery_code",{p_order_id:id,p_kind:"delivery"}),code=Array.isArray(r)?r[0]?.code:r?.code;if(!code)throw Error("PIN no disponible");openModal('<button class="close" onclick="closeModal()">✕</button><h2>PIN de entrega</h2><div style="font-size:38px;font-weight:1000;letter-spacing:8px;text-align:center">'+esc(code)+'</div>')}catch(e){toast(e.message||"No se pudo obtener")}}function addressForm(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Dirección de entrega</h2><label class="label">Nombre</label><input id="an" class="input" value="'+esc(address?.full_name||"")+'"><label class="label">Teléfono</label><input id="ap" class="input" value="'+esc(address?.phone||"")+'"><label class="label">Dirección</label><input id="al1" class="input" value="'+esc(address?.address_line1||"")+'"><label class="label">Referencia</label><input id="al2" class="input" value="'+esc(address?.address_line2||"")+'"><label class="label">Ciudad</label><input id="ac" class="input" value="'+esc(address?.city||"Mazatlán")+'"><label class="label">Estado</label><input id="as" class="input" value="'+esc(address?.state||"Sinaloa")+'"><label class="label">Código postal</label><input id="az" class="input" value="'+esc(address?.postal_code||"")+'"><button class="btn primary full" style="margin-top:12px" onclick="saveAddress()">Guardar dirección</button>')}function getGps(){return new Promise((r,j)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude,accuracy_m:p.coords.accuracy}),j,{enableHighAccuracy:true,timeout:10000,maximumAge:15000}):j(Error("GPS no disponible")))}async function saveAddress(){try{const row={user_id:user.id,full_name:$("#an").value.trim(),phone:$("#ap").value.trim(),address_line1:$("#al1").value.trim(),address_line2:$("#al2").value.trim(),city:$("#ac").value.trim(),state:$("#as").value.trim(),postal_code:$("#az").value.trim(),country:"México",is_default:true,location:address?.location||null};if(!row.full_name||!row.phone||!row.address_line1||!row.city||!row.state||!row.postal_code)throw Error("Completa los datos.");try{row.location=await getGps()}catch(_){}address?await C.table.update("addresses",row,{id:"eq."+address.id}):await C.table.insert("addresses",row);await loadBase();closeModal();render();toast("Dirección guardada")}catch(e){toast(e.message||"No se pudo guardar")}}function supportForm(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Centro de ayuda</h2><label class="label">Categoría</label><select id="sc" class="input"><option>General</option><option>Pedido</option><option>Pago</option><option>Cuenta</option></select><label class="label">Asunto</label><input id="ss" class="input"><button class="btn primary full" style="margin-top:12px" onclick="saveSupportTicket()">Enviar</button>')}async function saveSupportTicket(){try{const s=$("#ss").value.trim();if(!s)throw Error("Escribe el asunto.");await C.table.insert("support_tickets",{user_id:user.id,email:user.email,category:$("#sc").value,subject:s,status:"open",priority:"normal"});closeModal();await loadBase();toast("Solicitud enviada")}catch(e){toast(e.message||"No se pudo enviar")}}function accountPage(){return top()+'<div class="shell"><div class="card"><div class="row"><div class="mark">V</div><div class="grow"><b>'+esc(profile?.full_name||user.email)+'</b><div class="small muted">'+esc(user.email||"")+'</div></div><span class="pill">'+(role==="seller"?"Vendedor":"Comprador")+'</span></div>'+(role==="seller"?'<button class="btn primary full" style="margin-top:12px" onclick="go(\'seller\')">Abrir panel del vendedor</button>':'<button class="btn secondary full" style="margin-top:12px" onclick="becomeSellerFromAccount()">Quiero vender</button>')+'</div><div class="section"><h2>Configuración</h2></div><div class="list"><button class="listitem" onclick="addressForm()">📍 <span class="grow">Dirección</span>›</button><button class="listitem" onclick="supportForm()">💬 <span class="grow">Ayuda y soporte</span>›</button><button class="listitem" onclick="toast(\'Configuración lista\')">⚙ <span class="grow">Configuración</span>›</button><a class="listitem" href="../../legal/privacy.html">🔒 <span class="grow">Privacidad</span>›</a><a class="listitem" href="../../legal/terms.html">📄 <span class="grow">Términos</span>›</a></div><button class="btn danger full" style="margin-top:13px" onclick="logout()">Cerrar sesión</button></div>'+nav()}async function becomeSellerFromAccount(){try{await C.rpc("become_seller",{});await boot();toast("Perfil de vendedor activado")}catch(e){toast(e.message||"No se pudo activar")}}function storeForm(){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Configurar tienda</h2><label class="label">Nombre</label><input id="sn" class="input" value="'+esc(store?.store_name||"")+'"><label class="label">Descripción</label><textarea id="sd" class="input" rows="4">'+esc(store?.description||"")+'</textarea><button class="btn primary full" style="margin-top:12px" onclick="saveStore()">Guardar</button>')}async function saveStore(){try{store=(await C.rpc("upsert_my_seller_store",{p_store_name:$("#sn").value.trim(),p_description:$("#sd").value.trim(),p_logo_url:null,p_banner_url:null}))[0]||store;await loadSeller();closeModal();render();toast("Tienda guardada")}catch(e){toast(e.message||"No se pudo guardar")}}function productForm(id){const p=sellerProducts.find(x=>x.id===id),opts=cats.map(c=>'<option value="'+c.id+'" '+(p?.category_id===c.id?"selected":"")+'>'+esc(c.name)+'</option>').join("");openModal('<button class="close" onclick="closeModal()">✕</button><h2>'+(id?"Editar producto":"Nuevo producto")+'</h2><label class="label">Categoría</label><select id="pc" class="input">'+opts+'</select><label class="label">Nombre</label><input id="pn" class="input" value="'+esc(p?.name||"")+'"><label class="label">Descripción</label><textarea id="pd" class="input" rows="3">'+esc(p?.description||"")+'</textarea><label class="label">Precio</label><input id="pp" class="input" type="number" step="0.01" value="'+(p?Number(p.price||0):"")+'"><label class="label">Costo</label><input id="pk" class="input" type="number" step="0.01" value="'+(p?Number(p.cost_price||0):"")+'"><label class="label">Stock</label><input id="ps" class="input" type="number" min="0" value="'+(p?Number(p.stock||0):1)+'"><label class="label">SKU</label><input id="pu" class="input" value="'+esc(p?.sku||"")+'"><label class="label">Imagen URL</label><input id="pi" class="input" value="'+esc(p?.image_url||"")+'"><button class="btn primary full" style="margin-top:12px" onclick="saveProduct(\''+esc(id||"")+'\')">'+(id?"Guardar cambios":"Crear producto")+'</button></div>')}async function saveProduct(id){try{const n=$("#pn").value.trim(),price=Number($("#pp").value),stock=Number($("#ps").value||0),cat=$("#pc").value;if(!n||!cat||price<0||stock<0)throw Error("Completa los datos.");const a={p_product_id:id,p_category_id:cat,p_name:n,p_description:$("#pd").value.trim(),p_price:price,p_compare_at_price:null,p_cost_price:Number($("#pk").value||0),p_stock:stock,p_sku:$("#pu").value.trim()||null,p_image_url:$("#pi").value.trim()||null,p_images:[]};id?await C.rpc("update_seller_product",a):await C.rpc("create_seller_product",a);await loadSeller();closeModal();render();toast(id?"Producto actualizado":"Producto creado")}catch(e){toast(e.message||"No se pudo guardar")}}async function restockProduct(id){try{const q=Number(prompt("Cantidad")||0);if(!Number.isInteger(q)||q<=0)throw Error("Cantidad inválida.");await C.rpc("restock_seller_product",{p_product_id:id,p_quantity:q,p_note:null});await loadSeller();render();toast("Inventario actualizado")}catch(e){toast(e.message||"No se pudo actualizar")}}async function deleteProduct(id){if(!confirm("¿Eliminar producto?"))return;try{await C.rpc("delete_seller_product",{p_product_id:id});await loadSeller();render();toast("Producto eliminado")}catch(e){toast(e.message||"No se pudo eliminar")}}function sellerPage(){const inv=sellerProducts.map(p=>'<div class="listitem"><div class="grow"><b>'+esc(p.name)+'</b><div class="small muted">'+money(p.price)+' · Stock '+Number(p.stock||0)+'</div></div><button class="btn secondary" onclick="productForm(\''+esc(p.id)+'\')">Editar</button></div>').join("")||'<div class="notice">Aún no hay productos.</div>';return top()+'<div class="shell"><div class="card" style="background:linear-gradient(145deg,#2b1350,#120d1d)"><div class="small">PANEL DEL VENDEDOR</div><h2>'+esc(store?.store_name||"Mi tienda")+'</h2><div class="stats"><div class="stat">Ventas<b>'+money(sellerGross)+'</b></div><div class="stat">Pedidos<b>'+sellerOrderCount+'</b></div><div class="stat">Ganancia<b>'+money(sellerProfit)+'</b></div></div></div><div class="section"><h2>Herramientas</h2><button class="btn primary" onclick="productForm()">＋ Producto</button></div><div class="seller-grid"><div class="seller-tile">📦 Inventario<b>'+sellerProducts.length+'</b></div><div class="seller-tile">💰 Ingresos<b>'+money(sellerGross)+'</b></div><div class="seller-tile">🧾 Egresos<b>'+money(sellerCost)+'</b></div><div class="seller-tile">📊 Comisión<b>'+money(sellerCommission)+'</b></div></div><div class="section"><h2>Inventario</h2></div><div class="list">'+inv+'</div><div class="section"><h2>Pedidos y logística</h2></div><div class="list">'+(sellerOrders.map(o=>'<div class="listitem"><div class="grow"><b>'+esc(o.order_number)+'</b><div class="small muted">'+esc(o.status)+' · '+esc(o.delivery_status||"pending")+'</div></div><button class="btn secondary" onclick="showOrderTimeline(\''+esc(o.id)+'\')">Seguimiento</button></div>').join("")||'<div class="notice">Aún no hay pedidos.</div>')+'</div><div class="card" style="margin-top:12px"><b>Premium VaniDaxi</b><div class="small muted">Solicita almacenamiento y preparación.</div><button class="btn ghost full" style="margin-top:9px" onclick="premium()">Solicitar Premium</button></div><button class="btn secondary full" style="margin-top:9px" onclick="storeForm()">Configurar tienda</button></div>'+nav()}function premium(){C.rpc("request_seller_premium",{p_monthly_price:0}).then(()=>toast("Solicitud enviada")).catch(e=>toast(e.message||"No se pudo solicitar"))}function pickupForm(id){openModal('<button class="close" onclick="closeModal()">✕</button><h2>Solicitar recolección</h2><label class="label">Dirección</label><input id="pk_addr" class="input"><label class="label">Ciudad</label><input id="pk_city" class="input" value="Mazatlán"><label class="label">Estado</label><input id="pk_state" class="input" value="Sinaloa"><label class="label">Paquetes</label><input id="pk_count" class="input" type="number" value="1"><button class="btn primary full" style="margin-top:12px" onclick="savePickupRequest(\''+esc(id)+'\')">Solicitar</button>')}async function savePickupRequest(id){try{const a=$("#pk_addr").value.trim();if(!a)throw Error("Indica la dirección.");const g=await getGps();await C.rpc("create_seller_package_request",{p_order_id:id,p_pickup_address:{address_line1:a,city:$("#pk_city").value.trim()||"Mazatlán",state:$("#pk_state").value.trim()||"Sinaloa",country:"México",lat:g.lat,lng:g.lng,accuracy_m:g.accuracy_m},p_pickup_window_start:new Date().toISOString(),p_pickup_window_end:new Date(Date.now()+7200000).toISOString(),p_package_count:Math.max(1,Number($("#pk_count").value||1)),p_weight_kg:null,p_dimensions:null,p_ready_at:new Date().toISOString()});closeModal();await loadSeller();render();toast("Solicitud creada")}catch(e){toast(e.message||"No se pudo crear")}}async function showPickupPin(id){try{const r=await C.rpc("get_my_delivery_code",{p_order_id:id,p_kind:"pickup"}),code=Array.isArray(r)?r[0]?.code:r?.code;if(!code)throw Error("PIN no disponible");openModal('<button class="close" onclick="closeModal()">✕</button><h2>PIN de recolección</h2><div style="font-size:38px;font-weight:1000;letter-spacing:8px;text-align:center">'+esc(code)+'</div>')}catch(e){toast(e.message||"No se pudo obtener")}}function logout(){C.signOut();user=null;profile=null;page="home";render()}function startSync(){if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(async()=>{if(document.hidden||!user)return;try{await loadBase();if(role==="seller")await loadSeller();render()}catch(_){}},15000)}async function boot(){const a=await C.consumeAuthHash();if(a?.type==="recovery"){passwordResetView();return}if(a?.type==="error")toast(a.message);user=await C.me();profile=user?await C.profile():null;if(!user||!profile){C.signOut();authView();return}role=profile.role||"customer";await applyPendingRole();role=profile?.role||role;await loadBase();if(role==="seller")await loadSeller();render();startSync()}function render(){app.className="app"+((user&&["home","categories","cart","orders"].includes(page))?" light":"");if(!user)return authView();if(page==="home")app.innerHTML=homePage();else if(page==="categories")app.innerHTML=categoriesPage();else if(page==="cart")app.innerHTML=cartPage();else if(page==="orders")app.innerHTML=ordersPage();else if(page==="seller"&&role==="seller")app.innerHTML=sellerPage();else app.innerHTML=accountPage()}Object.assign(window,{login,register,socialLogin,phoneRegister,sendPhoneCode,verifyPhoneCode,createAccount,requestPasswordReset,sendReset,finishPasswordReset,boot,go,closeModal,addCart,removeCart,showProduct,chooseCategory,checkout,placeOrder,showOrderTimeline,showDeliveryPin,addressForm,getGps,saveAddress,supportForm,saveSupportTicket,becomeSellerFromAccount,storeForm,saveStore,productForm,saveProduct,restockProduct,deleteProduct,sellerPage,premium,pickupForm,savePickupRequest,showPickupPin,logout,toast});boot().catch(()=>authView());
