<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f234f">
<title>VaniDaxi — Maqueta navegable</title>
<style>
:root{
  --bg:#f4f7fb;--surface:#fff;--navy:#0f234f;--blue:#2865f5;--blue2:#5c56f0;
  --violet:#8146e8;--mint:#25bd9f;--green:#18a269;--red:#de5b65;--yellow:#e7a82f;--brand:#ff8a00;--brand2:#ffb11b;
  --text:#13234a;--muted:#77839a;--line:#e5eaf1;--soft:#eff4ff;--shadow:0 8px 26px rgba(26,48,88,.08)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:520px;min-height:100vh;margin:0 auto;background:#f8fbff;position:relative;padding-bottom:88px}
.topbar{height:62px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid rgba(229,234,241,.75);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:900;letter-spacing:-.4px}
.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:1000;background:linear-gradient(135deg,#7647e9,#2b69f3,#28c9ba)}
.iconbtn{border:0;background:#f3f6fb;width:38px;height:38px;border-radius:13px;color:var(--navy)}
.content{padding:14px 16px 100px}
.hero{background:linear-gradient(140deg,#edf3ff,#fff);border:1px solid #dfe7f7;border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.hero.dark{background:linear-gradient(145deg,#0d2146,#17396e);color:#fff;border:none}
.hero h1{font-size:29px;line-height:1.03;margin:12px 0 9px}
.hero p{margin:0;color:inherit;opacity:.78}
.search{display:flex;align-items:center;gap:9px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.section-title h2{font-size:18px;margin:0}.link{border:0;background:transparent;color:var(--blue);font-weight:800;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.category{min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;background:linear-gradient(150deg,#fff,#f3f7ff)}
.catimg{height:58px;border-radius:14px;background:linear-gradient(135deg,#dce8ff,#f8fbff);display:grid;place-items:center;font-size:28px}
.small{font-size:12px}.muted{color:var(--muted)}.pill{display:inline-block;font-size:11px;font-weight:850;padding:6px 8px;border-radius:999px;background:#fff1d8;color:#a85e00}
.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:850}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#14284c}.btn.navy{background:var(--navy);color:#fff}.btn.outline{background:#fff;border:1px solid #cfdae8;color:var(--navy)}.btn.soft{background:#edf2ff;color:#2d48b8}.btn.success{background:#e6f8f0;color:#087d4e}.btn.full{width:100%}.btn.light{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#14284c}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1}.icon{width:44px;height:44px;border-radius:13px;background:#eef3ff;display:grid;place-items:center;font-size:20px}
.product-card{overflow:hidden;padding:0}.prodphoto{height:134px;display:grid;place-items:center;font-size:56px;background:radial-gradient(circle at 30% 30%,#fff,#edf2fa)}
.product-card .body{padding:12px}.stars{color:var(--yellow);font-size:12px}.price{font-weight:900;font-size:19px;margin-top:4px}
.product-card button{border:0;background:transparent;text-align:left;width:100%;padding:0;color:inherit}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav{border:0;background:transparent;color:#7c879a;font-size:10px;padding:2px 0}.nav.active{color:var(--brand);font-weight:900}.nav b{display:block;font-size:18px;line-height:18px;margin-bottom:2px}
.screen-title{padding:16px 16px 4px}.screen-title h1{margin:0;font-size:25px}.back{border:0;background:transparent;font-size:28px;padding:0 0 4px;color:var(--navy)}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:12px}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.list{display:grid;gap:9px}.listitem{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.kpi:last-child{border-bottom:0}
.ok{color:var(--green)}.bad{color:var(--red)}
.product-detail .bigphoto{height:270px;border-radius:22px;background:radial-gradient(circle,#fff 0,#eef3f9 65%,#e4ebf4);display:grid;place-items:center;font-size:110px}
.quantity{display:flex;align-items:center;gap:10px}.quantity button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:10px}
.map{height:250px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(135deg,#e2ecde 0 18%,#f4f6f5 18% 31%,#dde5ef 31% 39%,#eff2f0 39% 62%,#e5e0d0 62% 70%,#eef4ee 70%)}
.map:before,.map:after{content:"";position:absolute;background:#fff;opacity:.95}
.map:before{height:7px;width:125%;left:-12%;top:51%;transform:rotate(-28deg);box-shadow:0 0 0 2px #d7dde5}
.map:after{width:7px;height:120%;left:57%;top:-10%;transform:rotate(20deg);box-shadow:0 0 0 2px #d7dde5}
.map-pin{position:absolute;font-size:27px;z-index:2}.m1{left:16%;top:67%}.m2{right:18%;top:20%}.mc{right:32%;top:44%;width:18px;height:18px;border-radius:50%;background:var(--green);border:4px solid #fff;z-index:2;position:absolute}
.offer-float{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border-radius:17px;padding:12px;box-shadow:0 10px 30px rgba(22,40,74,.24);z-index:3}
.timer{font-weight:900;color:var(--red)}
.chart{height:120px;display:flex;align-items:end;gap:7px;padding-top:8px}.bar{flex:1;border-radius:7px 7px 2px 2px;background:linear-gradient(#5367f5,#7c4ae6)}
.modal{position:fixed;inset:0;background:rgba(11,20,42,.6);display:none;align-items:end;z-index:60}.modal.show{display:flex}.sheet{width:min(520px,100%);margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:19px;max-height:88vh;overflow:auto}.close{float:right;width:36px;height:36px;border:0;border-radius:12px;background:#f1f4f8}
.input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;outline:0}.label{font-size:12px;font-weight:800;margin:10px 0 6px}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#17243f;color:#fff;padding:11px 14px;border-radius:12px;z-index:70;display:none;max-width:90%}.toast.show{display:block}
.empty{text-align:center;padding:38px 16px}.step{display:flex;align-items:center;gap:9px}.stepdot{width:12px;height:12px;border-radius:50%;background:#d7dfeb}.stepdot.done{background:var(--green)}.stepdot.active{background:var(--blue)}
@media(min-width:700px){.app{box-shadow:0 0 0 1px #dde4ee}}

.logi-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.logi-card.premium{background:linear-gradient(140deg,#f4f1ff,#fff);border-color:#ddd2fa}.logi-card.local{background:linear-gradient(140deg,#eef6ff,#fff)}.logi-card.national{background:linear-gradient(140deg,#eefbf8,#fff)}
.logi-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#eef2ff;color:#3653bd}.logi-badge.gold{background:#fff4d8;color:#9b6700}.logi-badge.green{background:#e8f8f1;color:#087b51}
.logi-route{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;font-size:12px;font-weight:800}.arrow{color:#9aa5b8}.logi-list{display:grid;gap:8px;margin-top:10px}.logi-list div{padding:9px 10px;border-radius:12px;background:#f6f8fb;font-size:12px}.notice{padding:11px 12px;border-radius:13px;background:#f0f5ff;color:#36537d;font-size:11px;line-height:1.45}.warnbox{background:#fff7e7;color:#86611d}.successbox{background:#eaf8f2;color:#167458}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>

<script>
const PRODUCTS=[];
const state={role:null,page:"welcome",cart:[],product:null, sellerTab:"dashboard", courierTab:"home", offerAccepted:false, orderPlaced:false, sellerLogistics:"standard", premium:false};
const app=document.getElementById("app");
function money(n){return "$"+n.toLocaleString("es-MX",{minimumFractionDigits:2})}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}
function go(page){state.page=page;render();window.scrollTo(0,0)}
function modal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()})

function brand(){return `<div class="brand"><span class="mark">V</span>VaniDaxi</div>`}
function topbar(extra=""){return `<div class="topbar">${brand()}<div class="row">${extra}</div></div>`}
function screenTitle(title,back="home"){return `<div class="screen-title"><button class="back" onclick="go('${back}')">‹</button><h1>${title}</h1></div>`}
function buyerNav(){return `<div class="bottom">
<button class="nav ${["home","categories"].includes(state.page)?"active":""}" onclick="go('home')"><b>⌂</b>Inicio</button>
<button class="nav ${state.page==="categories"?"active":""}" onclick="go('categories')"><b>▦</b>Categorías</button>
<button class="nav ${state.page==="cart"?"active":""}" onclick="go('cart')"><b>🛒</b>Carrito</button>
<button class="nav ${["orders","tracking"].includes(state.page)?"active":""}" onclick="go('orders')"><b>▣</b>Pedidos</button>
<button class="nav ${state.page==="profile"?"active":""}" onclick="go('profile')"><b>◉</b>Cuenta</button>
</div>`}
function sellerNav(){return `<div class="bottom">
<button class="nav ${state.sellerTab==="dashboard"?"active":""}" onclick="state.sellerTab='dashboard';render()"><b>⌂</b>Inicio</button>
<button class="nav ${state.sellerTab==="inventory"?"active":""}" onclick="state.sellerTab='inventory';render()"><b>▤</b>Inventario</button>
<button class="nav ${state.sellerTab==="orders"?"active":""}" onclick="state.sellerTab='orders';render()"><b>▣</b>Pedidos</button>
<button class="nav ${state.sellerTab==="finance"?"active":""}" onclick="state.sellerTab='finance';render()"><b>▤</b>Finanzas</button>
<button class="nav ${state.sellerTab==="settings"?"active":""}" onclick="state.sellerTab='settings';render()"><b>⚙</b>Más</button>
</div>`}
function courierNav(){return `<div class="bottom">
<button class="nav ${state.courierTab==="home"?"active":""}" onclick="state.courierTab='home';render()"><b>⌂</b>Inicio</button>
<button class="nav ${state.courierTab==="offers"?"active":""}" onclick="state.courierTab='offers';render()"><b>📍</b>Ofertas</button>
<button class="nav ${state.courierTab==="route"?"active":""}" onclick="state.courierTab='route';render()"><b>🧭</b>Ruta</button>
<button class="nav ${state.courierTab==="earnings"?"active":""}" onclick="state.courierTab='earnings';render()"><b>💰</b>Ganancias</button>
<button class="nav" onclick="roleChooser()"><b>↩</b>Salir</button>
</div>`}

function welcome(){
 return `<div class="content" style="padding-top:50px">
 <div class="hero" style="text-align:center;background:transparent;border:0;box-shadow:none">
   <div style="display:flex;justify-content:center">${brand()}</div>
   <div style="font-size:110px;line-height:1;margin:24px 0;background:linear-gradient(135deg,#7650e6,#3073f2,#24c5b6);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:1000">V</div>
   <h1 style="font-size:30px">Todo lo que necesitas,<br>en un solo lugar.</h1>
   <p>Compra, vende y reparte con VaniDaxi.</p>
   <div style="display:grid;gap:9px;margin-top:18px">
     <button class="btn navy full" onclick="roleChooser()">Comenzar</button>
     <button class="btn outline full" onclick="openLogin()">Iniciar sesión</button>
   </div>
 </div>
 <div class="grid3" style="margin-top:15px">
  <button class="card soft" onclick="state.role='buyer';go('home')"><div class="icon">🛒</div><b class="small">Comprar</b></button>
  <button class="card soft" onclick="state.role='seller';go('seller')"><div class="icon">🏪</div><b class="small">Vender</b></button>
  <button class="card soft" onclick="toast('Los repartidores usan VaniReparte')"><div class="icon">🚚</div><b class="small">Repartir</b><span class="small muted">VaniReparte</span></button>
 </div>
 </div>`;
}
function roleChooser(){
 modal(`<button class="close" onclick="closeModal()">✕</button>
 <h2>¿Cómo quieres usar VaniDaxi?</h2><p class="muted">Puedes tener más de un rol en la misma cuenta.</p>
 <div class="list">
  <button class="listitem" onclick="state.role='buyer';state.page='home';closeModal();render()"><div class="icon">🛍️</div><div class="grow"><b>Comprador</b><div class="small muted">Busca, compra y recibe</div></div>›</button>
  <button class="listitem" onclick="state.role='seller';state.page='seller';closeModal();render()"><div class="icon">🏪</div><div class="grow"><b>Vendedor</b><div class="small muted">Publica productos y gestiona tu tienda</div></div>›</button>
  <button class="listitem" onclick="closeModal();toast('Los repartidores usan VaniReparte')"><div class="icon">🛵</div><div class="grow"><b>Repartidor</b><div class="small muted">Usa la aplicación independiente VaniReparte</div></div>↗</button>
 </div>
 <div class="card" style="margin-top:11px"><b>VaniReparte</b><p class="small muted">Los repartidores utilizan una aplicación independiente para ofertas, paquetes, rutas y entregas.</p></div>`);
}
function openLogin(){modal(`<button class="close" onclick="closeModal()">✕</button><h2>Iniciar sesión</h2><p class="muted">Demostración: no se usan credenciales reales.</p><div class="list">${["Google","Apple","Facebook","Teléfono","Correo"].map(x=>`<button class="listitem" onclick="state.role='buyer';state.page='home';closeModal();render()"><b>${x[0]}</b><span class="grow">Continuar con ${x}</span>›</button>`).join("")}</div>`)}
function search(){go("products")}
function productCard(p){return `<button class="card product-card" onclick="openProduct(${p.id})"><div class="prodphoto">${p.emoji}</div><div class="body"><div class="small muted">${p.cat}</div><b>${p.name}</b><div class="stars">★ ${p.rating}</div><div class="price">${money(p.price)}</div></div></button>`}

function buyerHome(){
 return topbar("<button class='iconbtn' onclick='toast(\"No hay notificaciones nuevas\")'>♡</button><button class='iconbtn' onclick='openRoleMenu()'>⋯</button>")
 + "<div class='content'>"
 + "<div class='search' onclick=\"search()\">⌕<input readonly placeholder='Buscar productos, marcas o tiendas...'></div>"
 + "<div class='hero dark'><span class='pill' style='background:#ffffff18;color:#fff'>VaniDaxi</span><h1>Lo que necesitas, cuando lo necesitas.</h1><p>Compra, vende y recibe en un solo lugar.</p><button class='btn light' onclick=\"go('categories')\">Explorar ahora →</button></div>"
 + "<div class='section-title'><h2>Categorías</h2><button class='link' onclick=\"go('categories')\">Ver todas →</button></div>"
 + "<div class='grid3'>"+[["🛒","Supermercado"],["🍕","Comida"],["👕","Moda"],["📱","Tecnología"],["🏠","Hogar"],["💄","Belleza"]].map(c=>"<button class='card category' onclick=\"go('categories')\"><div class='catimg'>"+c[0]+"</div><b class='small'>"+c[1]+"</b></button>").join("")+"</div>"
 + "<div class='section-title'><h2>Productos</h2></div>"
 + "<div class='card empty'><div style='font-size:42px'>🛍️</div><h3>Aún no hay productos publicados</h3><p class='muted'>Los productos aparecerán aquí cuando un vendedor los publique.</p></div>"
 + "</div>"+buyerNav();
}
function categories(){
 return topbar(`<button class="iconbtn">⌕</button>`) + screenTitle("Categorías") + `<div class="content">
 <div class="search"><span>⌕</span><input placeholder="Buscar en categorías..."></div>
 <div class="grid2">${[["🛒","Supermercado","Alimentos y bebidas"],["🍕","Comida","Restaurantes y más"],["👕","Moda","Ropa y accesorios"],["🏠","Hogar","Muebles, decoración"],["📱","Tecnología","Celulares, computadoras"],["💄","Belleza","Cuidado personal"],["🏋️","Deportes","Fitness, aire libre"],["🚗","Automotriz","Refacciones y más"]].map(x=>`<button class="card category" onclick="go('products')"><div class="catimg">${x[0]}</div><b>${x[1]}</b><span class="small muted">${x[2]}</span></button>`).join("")}</div>
 <div class="card" style="margin-top:12px"><div class="row"><div class="icon">🍎</div><div class="grow"><b>Supermercado + comida</b><div class="small muted">Todo integrado en VaniDaxi</div></div><button class="btn soft" onclick="go('supermarket')">Ver</button></div></div>
 </div>${buyerNav()}`;
}
function supermarket(){
 return topbar()+screenTitle("Supermercado")+ "<div class='content'><div class='tabs'><button class='tab active'>Todos</button><button class='tab'>Alimentos</button><button class='tab'>Bebidas</button><button class='tab'>Limpieza</button></div><div class='card empty' style='margin-top:12px'><div style='font-size:42px'>🛒</div><h3>Sin productos publicados</h3><p class='muted'>Los productos del supermercado aparecerán cuando existan publicaciones reales.</p></div></div>"+buyerNav();
}
function productsView(){
 return topbar()+screenTitle("Buscar productos")+ "<div class='content'><div class='search'><span>⌕</span><input id='q' placeholder='Buscar productos, marcas o tiendas...' oninput='filterProducts(this.value)'></div><div class='tabs'><button class='tab active'>Todos</button><button class='tab'>Productos</button><button class='tab'>Tiendas</button></div><div id='product-grid' class='grid2' style='margin-top:12px'><div class='card empty' style='grid-column:1/-1'><div style='font-size:42px'>⌕</div><h3>Aún no hay productos publicados</h3><p class='muted'>Cuando existan productos reales podrás buscarlos aquí.</p></div></div></div>"+buyerNav();
}
function filterProducts(q){
 const el=document.getElementById("product-grid");
 if(!el)return;
 const xs=PRODUCTS.filter(p=>(p.name+" "+p.cat+" "+p.store).toLowerCase().includes(q.toLowerCase()));
 el.innerHTML=xs.length?xs.map(productCard).join(""):"<div class='card empty' style='grid-column:1/-1'><div style='font-size:42px'>⌕</div><b>No encontramos productos</b><p class='muted'>Todavía no hay productos publicados.</p></div>";
}
function openProduct(id){state.product=PRODUCTS.find(p=>p.id===id);go("product")}
function productDetail(){
 if(!state.product){
  return topbar()+screenTitle("Producto")+ "<div class='content'><div class='card empty'><div style='font-size:42px'>🛍️</div><h3>Producto no disponible</h3><p class='muted'>Este producto aún no está publicado.</p></div></div>"+buyerNav();
 }
 const p=state.product;
 return topbar()+screenTitle("Detalle del producto")+ "<div class='content product-detail'><div class='card'><div class='bigphoto'>"+p.emoji+"</div><div style='margin-top:12px'><h2 style='font-size:22px;margin:10px 0 4px'>"+p.name+"</h2><div class='stars'>★ "+p.rating+"</div><div class='price'>"+money(p.price)+"</div><button class='btn primary full' style='margin-top:12px' onclick='addToCart("+p.id+")'>Agregar al carrito</button></div></div></div>"+buyerNav();
}
function addToCart(id){state.cart.push(PRODUCTS.find(p=>p.id===id));toast("Producto agregado");go("cart")}
function buyNow(id){addToCart(id);setTimeout(()=>go("checkout"),0)}
function cartView(){
 const subtotal=state.cart.reduce((sum,p)=>sum+p.price,0),ship=state.cart.length?99:0,total=subtotal+ship;
 return topbar()+screenTitle(`Carrito (${state.cart.length})`) + `<div class="content">
 <div class="list">${state.cart.length?state.cart.map((p,i)=>`<div class="card"><div class="row"><div class="icon">${p.emoji}</div><div class="grow"><b>${p.name}</b><div class="small muted">${p.cat}</div><div class="quantity" style="margin-top:7px"><button onclick="toast('Cantidad - demo')">−</button><span>1</span><button onclick="toast('Cantidad + demo')">+</button></div></div><b>${money(p.price)}</b></div></div>`).join(""):`<div class="card empty"><div style="font-size:48px">🛒</div><h3>Tu carrito está vacío</h3><button class="btn primary" onclick="go('products')">Explorar productos</button></div>`}</div>
 ${state.cart.length?`<div class="card" style="margin-top:12px"><div class="kpi"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="kpi"><span>Envío</span><b>${money(ship)}</b></div><div class="kpi"><span>Total</span><b>${money(total)}</b></div><button class="btn navy full" onclick="go('checkout')">Continuar a pagar</button></div>`:""}
 </div>${buyerNav()}`;
}
function checkout(){
 if(!state.cart.length){
  return topbar()+screenTitle("Finalizar compra")+ "<div class='content'><div class='card empty'><div style='font-size:42px'>🛒</div><h3>No hay artículos para comprar</h3><p class='muted'>Agrega productos publicados para continuar.</p></div></div>"+buyerNav();
 }
 const subtotal=state.cart.reduce((s,p)=>s+p.price,0);
 return topbar()+screenTitle("Finalizar compra")+ "<div class='content'><div class='card'><div class='row'><div class='icon'>📍</div><div class='grow'><b>Dirección de envío</b><div class='small muted'>No configurada</div></div><button class='link' onclick=\"toast('Configura tu dirección desde tu cuenta')\">Configurar</button></div></div><div class='card' style='margin-top:10px'><div class='row'><div class='icon'>💳</div><div class='grow'><b>Método de pago</b><div class='small muted'>No configurado</div></div><button class='link' onclick=\"toast('Configura tu método de pago')\">Configurar</button></div></div><div class='card' style='margin-top:10px'><h3>Resumen del pedido</h3><div class='kpi'><span>Productos</span><b>"+money(subtotal)+"</b></div><div class='kpi'><span>Envío</span><b>Se calculará</b></div><button class='btn primary full' disabled style='margin-top:10px'>Hacer pedido</button><p class='small muted' style='margin-bottom:0'>El pedido se habilitará cuando estén configurados los datos necesarios.</p></div></div>";
}
function placeOrder(){state.orderPlaced=true;state.cart=[];go("orders");toast("Pedido creado");}
function orders(){
 return topbar()+screenTitle("Mis pedidos")+ "<div class='content'><div class='card empty'><div style='font-size:42px'>📦</div><h3>No tienes pedidos registrados</h3><p class='muted'>Aquí aparecerán tus pedidos reales cuando realices una compra.</p><button class='btn primary' onclick=\"go('home')\">Volver al inicio</button></div></div>"+buyerNav();
}
function tracking(){
 return topbar()+screenTitle("Seguimiento")+ "<div class='content'><div class='card empty'><div style='font-size:42px'>🧭</div><h3>No hay pedidos en seguimiento</h3><p class='muted'>El seguimiento aparecerá cuando exista un pedido activo.</p></div></div>"+buyerNav();
}
function profile(){
 return topbar()+screenTitle("Cuenta")+ "<div class='content'><div class='card'><div class='row'><div class='icon'>👤</div><div class='grow'><b>Mi cuenta</b><div class='small muted'>Información personal pendiente de registro</div></div></div></div><div class='list' style='margin-top:11px'>"+["Direcciones","Métodos de pago","Notificaciones","Privacidad y seguridad","Ayuda"].map(x=>"<div class='listitem'><b class='grow'>"+x+"</b>›</div>").join("")+"<button class='btn outline full' onclick='roleChooser()'>Cambiar rol</button><button class='btn full' style='background:#ffe9ec;color:#b52f3e' onclick=\"state.role=null;go('welcome')\">Cerrar sesión</button></div></div>"+buyerNav();

function openRoleMenu(){roleChooser()}

 const tab=state.sellerTab;

 } else if(tab==="orders"){
   title="Pedidos (vendedor)";
   body="<div class='notice' style='margin-bottom:10px'>La operación logística está preparada para Mazatlán y para envíos fuera de Mazatlán, pero los pedidos se mostrarán solamente cuando existan ventas reales.</div><div class='tabs'><button class='tab active'>Nuevos (0)</button><button class='tab'>En preparación (0)</button><button class='tab'>Enviados (0)</button></div><div class='card empty' style='margin-top:11px'><div style='font-size:42px'>🧾</div><h3>Sin pedidos</h3><p class='muted'>Los pedidos reales aparecerán aquí.</p></div>";
 } else if(tab==="finance"){
   title="Finanzas";
   body="<div class='grid2'><div class='card'><div class='small muted'>Ingresos</div><div class='stat'>$0.00</div><span class='small muted'>Sin ventas registradas</span></div><div class='card'><div class='small muted'>Egresos</div><div class='stat'>$0.00</div><span class='small muted'>Sin movimientos registrados</span></div></div><div class='card' style='margin-top:10px;background:#eafbf3'><div class='small muted'>Ganancias</div><div class='stat'>$0.00</div><span class='small muted'>Se calcularán con datos reales</span></div><div class='card' style='margin-top:10px'><h3>Flujo de la semana</h3><div class='empty'><p class='muted'>Todavía no hay movimientos para mostrar.</p></div></div>";
 } else if(tab==="logistics"){
   title="Envíos y logística";
   body="<div class='logi-card premium'><div class='row'><div class='icon'>⭐</div><div class='grow'><span class='logi-badge gold'>VaniDaxi Premium</span><h3 style='margin-top:7px'>Almacenamiento y operación logística</h3><div class='small muted'>Opcional. Disponible inicialmente para operaciones en Mazatlán.</div></div><button class='btn navy' onclick=\"state.premium=!state.premium;state.sellerLogistics=state.premium?'premium':'standard';render()\">"+(state.premium?"Activo":"Ver Premium")+"</button></div><div class='logi-list'><div>✓ VaniDaxi recibe y almacena tu inventario.</div><div>✓ Se controlan las existencias.</div><div>✓ Se preparan, empaquetan y etiquetan los pedidos.</div><div>✓ Se coordina la entrega con VaniReparte.</div></div><div class='notice' style='margin-top:10px'>Los costos y condiciones se mostrarán antes de contratar.</div></div><div class='section-title'><h2>Sin Premium</h2><span class='logi-badge'>10% por venta</span></div><div class='logi-card local'><div class='row'><div class='icon'>🏪</div><div class='grow'><b>Inventario propio</b><div class='small muted'>Preparas, empaquetas y etiquetas el pedido.</div></div></div><div class='logi-route'><span>Vendedor</span><span class='arrow'>→</span><b>VaniReparte recoge</b><span class='arrow'>→</span><span>Comprador</span></div></div><div class='section-title'><h2>Fuera de Mazatlán</h2><span class='logi-badge green'>Envío nacional</span></div><div class='logi-card national'><div class='logi-route'><b>Vendedor</b><span class='arrow'>→</span><b>Paquetería</b><span class='arrow'>→</span><b>Comprador</b></div><p class='small muted' style='margin-bottom:0'>VaniDaxi supervisará digitalmente la venta y el seguimiento.</p></div>";
 } else if(tab==="settings"){
   title="Configuración";
   body="<div class='list'>"+["Mi tienda","Información de la tienda","Métodos de pago","Notificaciones","Políticas y términos"].map(x=>"<div class='listitem'><div class='icon'>⚙</div><b class='grow'>"+x+"</b>›</div>").join("")+"<button class='listitem' onclick=\"state.sellerTab='logistics';render()\"><div class='icon'>📦</div><div class='grow'><b>Envíos y logística</b><div class='small muted'>Modalidades y recolecciones</div></div>›</button></div><button class='btn outline full' style='margin-top:10px' onclick=\"state.role=null;go('welcome')\">Cerrar sesión</button>";
 } else {
   body="<div class='grid3'><div class='card'><div class='small muted'>Ventas</div><div class='stat'>$0.00</div><span class='small muted'>Sin ventas registradas</span></div><div class='card'><div class='small muted'>Pedidos</div><div class='stat'>0</div><span class='small muted'>Sin pedidos registrados</span></div><div class='card'><div class='small muted'>Productos</div><div class='stat'>0</div><span class='small muted'>Sin productos registrados</span></div></div><div class='card' style='margin-top:10px'><h3>Ventas de los últimos 7 días</h3><div class='empty'><p class='muted'>Todavía no hay datos de ventas.</p></div></div><div class='section-title'><h2>Logística</h2><span class='logi-badge'>Mazatlán</span></div><div class='logi-card local'><div class='row'><div class='icon'>📦</div><div class='grow'><b>Inventario propio</b><div class='small muted'>Prepara tus pedidos y VaniReparte podrá recogerlos cuando exista una venta real.</div></div><button class='btn soft' onclick=\"state.sellerTab='logistics';render()\">Ver</button></div><div class='logi-route'><span>Vendedor</span><span class='arrow'>→</span><b>VaniReparte</b><span class='arrow'>→</span><span>Comprador</span></div></div><div class='section-title'><h2>Accesos</h2></div><div class='grid2'><button class='card' onclick=\"state.sellerTab='inventory';render()\"><div class='icon'>📦</div><b>Inventario</b></button><button class='card' onclick=\"state.sellerTab='orders';render()\"><div class='icon'>🧾</div><b>Pedidos</b></button><button class='card' onclick=\"state.sellerTab='finance';render()\"><div class='icon'>💰</div><b>Finanzas</b></button><button class='card' onclick=\"toast('Las estadísticas se mostrarán con datos reales')\"><div class='icon'>📊</div><b>Estadísticas</b></button></div>";
 }
 return topbar()+screenTitle(title,"seller")+"<div class='content'>"+body+"</div>"+sellerNav();
}
function courierView(){
 const tab=state.courierTab;
 let title=tab==="home"?"Panel del repartidor":tab==="offers"?"Ofertas (60 segundos)":tab==="route"?"Ruta y recogida":"Mis ganancias";
 let body="";
 if(tab==="offers"){
   body="<div class='card empty'><div style='font-size:42px'>⚡</div><h3>No hay ofertas disponibles</h3><p class='muted'>Las ofertas aparecerán cuando existan pedidos reales y el repartidor esté disponible.</p></div>";
 } else if(tab==="route"){
   body="<div class='card empty'><div style='font-size:42px'>🧭</div><h3>No hay una ruta activa</h3><p class='muted'>Aquí aparecerá una ruta cuando aceptes una entrega real.</p></div>";
 } else if(tab==="earnings"){
   body="<div class='grid2'><div class='card'><div class='small muted'>Hoy</div><div class='stat'>$0.00</div></div><div class='card'><div class='small muted'>Esta semana</div><div class='stat'>$0.00</div></div></div><div class='card' style='margin-top:10px'><div class='kpi'><span>Entregas</span><b>0</b></div><div class='kpi'><span>Paquetes</span><b>0</b></div></div>";
 } else {
   body="<div class='card'><span class='pill'>Registro pendiente</span><h2 style='margin-top:12px'>Disponible para registrarte</h2><p class='muted'>Completa el registro de repartidor para poder recibir ofertas.</p><button class='btn outline full' onclick=\"toast('El registro se conectará al flujo real')\">Iniciar registro</button></div><div class='card' style='margin-top:10px'><h3>Requisitos</h3>"+["Identificación","Licencia de conducir","Comprobante de domicilio","Vehículo","Foto de identidad","Aceptación de términos"].map(x=>"<div class='kpi'><span>"+x+"</span><span class='muted'>Pendiente</span></div>").join("")+"</div>";
 }
 return topbar()+screenTitle(title,"courier")+"<div class='content'>"+body+"</div>"+courierNav();
}
function acceptOffer(){state.offerAccepted=true;state.courierTab="route";render();toast("Oferta aceptada; las demás desaparecieron")}
function pinModal(){modal(`<button class="close" onclick="closeModal()">✕</button><h2>PIN de entrega</h2><p class="muted">El comprador recibe un PIN de seguridad por SMS.</p><div class="label">PIN</div><input id="pin" class="input" maxlength="4" inputmode="numeric" placeholder="4587"><button class="btn primary full" style="margin-top:10px" onclick="verifyPin()">Verificar PIN</button><p class="small muted">Demo: 4587</p>`)}
function verifyPin(){if(document.getElementById("pin").value==="4587"){closeModal();state.courierTab="earnings";render();toast("Entrega completada")}else toast("PIN incorrecto")}
function packages(){
 return topbar()+screenTitle("Paquetería","courier")+"<div class='content'><div class='card empty'><div style='font-size:42px'>📦</div><h3>No hay paquetes disponibles</h3><p class='muted'>Los paquetes aparecerán cuando un vendedor publique pedidos reales.</p></div></div>";
}
function admin(){
 return topbar()+screenTitle("Administración")+ "<div class='content'><div class='card empty'><div style='font-size:42px'>🛡️</div><h3>Sin datos operativos todavía</h3><p class='muted'>Los usuarios, vendedores, repartidores, pedidos y pagos se mostrarán cuando la plataforma esté conectada a sus datos reales.</p></div><div class='card' style='margin-top:10px'><h3>Operación</h3>"+["Verificar repartidores","Incidencias","Comisiones","Paquetería","Reportes"].map(x=>"<div class='listitem' style='margin-top:8px'><b class='grow'>"+x+"</b>›</div>").join("")+"</div></div>";
}
function render(){
 if(state.page==="welcome"){app.innerHTML=welcome();return}
 if(state.role==="buyer"){
   const pages={home:buyerHome,categories,supermarket,products:productsView,product:productDetail,cart:cartView,checkout,orders,tracking,profile};
   if(state.page==="admin"){app.innerHTML=admin();return}
   if(state.page==="packages"){app.innerHTML=packages();return}
   app.innerHTML=(pages[state.page]||buyerHome)();
 } else if(state.role==="seller"){
   app.innerHTML=sellerView();
 } else if(state.role==="courier"){
   state.role=null; go("welcome"); toast("Los repartidores utilizan VaniReparte");
 }
}
render();
</script>
