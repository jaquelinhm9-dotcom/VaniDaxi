<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08060f"><title>VaniDaxi</title><style>:root{--p:#7b28ff;--p2:#e33ce0;--bg:#08060f}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:#fff}.app{max-width:520px;min-height:100vh;margin:auto;background:#f7f7fa;color:#17131d;padding-bottom:80px}.top{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #eee;padding:11px 15px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px;font-weight:1000;font-size:20px}.logo{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#5b1cff,#f046d7);display:grid;place-items:center;color:#fff;font-weight:1000}.brand span{background:linear-gradient(90deg,#16121a 40%,#7b28ff 58%,#e33ce0);-webkit-background-clip:text;color:transparent}.wrap{padding:14px 16px}.search{background:#f0eef3;border-radius:15px;padding:12px;display:flex;gap:8px}.search input{border:0;background:transparent;outline:0;flex:1}.hero{margin-top:12px;background:linear-gradient(135deg,#5a1dff,#9236ff 55%,#eb44d8);border-radius:25px;padding:20px;min-height:205px;position:relative;overflow:hidden;color:#fff}.hero h1{font-size:30px;max-width:245px;line-height:1.04}.bag{position:absolute;right:28px;bottom:25px;width:84px;height:78px;background:#101017;border-radius:22px}.bag:after{content:"V";display:grid;place-items:center;height:100%;color:#c84cff;font-weight:1000;font-size:40px}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 0 9px}.cats,.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.grid{grid-template-columns:1fr 1fr}.cat{border:0;background:none;color:#221c28;text-align:center}.dot{background:#eeeaf2;border-radius:15px;padding:15px 5px;font-size:22px}.product{background:#fff;border-radius:20px;overflow:hidden;border:1px solid #ece7f0}.photo{height:145px;background:#f1edf5;display:grid;place-items:center;font-size:48px}.body{padding:11px}.body h3{min-height:35px;font-size:14px}.price{font-size:18px;font-weight:1000}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900}.primary{background:linear-gradient(90deg,#6b24ff,#c03de8);color:#fff}.dark{background:#19131f;color:#fff}.full{width:100%}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #e1dce5;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}.grow{flex:1}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #e5e0e8;display:grid;grid-template-columns:repeat(5,1fr);z-index:5;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.nav{border:0;background:none;color:#817888;font-size:9px}.nav b{display:block;font-size:18px}.active{color:#7224ff}.auth{min-height:100vh;background:radial-gradient(circle at 50% -10%,#4d176c,#180e23 40%,#08060f 72%);padding:28px 18px}.auth .logo{width:82px;height:82px;margin:auto;font-size:40px}.auth h1{text-align:center;font-size:34px;color:#fff}.auth p{text-align:center;color:#c8bfd0}.authCard{background:#120d1d;border:1px solid #39284a;border-radius:23px;padding:16px;color:#fff;margin-top:24px}.input{width:100%;padding:12px;border:1px solid #3b2b4a;background:#0f0a16;color:#fff;border-radius:13px}.label{font-size:10px;font-weight:900;display:block;margin:11px 0 6px}.socials{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.social{border:1px solid #3b2b4a;background:#17101f;color:#fff;border-radius:13px;padding:10px;font-weight:900}.promo{display:grid;gap:8px;margin-top:12px}.promo div{background:#120d1d;border:1px solid #39284a;border-radius:16px;padding:12px;color:#fff}.modal{position:fixed;inset:0;background:#050307b8;display:none;align-items:flex-end;z-index:20}.on{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px}.close{float:right}.small{font-size:11px;color:#777}</style></head><body><div id="app" class="app"></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><script src="app-config.js"></script><script src="supabase-client.js"></script><script>
const A=VaniAPI,$=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));let user=null,page="home",role="customer",orders=[],cart=[],store=null,sellerProducts=[],sellerStats={},selectedOrder=null,sellerOrders=[],sellerLogistics=null;let cats=["Tecnología","Moda","Hogar","Deportes","Belleza"],prods=[["Audífonos Bluetooth",499,"🎧","demo-1","Tecnología","VaniDaxi",10],["Tenis Casual Unisex",899,"👟","demo-2","Moda","VaniDaxi",8],["Bolsa urbana",649,"👜","demo-3","Moda","VaniDaxi",5],["Lámpara minimalista",399,"💡","demo-4","Hogar","VaniDaxi",12]];function modal(h){$("#sheet").innerHTML=h;$("#modal").classList.add("on")}function closeModal(){$("#modal").classList.remove("on")}function auth(){app.innerHTML='<div class="auth"><div class="logo">V</div><h1>Vani<span style="color:#c64cff">Daxi</span></h1><p>Tu mundo, más cerca</p><div class="authCard"><h2>Iniciar sesión</h2><label class="label">Correo</label><input id="e" class="input"><label class="label">Contraseña</label><input id="p" class="input" type="password"><button class="btn primary full" style="margin-top:12px" onclick="login()">Iniciar sesión</button><button class="btn" style="width:100%;margin-top:8px;background:#fff" onclick="register()">Crear cuenta</button><div style="text-align:center;font-size:10px;color:#8c8192;margin:14px 0">O continúa con</div><div class="socials"><button class="social" onclick="A.auth.oauth(&quot;google&quot;)">G</button><button class="social" onclick="A.auth.oauth(&quot;facebook&quot;)">f</button><button class="social" onclick="A.auth.oauth(&quot;apple&quot;)"></button><button class="social" onclick="alert(&quot;SMS se conecta en la configuración final&quot;)">☎</button></div></div><div class="promo"><div><b>🛒 Compradores</b><div class="small" style="color:#bbb">Compra y recibe.</div></div><div><b>🏪 Vendedores</b><div class="small" style="color:#bbb">Publica y administra.</div></div><div><b>🚚 VaniReparte</b><div class="small" style="color:#bbb">Aplicación independiente.</div></div><button class="btn dark full" onclick="demo()">Ver demostración</button></div></div>'}async function loadRealData(){if(A.demo||!user)return;try{const cs=await A.table.list("categories","id,name","is_active=eq.true","order=name.asc");if(cs.length)cats=cs.map(x=>x.name);const ps=await A.table.list("products","id,name,price,stock,image_url,status,categories(name),seller_stores(store_name)","status=eq.approved","stock=gt.0","order=created_at.desc");if(ps.length)prods=ps.slice(0,20).map(x=>[x.name,Number(x.price||0),"🛍",x.id,x.categories?.name||"VaniDaxi",x.seller_stores?.store_name||"Vendedor",Number(x.stock||0)]);const os=await A.table.list("orders","id,order_number,status,total,created_at,delivery_status,delivery_provider,delivery_tracking","user_id=eq."+user.id,"order=created_at.desc");orders=os||[];const pr=await A.table.list("profiles","role,full_name","id=eq."+user.id,"limit=1");role=pr[0]?.role||"customer";if(role==="seller")await loadSeller()}catch(e){console.warn(e.message)}}async function loadSeller(){try{const st=await A.rpc("get_my_seller_store",{});store=Array.isArray(st)?st[0]||null:st||null}catch{store=null}if(store?.id){sellerProducts=await A.table.list("products","id,name,price,stock,status,sku,category_id","seller_id=eq."+store.id,"order=created_at.desc")||[];sellerOrders=await A.table.list("order_items","id,order_id,product_name,quantity,total_price,seller_id,orders(id,order_number,status,total,delivery_provider,delivery_status,delivery_tracking,created_at)","seller_id=eq."+store.id,"order=created_at.desc","limit=100")||[];try{sellerLogistics=await A.rpc("get_my_seller_logistics",{})}catch{sellerLogistics=null}}sellerStats={products:sellerProducts.length,stock:sellerProducts.reduce((s,p)=>s+Number(p.stock||0),0)}}function addToCart(i){const p=prods.find(x=>x[3]===i)||prods[i];if(!p)return;const key=p[3]||String(i),found=cart.find(x=>x.id===key);if(found)found.qty=Math.min(found.qty+1,Number(p[6]||99));else cart.push({id:key,p,qty:1});if(page==="cart")render()}async function login(){if(A.demo){user={name:"Usuario demo",email:$("#e").value||"demo@local"};render();return}A.auth.signIn($("#e").value,$("#p").value).then(()=>A.auth.me()).then(async u=>{user=u;await loadRealData();render()}).catch(e=>alert(e.message))}function register(){modal('<button class="close" onclick="closeModal()">✕</button><h2>Crear cuenta</h2><label class="label">Tipo</label><select id="r" class="input"><option value="customer">Comprador</option><option value="seller">Vendedor</option></select><label class="label">Nombre</label><input id="n" class="input"><label class="label">Correo</label><input id="re" class="input" type="email"><label class="label">Contraseña</label><input id="rp" class="input" type="password"><button class="btn primary full" style="margin-top:12px" onclick="createAccount()">Crear cuenta</button>')}async function createAccount(){try{const requested=$("#r").value,name=$("#n").value.trim(),email=$("#re").value.trim(),password=$("#rp").value;if(!name||!email||!password)throw Error("Completa nombre, correo y contraseña.");const d=await A.auth.signUp(email,password,{account_type:requested,onboarding_role:requested,name,full_name:name,display_name:name});if(d.access_token){user=await A.auth.me();await loadRealData();closeModal();page=requested==="seller"?"seller":"home";render()}else{closeModal();alert("Revisa tu correo para confirmar la cuenta.")}}catch(e){alert(e.message)}}async function becomeSeller(){try{await A.rpc("become_seller",{});await loadRealData();page="seller";render()}catch(e){alert(e.message)}}function demo(){user={name:"Usuario demo",email:"demo@vanidaxi.local"};render()}function nav(){return '<div class="bottom"><button class="nav '+(page==="home"?"active":"")+'" onclick="go(&quot;home&quot;)"><b>⌂</b>Inicio</button><button class="nav '+(page==="cats"?"active":"")+'" onclick="go(&quot;cats&quot;)"><b>▦</b>Categorías</button><button class="nav '+(page==="cart"?"active":"")+'" onclick="go(&quot;cart&quot;)"><b>🛒</b>Carrito</button><button class="nav '+(page==="orders"?"active":"")+'" onclick="go(&quot;orders&quot;)"><b>▣</b>Pedidos</button><button class="nav '+(page==="account"?"active":"")+'" onclick="go(&quot;account&quot;)"><b>◉</b>Perfil</button></div>'}function top(){return '<div class="top"><div class="brand"><div class="logo">V</div><span>VaniDaxi</span></div><div>♢ ⚙</div></div>'}function home(){return top()+'<div class="wrap"><div class="search">⌕ <input placeholder="Buscar productos, tiendas o categorías"></div><div class="hero"><div>VaniDaxi · COMPRA Y VENDE</div><h1>Lo que necesitas, en un solo lugar</h1><p>Compra fácil, seguro y rápido.</p><button class="btn primary" onclick="go(&quot;cats&quot;)">Explorar ahora</button><div class="bag"></div></div><div class="section"><h2>Categorías</h2><button style="border:0;background:none;color:#7224ff" onclick="go(&quot;cats&quot;)">Ver todo</button></div><div class="cats">'+cats.map((c,i)=>'<button class="cat"><div class="dot">'+["⌘","✦","⌂","◈","✿"][i]+'</div><span>'+c+'</span></button>').join("")+'</div><div class="section"><h2>Ofertas especiales</h2></div><div class="grid">'+prods.map((p,i)=>'<div class="product"><div class="photo">'+p[2]+'</div><div class="body"><div class="small">'+cats[i%5]+'</div><h3>'+p[0]+'</h3><div class="price">$'+p[1]+'.00</div><button class="btn primary full" onclick="add('+i+')">Agregar</button></div></div>').join("")+'</div><div class="card" style="margin-top:12px"><b>Vende en VaniDaxi</b><div class="small">Panel con inventario, ingresos, egresos y ganancias.</div><button class="btn primary" style="margin-top:9px" onclick="role=&quot;seller&quot;;page=&quot;seller&quot;;render()">Quiero ser vendedor</button></div></div>'+nav()}function catsPage(){return top()+'<div class="wrap"><div class="section"><h2>Categorías</h2></div><div class="grid">'+cats.map(c=>'<button class="item" onclick="go(\'home\')"><span class="grow"><b>'+c+'</b></span>›</button>').join("")+'</div></div>'+nav()}function add(i){addToCart(i)}function cartPage(){const total=cart.reduce((s,x)=>s+x.p[1]*x.qty,0);return top()+'<div class="wrap"><h2>Carrito</h2>'+(cart.length?'<div class="list">'+cart.map(x=>'<div class="item"><span>'+x.p[2]+'</span><div class="grow"><b>'+x.p[0]+'</b><div class="small">'+money(x.p[1])+' × '+x.qty+'</div></div><b>'+money(x.p[1]*x.qty)+'</b><button class="nav" onclick="removeCart(&quot;'+x.id+'&quot;)">✕</button></div>').join("")+'</div><div class="card" style="margin-top:12px"><b>Total</b><b style="float:right">'+money(total)+'</b><button class="btn primary full" style="margin-top:10px" onclick="checkout()">Continuar</button></div>':'<div class="card"><h3>Tu carrito está vacío</h3><div class="small">Agrega productos del catálogo.</div></div>')+'</div>'+nav()}function removeCart(id){cart=cart.filter(x=>x.id!==id);render()}function checkout(){if(!cart.length)return;modal('<button class="close" onclick="closeModal()">✕</button><h2>Datos de entrega</h2><div class="small">El pedido se registra antes de pasar al flujo de pago.</div><label class="label">Nombre</label><input id="an" class="input"><label class="label">Teléfono</label><input id="ap" class="input"><label class="label">Calle y número</label><input id="al" class="input"><label class="label">Colonia</label><input id="ac" class="input"><label class="label">Ciudad</label><input id="aci" class="input"><label class="label">Estado</label><input id="ae" class="input"><label class="label">Código postal</label><input id="az" class="input"><button class="btn primary full" style="margin-top:12px" onclick="createOrder()">Crear pedido</button>')}async function openPayment(orderId){modal('<button class="close" onclick="closeModal()">✕</button><h2>Elegir forma de pago</h2><div class="small">Serás enviado al proveedor de pago para completar la compra.</div><div class="list" style="margin-top:12px"><button class="item" style="width:100%;border:1px solid #e1dce5;text-align:left" onclick="payOrder(&quot;'+orderId+'&quot;,&quot;stripe&quot;,&quot;tarjeta&quot;)">💳 <span class="grow"><b>Tarjeta</b><div class="small">Stripe</div></span>›</button><button class="item" style="width:100%;border:1px solid #e1dce5;text-align:left" onclick="payOrder(&quot;'+orderId+'&quot;,&quot;mercadopago&quot;,&quot;tarjeta&quot;)">💙 <span class="grow"><b>Mercado Pago</b><div class="small">Checkout de Mercado Pago</div></span>›</button><button class="item" style="width:100%;border:1px solid #e1dce5;text-align:left" onclick="payOrder(&quot;'+orderId+'&quot;,&quot;stripe&quot;,&quot;oxxo&quot;)">🏪 <span class="grow"><b>OXXO</b><div class="small">Stripe</div></span>›</button></div>')}async function payOrder(orderId,provider,method){try{const fn=provider==="stripe"?"stripe-checkout":"mercadopago-checkout";const r=await A.edge(fn,"POST",{order_id:orderId,payment_method:method});if(!r?.checkout_url)throw Error("El proveedor de pago no devolvió una URL de checkout.");closeModal();location.href=r.checkout_url}catch(e){alert(e.message)}}async function createOrder(){try{const address={full_name:document.getElementById("an").value.trim(),phone:document.getElementById("ap").value.trim(),address_line1:document.getElementById("al").value.trim(),address_line2:document.getElementById("ac").value.trim(),city:document.getElementById("aci").value.trim(),state:document.getElementById("ae").value.trim(),postal_code:document.getElementById("az").value.trim(),country:"México"};if(!address.full_name||!address.address_line1||!address.city||!address.state||!address.postal_code)throw Error("Completa los datos de entrega.");if(A.demo){cart=[];closeModal();page="orders";render();alert("Pedido de demostración creado.");return}const items=cart.map(x=>({product_id:x.p[3],qty:x.qty}));const id=await A.rpc("create_commercial_order",{p_items:items,p_shipping_address:address});closeModal();openPayment(id)}catch(e){alert(e.message)}}function money(n){return "$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2})}function ordersPage(){return top()+'<div class="wrap"><div class="section"><h2>Mis pedidos</h2><button class="nav active" onclick="loadRealData().then(render)">Actualizar</button></div>'+(orders.length?'<div class="list">'+orders.map(o=>'<button class="item" style="width:100%;text-align:left" onclick="openOrder(&quot;'+o.id+'&quot;)"><span>📦</span><div class="grow"><b>#'+esc(o.order_number)+'</b><div class="small">'+esc(o.status)+' · '+esc(o.delivery_status||"pendiente")+' · '+esc(o.delivery_provider||"sin proveedor")+'</div></div><b>'+money(o.total)+'</b> ›</button>').join("")+'</div>':'<div class="card"><h3>No hay pedidos todavía</h3><div class="small">Cuando realices una compra aparecerá aquí.</div></div>')+'</div>'+nav()}async function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;let packs=[],events=[];if(!A.demo){try{packs=await A.table.list("package_requests","id,order_id,status,pickup_mode,accepted_route_id,ready_at","order_id=eq."+id,"order=created_at.desc")}catch{}try{events=await A.table.list("delivery_events","id,event_type,created_at","order_id=eq."+id,"order=created_at.desc","limit=20")}catch{}}modal('<button class="close" onclick="closeModal()">✕</button><h2>#'+esc(o.order_number)+'</h2><div class="item"><span>Estado</span><b style="margin-left:auto">'+esc(o.status)+'</b></div><div class="item"><span>Entrega</span><b style="margin-left:auto">'+esc(o.delivery_status||"pendiente")+'</b></div><div class="item"><span>Proveedor</span><b style="margin-left:auto">'+esc(o.delivery_provider||"pendiente")+'</b></div>'+(packs.length?'<h3>Logística</h3>'+packs.map(p=>'<div class="item"><div class="grow"><b>'+esc(p.pickup_mode)+'</b><div class="small">'+esc(p.status)+' · '+esc(p.ready_at||"sin fecha")+'</div></div></div>').join(""):'')+(events.length?'<h3>Seguimiento</h3>'+events.map(e=>'<div class="item"><div class="grow"><b>'+esc(e.event_type)+'</b><div class="small">'+esc(e.created_at)+'</div></div></div>').join(""):'')+'<button class="btn dark full" style="margin-top:10px" onclick="closeModal()">Cerrar</button>')}function account(){return top()+'<div class="wrap"><div class="item"><div class="logo">V</div><div class="grow"><b>'+esc(user.name)+'</b><div class="small">'+esc(user.email)+'</div></div><span>'+esc(role)+'</span></div><h2>Configuración</h2><div class="list">'+(role==="seller"?'<button class="item" style="width:100%;border:1px solid #e1dce5" onclick="go(&quot;seller&quot;)">🏪 <span class="grow">Panel de vendedor</span>›</button>':'<button class="item" style="width:100%;border:1px solid #e1dce5" onclick="becomeSeller()">🏪 <span class="grow">Quiero ser vendedor</span>›</button>')+'<div class="item">📍 <span class="grow">Dirección</span>›</div><div class="item">💬 <span class="grow">Ayuda y soporte</span>›</div><div class="item">🔔 <span class="grow">Notificaciones</span>›</div></div><button class="btn dark full" style="margin-top:12px" onclick="user=null;auth()">Cerrar sesión</button></div>'+nav()}function seller(){if(role!=="seller")return home();return top()+'<div class="wrap"><div class="hero" style="min-height:0"><div>PANEL DEL VENDEDOR</div><h1>'+esc(store?.store_name||"Mi tienda")+'</h1><p>Inventario, pedidos y logística.</p></div><div class="grid" style="margin-top:12px"><div class="item"><span>Productos</span><b>'+sellerStats.products+'</b></div><div class="item"><span>Inventario</span><b>'+sellerStats.stock+'</b></div><div class="item"><span>Comisión</span><b>10%</b></div><div class="item"><span>Plan</span><b>'+esc(sellerLogistics?.plan||"basic")+'</b></div></div><div class="section"><h2>Inventario</h2><button class="btn primary" onclick="newProduct()">+ Producto</button></div><div class="list">'+(sellerProducts.length?sellerProducts.map(p=>'<div class="item"><span>📦</span><div class="grow"><b>'+esc(p.name)+'</b><div class="small">'+money(p.price)+' · Stock '+p.stock+' · '+esc(p.status)+'</div></div></div>').join(""):'<div class="card"><div class="small">No hay productos todavía.</div></div>')+'</div><div class="section"><h2>Pedidos</h2></div><div class="list">'+(sellerOrders.length?sellerOrders.map(x=>'<button class="item" style="width:100%;text-align:left" onclick="sellerPrepare(&quot;'+x.order_id+'&quot;)"><span>📦</span><div class="grow"><b>#'+esc(x.orders?.order_number||x.order_id.slice(0,8))+'</b><div class="small">'+esc(x.orders?.status||"")+' · '+esc(x.orders?.delivery_provider||"")+'</div></div><b>'+money(x.total_price)+'</b></button>').join(""):'<div class="card"><div class="small">No hay pedidos para esta tienda.</div></div>')+'</div><div class="section"><h2>Logística</h2></div><div class="card"><div class="small">Plan: '+esc(sellerLogistics?.plan||"basic")+' · Recogida: '+esc(sellerLogistics?.package_pickup_mode||"seller")+'</div><div class="small" style="margin-top:5px">Premium con almacenamiento inicia desde almacén VaniDaxi.</div></div></div>'+nav()}async function sellerPrepare(orderId){if(A.demo){alert("Disponible en conexión real.");return}try{const address={city:"Mazatlán",state:"Sinaloa",country:"México"};const r=await A.rpc("create_seller_package_request",{p_order_id:orderId,p_pickup_address:address,p_package_count:1,p_ready_at:new Date().toISOString()});await loadRealData();page="seller";render();alert("Solicitud logística creada: "+(r?.id||orderId))}catch(e){alert(e.message)}}function newProduct(){modal('<button class="close" onclick="closeModal()">✕</button><h2>Nuevo producto</h2><label class="label">Nombre</label><input id="pn" class="input"><label class="label">Categoría</label><select id="pc" class="input">'+cats.map(c=>'<option>'+esc(c)+'</option>').join("")+'</select><label class="label">Precio</label><input id="pp" class="input" type="number" min="0" step="0.01"><label class="label">Stock</label><input id="ps" class="input" type="number" min="0"><label class="label">Descripción</label><input id="pd" class="input"><button class="btn primary full" style="margin-top:12px" onclick="createProduct()">Guardar</button>')}async function createProduct(){try{if(A.demo){closeModal();alert("Función disponible en conexión real.");return}const cat=await A.table.list("categories","id","name=eq."+encodeURIComponent(document.getElementById("pc").value),"limit=1");await A.rpc("create_seller_product",{p_category_id:cat[0]?.id||null,p_name:document.getElementById("pn").value.trim(),p_description:document.getElementById("pd").value.trim(),p_price:Number(document.getElementById("pp").value),p_stock:Number(document.getElementById("ps").value||0)});await loadRealData();closeModal();page="seller";render();alert("Producto creado y enviado a revisión.")}catch(e){alert(e.message)}}function go(p){page=p;render()}async function start(){if(!A.demo){const u=await A.auth.me().catch(()=>null);if(u){user=u;await loadRealData();const q=new URLSearchParams(location.search);const payment=q.get("payment");const order=q.get("order");if(payment){history.replaceState({},document.title,location.pathname);alert(payment==="success"?"Pago confirmado. El pedido quedó registrado.":payment==="cancelled"?"El pago fue cancelado.":"El pago quedó pendiente de confirmación.");if(order){page="orders";render();return}}}}render()}function render(){if(!user)return auth();app.innerHTML=page=="home"?home():page=="cats"?catsPage():page=="cart"?cartPage():page=="orders"?ordersPage():page=="seller"?seller():account()}start().catch(()=>render());</script></body></html>
