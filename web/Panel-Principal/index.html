<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2346"><title>VaniDaxi · Panel</title>
<style>
:root{--navy:#0b2346;--navy2:#153d74;--blue:#2f6cf6;--turq:#28c6d0;--bg:#eef2f7;--card:#fff;--ink:#152542;--muted:#68758a;--line:#dfe5ec;--green:#16866a;--red:#c53d50;--amber:#ac6a00;--shadow:0 10px 28px rgba(16,32,58,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.login{max-width:430px;margin:9vh auto;padding:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:23px}.v{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#7868ff,#36c8d5);color:#fff;display:grid;place-items:center;font-weight:1000;font-size:23px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:17px}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;outline:none}.label{display:block;font-size:11px;font-weight:900;margin:10px 0 6px}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900}.primary{background:var(--navy);color:#fff}.secondary{background:#edf2f7;color:var(--navy)}.danger{background:#fff0f2;color:var(--red)}.full{width:100%}.app{display:none;min-height:100vh}.sidebar{width:245px;background:linear-gradient(180deg,#102348,#0d1e3b);color:#dce5f6;position:fixed;left:0;top:0;bottom:0;padding:16px 13px}.sidebrand{display:flex;align-items:center;gap:10px;padding:6px 9px 22px}.sidebrand .v{width:39px;height:39px;font-size:20px}.sidebrand b{color:#fff;font-size:18px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c6d1e4;text-align:left;padding:10px 12px;border-radius:10px;font-weight:700}.nav button.active{background:#fff;color:var(--navy)}.sidefoot{position:absolute;bottom:15px;left:15px;right:15px;border-top:1px solid #ffffff16;padding-top:13px;font-size:10px;color:#aab6ca}.main{margin-left:245px;padding:22px 25px;min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.title small{color:var(--muted)}.title h1{font-size:28px;margin:3px 0}.actions{display:flex;gap:8px}.mobileNav{display:none}.page{display:none}.page.active{display:block}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.kpi .lab{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}.num{font-size:29px;font-weight:900;margin:6px 0}.foot{font-size:10px;color:var(--green)}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.section h2{font-size:16px;margin:0}.table{overflow:auto}.empty{text-align:center;color:var(--muted);padding:35px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#f0f3f7;color:#667286}.green{background:#e8f7f2;color:#0d775a}.red{background:#fff0f2;color:var(--red)}.orange{background:#fff4df;color:var(--amber)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:9px;text-transform:uppercase;color:var(--muted);background:#fafbfc}.toast{position:fixed;right:20px;bottom:20px;background:#132846;color:#fff;padding:11px 14px;border-radius:11px;display:none;z-index:99}.toast.show{display:block}.modal{position:fixed;inset:0;background:#0b1d3b88;display:none;align-items:center;justify-content:center;padding:20px;z-index:90}.modal.show{display:flex}.sheet{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:17px;padding:19px}.close{float:right;border:0;background:#f2f4f7;width:35px;height:35px;border-radius:10px}
@media(max-width:900px){.sidebar{display:none}.main{margin:0;padding:16px 14px 80px}.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.mobileNav{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);z-index:50}.mobileNav button{border:0;background:none;padding:9px 4px;font-size:10px}.mobileNav button.active{color:var(--blue);font-weight:900}}
</style></head><body>
<div id="login" class="login"></div>
<div id="app" class="app"><aside class="sidebar"><div class="sidebrand"><span class="v">V</span><b>VaniDaxi</b></div><div id="sideNav" class="nav"></div><div class="sidefoot">Panel administrativo conectado a datos reales de la plataforma.</div></aside><main class="main"><div class="top"><div class="title"><small id="sub">Centro de control</small><h1 id="ttl">Panel general</h1></div><div class="actions"><button class="btn secondary" onclick="refresh()">Actualizar</button><button class="btn secondary" onclick="logout()">Salir</button></div></div><div id="pages"></div></main></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<script src="app-config.js"></script><script src="supabase-client.js"></script>
<script>
const C=window.VaniCore,loginEl=document.getElementById("login"),app=document.getElementById("app"),pages=document.getElementById("pages"),sideNav=document.getElementById("sideNav"),toastEl=document.getElementById("toast");
let user=null,profile=null,page="dashboard",snapshot={},users=[],sellers=[],couriers=[],orders=[],tickets=[],commissions=[],pendingProducts=[],pendingStores=[],premiumRequests=[];
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2200)}
function money(n){return "$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2})}
function openModal(h){$("#sheet").innerHTML=h;$("#modal").classList.add("show")}function closeModal(){$("#modal").classList.remove("show")}$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()})
function loginView(){loginEl.style.display="block";app.style.display="none";loginEl.innerHTML="<div class='brand'><span class='v'>V</span>VaniDaxi</div><div class='card' style='margin-top:15px'><h2>Panel administrativo</h2><p class='muted' style='font-size:12px'>Acceso exclusivo para cuentas con permisos administrativos.</p><label class='label'>Correo</label><input id='le' class='input' type='email'><label class='label'>Contraseña</label><input id='lp' class='input' type='password'><button class='btn primary full' style='margin-top:14px' onclick='login()'>Entrar</button></div>"}
async function login(){try{await C.signIn($("#le").value.trim(),$("#lp").value);await boot()}catch(e){toast(e.message||"No se pudo iniciar sesión")}}
async function boot(){user=await C.me();profile=user?await C.profile():null;if(!user){loginView();return}try{const ok=await C.rpc("is_owner_admin",{});if(ok!==true)throw Error("Esta cuenta no tiene permisos de propietario administrador.");}catch(e){C.signOut();loginView();toast(e.message||"Acceso denegado");return}loginEl.style.display="none";app.style.display="block";buildNav();await refresh()}
function buildNav(){const items=[["dashboard","⌂","Panel general"],["users","👥","Usuarios"],["sellers","🏪","Vendedores"],["couriers","🚴","Repartidores"],["orders","📦","Pedidos"],["finance","💰","Finanzas"],["support","💬","Atención"],["settings","⚙","Configuración"]];sideNav.innerHTML=items.map(x=>"<button data-p='"+x[0]+"' onclick=\"go('"+x[0]+"')\">"+x[1]+" &nbsp;"+x[2]+"</button>").join("");document.querySelectorAll(".mobileNav button").forEach(b=>b.remove());document.body.insertAdjacentHTML("beforeend","<div class='mobileNav'>"+items.slice(0,5).map(x=>"<button data-p='"+x[0]+"' onclick=\"go('"+x[0]+"')\">"+x[1]+"<br>"+x[2]+"</button>").join("")+"</div>");}
async function refresh(){try{snapshot=await C.rpc("get_owner_dashboard_snapshot",{});users=await C.table.list("profiles","id,full_name,username,phone,role,is_active,created_at","{}" in {}?{}:{}, "order=created_at.desc").catch(()=>[]);sellers=await C.table.list("seller_stores","id,owner_id,store_name,status,created_at","{}" in {}?{}:{}, "order=created_at.desc").catch(()=>[]);couriers=await C.table.list("courier_profiles","user_id,status,full_name,phone,vehicle_type,rating,completed_deliveries,availability,created_at","{}" in {}?{}:{}, "order=created_at.desc").catch(()=>[]);premiumRequests=await C.rpc("list_owner_premium_requests",{}).catch(()=>[]);orders=await C.table.list("orders","id,order_number,user_id,status,total,delivery_status,delivery_tracking,logistics_mode,package_pickup_mode,created_at","{}" in {}?{}:{}, "order=created_at.desc").catch(()=>[]);tickets=await C.table.list("support_tickets","id,user_id,email,category,subject,status,priority,created_at,resolution_status,order_id,courier_id","{}" in {}?{}:{}, "order=created_at.desc").catch(()=>[]);commissions=await C.table.list("platform_commissions","id,order_id,seller_id,gross_amount,commission_rate,commission_amount,seller_amount,status,created_at","{}" in {}?{}:{}, "order=created_at.desc").catch(()=>[]);pendingProducts=await C.table.list("products","id,name,price,stock,status,seller_id,created_at","{}" in {}?{}:{}, "status=in.(pending,draft)&order=created_at.asc").catch(()=>[]);pendingStores=await C.table.list("seller_stores","id,store_name,status,owner_id,created_at","{}" in {}?{}:{}, "status=eq.pending&order=created_at.asc").catch(()=>[]);render();}catch(e){toast(e.message||"No se pudieron cargar los datos")}}
function navActive(){document.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("active",x.dataset.p===page));$("#ttl").textContent=({dashboard:"Panel general",users:"Usuarios",sellers:"Vendedores",couriers:"Repartidores",orders:"Pedidos y entregas",finance:"Finanzas",support:"Centro de atención",settings:"Configuración"})[page]||"VaniDaxi";$("#sub").textContent=({dashboard:"Centro de control",users:"Compradores y cuentas",sellers:"Tiendas y estados",couriers:"Operación conectada con VaniReparte",orders:"Seguimiento operativo",finance:"Comisiones y liquidaciones",support:"Tickets e incidencias",settings:"Seguridad del panel"})[page]||"Centro de control"}
function go(p){page=p;render();window.scrollTo({top:0})}
function moderation(){return "<div class='section'><h2>Tiendas pendientes</h2><span class='badge orange'>"+pendingStores.length+"</span></div><div class='list'>"+(pendingStores.length?pendingStores.map(s=>"<div class='card'><div class='row'><div class='grow'><b>"+esc(s.store_name)+"</b><div class='muted' style='font-size:11px'>Pendiente de aprobación</div></div><button class='btn primary' onclick=\"moderateStore('"+s.id+"','approved')\">Aprobar</button><button class='btn danger' onclick=\"moderateStore('"+s.id+"','rejected')\">Rechazar</button></div></div>").join(""):"<div class='card empty'>No hay tiendas pendientes.</div>")+"</div><div class='section'><h2>Productos pendientes</h2><span class='badge orange'>"+pendingProducts.length+"</span></div><div class='card table'><table><thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody>"+(pendingProducts.length?pendingProducts.map(p=>"<tr><td>"+esc(p.name)+"</td><td>"+money(p.price)+"</td><td>"+Number(p.stock||0)+"</td><td>"+esc(p.status)+"</td><td><button class='btn primary' onclick=\"moderateProduct('"+p.id+"','approved')\">Aprobar</button> <button class='btn danger' onclick=\"moderateProduct('"+p.id+"','rejected')\">Rechazar</button></td></tr>").join(""):"<tr><td colspan='5'>No hay productos pendientes.</td></tr>")+"</tbody></table></div>"}
async function moderateProduct(id,status){try{let reason=null;if(status==="rejected"){reason=prompt("Motivo del rechazo:");if(!reason)return}await C.rpc("moderate_product",{p_product_id:id,p_status:status,p_reason:reason});await refresh();toast("Producto actualizado")}catch(e){toast(e.message||"No se pudo actualizar")}}
async function moderateStore(id,status){try{await C.rpc("moderate_store",{p_store_id:id,p_status:status});await refresh();toast("Tienda actualizada")}catch(e){toast(e.message||"No se pudo actualizar")}}
function dashboard(){return "<section class='page active'><div class='grid4'><div class='card kpi'><div class='lab'>Usuarios</div><div class='num'>"+Number(snapshot.users||0)+"</div><div class='foot'>Datos reales</div></div><div class='card kpi'><div class='lab'>Vendedores</div><div class='num'>"+Number(snapshot.sellers||0)+"</div><div class='foot'>Datos reales</div></div><div class='card kpi'><div class='lab'>Repartidores</div><div class='num'>"+Number(snapshot.couriers||0)+"</div><div class='foot'>Datos reales</div></div><div class='card kpi'><div class='lab'>Pedidos</div><div class='num'>"+Number(snapshot.orders||0)+"</div><div class='foot'>Datos reales</div></div></div><div class='section'><h2>Operación</h2></div><div class='grid3'><div class='card'><div class='lab'>Tickets abiertos</div><div class='num'>"+Number(snapshot.open_support||0)+"</div></div><div class='card'><div class='lab'>Solicitudes Premium</div><div class='num'>"+Number(snapshot.premium_pending||0)+"</div></div><div class='card'><div class='lab'>Rutas activas</div><div class='num'>"+Number(snapshot.routes_active||0)+"</div></div></div><div class='section'><h2>Estado</h2></div><div class='card'><p class='muted' style='font-size:12px;margin:0'>El panel muestra únicamente información existente en Supabase. Las secciones vacías se mantienen en cero y no se inventan nombres, ventas o pedidos.</p></div>"+moderation()+"</section>"}
function usersPage(){return "<section class='page active'><div class='card table'><table><thead><tr><th>Nombre</th><th>Rol</th><th>Activo</th><th>Alta</th></tr></thead><tbody>"+(users.length?users.map(u=>"<tr><td>"+esc(u.full_name||"Sin nombre")+"</td><td>"+esc(u.role)+"</td><td>"+(u.is_active?"Sí":"No")+"</td><td>"+new Date(u.created_at).toLocaleDateString("es-MX")+"</td></tr>").join(""):"<tr><td colspan='4'>Sin usuarios registrados.</td></tr>")+"</tbody></table></div></section>"}
function sellersPage(){return "<section class='page active'><div class='card table'><table><thead><tr><th>Tienda</th><th>Estado</th><th>Creada</th></tr></thead><tbody>"+(sellers.length?sellers.map(s=>"<tr><td>"+esc(s.store_name)+"</td><td><span class='badge "+(s.status==="approved"?"green":s.status==="rejected"?"red":"orange")+"'>"+esc(s.status)+"</span></td><td>"+new Date(s.created_at).toLocaleDateString("es-MX")+"</td></tr>").join(""):"<tr><td colspan='3'>No hay vendedores registrados.</td></tr>")+"</tbody></table></div></section>"}
async function setCourierStatus(id,status){try{await C.rpc("admin_set_courier_status",{p_courier_id:id,p_status:status});await refresh();toast("Estado del repartidor actualizado")}catch(e){toast(e.message||"No se pudo actualizar")}}
async function approvePremium(sellerId,price){try{await C.rpc("approve_seller_premium",{p_seller_id:sellerId,p_monthly_price:Number(price||0)});await refresh();toast("Premium aprobado")}catch(e){toast(e.message||"No se pudo aprobar Premium")}}
function couriersPage(){return "<section class='page active'><div class='card table'><table><thead><tr><th>Repartidor</th><th>Estado</th><th>Disponibilidad</th><th>Entregas</th><th>Calif.</th><th>Acción</th></tr></thead><tbody>"+(couriers.length?couriers.map(c=>"<tr><td>"+esc(c.full_name||"Sin nombre")+"</td><td><span class='badge "+(c.status==="active"?"green":c.status==="suspended"?"red":"orange")+"'>"+esc(c.status)+"</span></td><td>"+(c.availability?"Sí":"No")+"</td><td>"+Number(c.completed_deliveries||0)+"</td><td>"+(c.rating?Number(c.rating).toFixed(1):"—")+"</td><td>"+(c.status==="active"?"<button class='btn danger' onclick=\"setCourierStatus('"+c.user_id+"','suspended')\">Suspender</button>":"<button class='btn primary' onclick=\"setCourierStatus('"+c.user_id+"','active')\">Activar</button>")+"</td></tr>").join(""):"<tr><td colspan='6'>No hay repartidores registrados.</td></tr>")+"</tbody></table></div><div class='section'><h2>Solicitudes Premium</h2></div><div class='card table'><table><thead><tr><th>Tienda</th><th>Estado</th><th>Precio mensual</th><th>Solicitada</th><th></th></tr></thead><tbody>"+(premiumRequests.length?premiumRequests.map(p=>"<tr><td>"+esc(p.store_name||"")+"</td><td><span class='badge orange'>"+esc(p.status)+"</span></td><td>"+money(p.monthly_price)+"</td><td>"+(p.requested_at?new Date(p.requested_at).toLocaleDateString("es-MX"):"—")+"</td><td><button class='btn primary' onclick=\"approvePremium('"+p.seller_id+"','"+Number(p.monthly_price||0)+"')\">Aprobar</button></td></tr>").join(""):"<tr><td colspan='5'>No hay solicitudes Premium pendientes.</td></tr>")+"</tbody></table></div></section>"}
function ordersPage(){return "<section class='page active'><div class='card table'><table><thead><tr><th>Pedido</th><th>Estado</th><th>Entrega</th><th>Total</th><th>Fecha</th><th></th></tr></thead><tbody>"+(orders.length?orders.map(o=>"<tr><td>"+esc(o.order_number)+"</td><td>"+esc(o.status)+"</td><td>"+esc(o.delivery_status||"—")+"</td><td>"+money(o.total)+"</td><td>"+new Date(o.created_at).toLocaleDateString("es-MX")+"</td><td><button class='btn secondary' onclick=\"openOrder('"+o.id+"')\">Ver</button></td></tr>").join(""):"<tr><td colspan='6'>No hay pedidos registrados.</td></tr>")+"</tbody></table></div></section>"}
function financePage(){const gross=commissions.reduce((a,x)=>a+Number(x.gross_amount||0),0),comm=commissions.reduce((a,x)=>a+Number(x.commission_amount||0),0);return "<section class='page active'><div class='grid3'><div class='card'><div class='lab'>Ventas con comisión</div><div class='num'>"+money(gross)+"</div></div><div class='card'><div class='lab'>Comisión VaniDaxi</div><div class='num'>"+money(comm)+"</div></div><div class='card'><div class='lab'>Registros</div><div class='num'>"+commissions.length+"</div></div></div><div class='section'><h2>Movimientos reales</h2></div><div class='card table'><table><thead><tr><th>Pedido</th><th>Bruto</th><th>Comisión</th><th>Vendedor</th><th>Estado</th></tr></thead><tbody>"+(commissions.length?commissions.map(c=>"<tr><td>"+esc(c.order_id).slice(0,8)+"</td><td>"+money(c.gross_amount)+"</td><td>"+money(c.commission_amount)+"</td><td>"+esc(c.seller_id).slice(0,8)+"</td><td>"+esc(c.status)+"</td></tr>").join(""):"<tr><td colspan='5'>No hay movimientos financieros registrados.</td></tr>")+"</tbody></table></div></section>"}
function supportPage(){return "<section class='page active'><div class='card table'><table><thead><tr><th>Asunto</th><th>Categoría</th><th>Estado</th><th>Prioridad</th><th>Fecha</th></tr></thead><tbody>"+(tickets.length?tickets.map(t=>"<tr><td>"+esc(t.subject||"Sin asunto")+"</td><td>"+esc(t.category||"—")+"</td><td>"+esc(t.status||"—")+"</td><td>"+esc(t.priority||"—")+"</td><td>"+new Date(t.created_at).toLocaleDateString("es-MX")+"</td></tr>").join(""):"<tr><td colspan='5'>No hay tickets registrados.</td></tr>")+"</tbody></table></div></section>"}
function settingsPage(){return "<section class='page active'><div class='grid2'><div class='card'><h3 style='margin-top:0'>Seguridad</h3><p class='muted' style='font-size:12px'>El acceso administrativo depende de los permisos de Supabase y de la función de propietario administrador.</p></div><div class='card'><h3 style='margin-top:0'>Datos</h3><p class='muted' style='font-size:12px'>Este panel no genera datos de demostración. Los indicadores vienen de las tablas y RPC reales.</p></div></div></section>"}
function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;openModal("<button class='close' onclick='closeModal()'>✕</button><h2>"+esc(o.order_number)+"</h2><p><b>Total:</b> "+money(o.total)+"</p><p><b>Estado:</b> "+esc(o.status)+"</p><p><b>Entrega:</b> "+esc(o.delivery_status||"—")+"</p><p><b>Tracking:</b> "+esc(o.delivery_tracking||"—")+"</p><label class='label'>Nuevo estado de entrega</label><select id='od_status' class='input'><option>preparing</option><option>ready_for_pickup</option><option>picked_up</option><option>in_transit</option><option>out_for_delivery</option><option>delivered</option><option>exception</option></select><label class='label'>Tracking</label><input id='od_tracking' class='input' value='"+esc(o.delivery_tracking||"")+"'><label class='label'>Notas</label><textarea id='od_notes' class='input' rows='3'></textarea><button class='btn primary full' style='margin-top:13px' onclick=\"updateDelivery('"+o.id+"')\">Guardar</button>")}
async function updateDelivery(id){try{await C.rpc("update_order_delivery",{p_order_id:id,p_status:$("#od_status").value,p_tracking:$("#od_tracking").value.trim()||null,p_notes:$("#od_notes").value.trim()||null});closeModal();await refresh();toast("Estado actualizado")}catch(e){toast(e.message||"No se pudo actualizar")}}
function render(){pages.innerHTML=page==="dashboard"?dashboard():page==="users"?usersPage():page==="sellers"?sellersPage():page==="couriers"?couriersPage():page==="orders"?ordersPage():page==="finance"?financePage():page==="support"?supportPage():settingsPage();navActive()}
async function logout(){C.signOut();user=null;profile=null;loginView()}
(async()=>{try{await boot()}catch(e){C.signOut();loginView()}})();
</script></body></html>
