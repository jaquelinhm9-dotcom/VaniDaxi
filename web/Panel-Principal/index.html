<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Principal VaniDaxi</title><style>body{margin:0;font-family:system-ui;background:#f4f3f7;color:#211b28}.layout{display:flex;min-height:100vh}.side{width:235px;background:#120d1d;color:#fff;padding:18px}.side a{display:block;color:#d6cadc;text-decoration:none;padding:10px;border-radius:10px;margin:3px 0}.side a:hover{background:#251737}.main{padding:25px;flex:1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e4dfe8;border-radius:17px;padding:15px}.metric{font-size:27px;font-weight:1000;margin-top:5px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#100a17,#311848)}.lc{width:min(420px,92%);background:#fff;padding:24px;border-radius:22px}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:5px 0 10px}.btn{border:0;border-radius:12px;padding:12px;font-weight:900}.primary{background:linear-gradient(90deg,#6b24ff,#c13dde);color:#fff}</style></head><body><div id="root"></div><script src="app-config.js"></script><script src="supabase-client.js"></script><script>const A=VaniAPI;let user=null,view="dashboard";function login(){if(A.demo){user={name:"Administrador"};render();return}A.auth.signIn(document.getElementById("e").value,document.getElementById("p").value).then(()=>A.auth.me()).then(u=>{user=u;render()}).catch(e=>alert(e.message))}function auth(){root.innerHTML='<div class="login"><div class="lc"><h1>Panel Principal VaniDaxi</h1><p>Acceso administrativo privado.</p><input id="e" class="input" placeholder="Correo"><input id="p" class="input" type="password" placeholder="Contraseña"><button class="btn primary" style="width:100%" onclick="login()">Entrar</button><button class="btn" style="width:100%;margin-top:8px" onclick="user={name:""Administrador demo""};render()">Ver demostración</button></div></div>'}function nav(){return '<aside class="side"><h2>VaniDaxi</h2><a href="#" onclick="view=\'dashboard\';render()">▣ Dashboard</a><a href="#" onclick="view=\'users\';render()">◉ Usuarios</a><a href="#" onclick="view=\'sellers\';render()">▤ Vendedores</a><a href="#" onclick="view=\'couriers\';render()">🚚 Repartidores</a><a href="#" onclick="view=\'orders\';render()">📦 Pedidos</a><a href="#" onclick="view=\'logistics\';render()">⌖ Logística</a><a href="#" onclick="view=\'finance\';render()">💳 Finanzas</a><a href="#" onclick="view=\'support\';render()">💬 Soporte</a><a href="#" onclick="view=\'audit\';render()">◌ Auditoría</a></aside>'}function dashboard(){return '<div class="main"><h1>Panel Principal</h1><p>Operación general de VaniDaxi</p><div class="grid">'+[['Usuarios',184],['Vendedores',32],['Repartidores',17],['Pedidos',246]].map(x=>'<div class="card"><div>'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join("")+'</div><div class="card" style="margin-top:16px"><h3>Actividad reciente</h3><p>Pedido #VD-1024 · En preparación</p><p>Ruta VR-208 · En camino</p><p>Tienda Bella · Activa</p></div></div>'}function module(){return '<div class="main"><h1>'+view+'</h1><div class="card"><p>Módulo de administración preparado. Se conectará a los datos reales cuando el backend y permisos estén configurados.</p></div></div>'}function render(){if(!user)return auth();root.innerHTML='<div class="layout">'+nav()+(view==="dashboard"?dashboard():module())+'</div>'}render();</script></body></html>
