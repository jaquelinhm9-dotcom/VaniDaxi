<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2346">
<title>VaniDaxi · Herramienta empresarial</title>
<style>
:root{--navy:#0b2346;--navy2:#153d74;--blue:#2f6cf6;--turq:#28c6d0;--bg:#eef2f7;--card:#fff;--ink:#152542;--muted:#68758a;--line:#dfe5ec;--green:#16866a;--red:#c53d50;--amber:#ac6a00;--shadow:0 10px 28px rgba(16,32,58,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.login{max-width:430px;margin:8vh auto;padding:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:23px}.v{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#7868ff,#36c8d5);color:#fff;display:grid;place-items:center;font-weight:1000;font-size:23px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:17px}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;outline:none}.label{display:block;font-size:11px;font-weight:900;margin:10px 0 6px}.muted{color:var(--muted)}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900}.primary{background:var(--navy);color:#fff}.secondary{background:#edf2f7;color:var(--navy)}.danger{background:#fff0f2;color:var(--red)}.success{background:#e8f7f2;color:#0d775a}.full{width:100%}.app{display:none;min-height:100vh}.sidebar{width:245px;background:linear-gradient(180deg,#102348,#0d1e3b);color:#dce5f6;position:fixed;left:0;top:0;bottom:0;padding:16px 13px;overflow:auto}.sidebrand{display:flex;align-items:center;gap:10px;padding:6px 9px 22px}.sidebrand .v{width:39px;height:39px;font-size:20px}.sidebrand b{color:#fff;font-size:18px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c6d1e4;text-align:left;padding:10px 12px;border-radius:10px;font-weight:700}.nav button.active{background:#fff;color:var(--navy)}.sidefoot{position:sticky;bottom:0;border-top:1px solid #ffffff16;padding-top:13px;font-size:10px;color:#aab6ca;margin-top:15px}.main{margin-left:245px;padding:22px 25px;min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.title small{color:var(--muted)}.title h1{font-size:28px;margin:3px 0}.actions{display:flex;gap:8px}.mobileNav{display:none}.page{display:none}.page.active{display:block}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.kpi .lab,.lab{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}.num{font-size:29px;font-weight:900;margin:6px 0}.foot{font-size:10px;color:var(--green)}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.section h2{font-size:16px;margin:0}.table{overflow:auto}.empty{text-align:center;color:var(--muted);padding:35px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#f0f3f7;color:#667286}.green{background:#e8f7f2;color:#0d775a}.red{background:#fff0f2;color:var(--red)}.orange{background:#fff4df;color:var(--amber)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:9px;text-transform:uppercase;color:var(--muted);background:#fafbfc}.toast{position:fixed;right:20px;bottom:20px;background:#132846;color:#fff;padding:11px 14px;border-radius:11px;display:none;z-index:99}.toast.show{display:block}.modal{position:fixed;inset:0;background:#0b1d3b88;display:none;align-items:center;justify-content:center;padding:20px;z-index:90}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:17px;padding:19px}.close{float:right;border:0;background:#f2f4f7;width:35px;height:35px;border-radius:10px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid var(--line);border-radius:10px;padding:9px}.dangerText{color:var(--red)}.okText{color:var(--green)}
@media(max-width:900px){.sidebar{display:none}.main{margin:0;padding:16px 14px 80px}.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.mobileNav{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);z-index:50}.mobileNav button{border:0;background:none;padding:9px 4px;font-size:10px}.mobileNav button.active{color:var(--blue);font-weight:900}.checks{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login"></div>
<div id="app" class="app">
<aside class="sidebar"><div class="sidebrand"><span class="v">V</span><b>VaniDaxi</b></div><div id="sideNav" class="nav"></div><div class="sidefoot">Herramienta empresarial privada. Las configuraciones maestras y el control de propietario están protegidos por permisos de empresa.</div></aside>
<main class="main">
<div class="top"><div class="title"><small id="sub">Centro de control empresarial</small><h1 id="ttl">Panel general</h1></div><div class="actions"><button class="btn secondary" onclick="refresh()">Actualizar</button><button class="btn secondary" onclick="logout()">Salir</button></div></div>
<div id="pages"></div>
</main>
</div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>
<script src="app-config.js"></script>
<script src="supabase-client.js"></script>
<script>
const C=window.VaniCore,loginEl=document.getElementById("login"),app=document.getElementById("app"),pages=document.getElementById("pages"),sideNav=document.getElementById("sideNav"),toastEl=document.getElementById("toast");
let user=null,profile=null,access={owner:false,employee:{}},page="dashboard",snapshot={},users=[],sellers=[],couriers=[],orders=[],tickets=[],commissions=[],pendingProducts=[],pendingStores=[],premiumRequests=[],departments=[],employees=[],accounts=[],balances=[],journal=[],audit=[];let syncTimer=null,syncBusy=false;
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2600)}
function money(n){return "$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2})}
function date(v){return v?new Date(v).toLocaleDateString("es-MX"):"—"}
function openModal(h){$("#sheet").innerHTML=h;$("#modal").classList.add("show")}function closeModal(){$("#modal").classList.remove("show")}$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()})
function owner(){return access.owner===true}
function perm(k){return owner()||access.employee&&access.employee.permissions&&access.employee.permissions[k]===true}
function loginView(){
 loginEl.style.display="block";app.style.display="none";
 loginEl.innerHTML="<div class='brand'><span class='v'>V</span>VaniDaxi</div><div class='card' style='margin-top:15px'><h2>Herramienta empresarial privada</h2><p class='muted' style='font-size:12px'>Acceso para la propietaria y empleados autorizados. Las configuraciones maestras son exclusivas de la propietaria.</p><label class='label'>Correo</label><input id='le' class='input' type='email' autocomplete='username'><label class='label'>Contraseña</label><input id='lp' class='input' type='password' autocomplete='current-password'><button class='btn primary full' style='margin-top:14px' onclick='login()'>Iniciar sesión</button><button class='btn secondary full' style='margin-top:9px' onclick='registerEmployeeAccess()'>Crear acceso de empleado</button><button class='link full' style='margin-top:10px' onclick='requestPasswordReset()'>¿Olvidaste tu contraseña?</button></div>";
}
function requestPasswordReset(){const email=prompt("Escribe el correo de tu acceso empresarial:");if(!email)return;C.recoverPassword(email.trim().toLowerCase(),location.origin+location.pathname).then(()=>toast("Revisa tu correo para restablecer la contraseña.")).catch(e=>toast(e.message||"No se pudo enviar el correo."))}
function passwordResetView(){loginEl.style.display="block";app.style.display="none";loginEl.innerHTML="<div class='brand'><span class='v'>V</span>VaniDaxi</div><div class='card' style='margin-top:15px'><h2>Nueva contraseña</h2><p class='muted' style='font-size:12px'>Elige una nueva contraseña para el acceso empresarial.</p><label class='label'>Nueva contraseña</label><input id='newpw' class='input' type='password' autocomplete='new-password'><label class='label'>Confirmar contraseña</label><input id='newpw2' class='input' type='password' autocomplete='new-password'><button class='btn primary full' style='margin-top:14px' onclick='finishPasswordReset()'>Guardar nueva contraseña</button></div>"}
async function finishPasswordReset(){const a=$("#newpw").value,b=$("#newpw2").value;if(a.length<8||a!==b){toast("Las contraseñas deben coincidir y tener al menos 8 caracteres.");return}try{await C.updatePassword(a);C.signOut();loginView();toast("Contraseña actualizada. Inicia sesión nuevamente.")}catch(e){toast(e.message||"No se pudo actualizar la contraseña.")}}

async function login(){try{await C.signIn($("#le").value.trim(),$("#lp").value);await boot()}catch(e){toast(e.message||"No se pudo iniciar sesión")}}
async function registerEmployeeAccess(){
 const email=prompt("Escribe el correo que la empresa registró para ti:");
 if(!email)return;
 const password=prompt("Crea una contraseña para tu acceso:");
 if(!password||password.length<8){toast("La contraseña debe tener al menos 8 caracteres");return}
 try{const d=await C.signUp(email.trim().toLowerCase(),password,{role:"employee"});if(d.access_token){await boot()}else{toast("Cuenta creada. Si Supabase pide confirmación de correo, confírmalo y después inicia sesión.")}}catch(e){toast(e.message||"No se pudo crear el acceso")}}
async function boot(){if(C.consumeRecovery()){passwordResetView();return}
 user=await C.me();profile=user?await C.profile():null;
 if(!user){loginView();return}
 try{
   await C.rpc("link_my_company_employee",{});
   access=await C.rpc("get_my_company_access",{});
   if(access.owner!==true && (!access.employee || access.employee.employment_status!=="active")) throw Error("Esta cuenta no tiene un acceso empresarial activo.");
 }catch(e){C.signOut();loginView();toast(e.message||"Acceso denegado");return}
 loginEl.style.display="none";app.style.display="block";buildNav();await refresh();startSync();
}
function startSync(){if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(async()=>{if(syncBusy||!user||document.hidden)return;syncBusy=true;try{if(!document.getElementById("modal").classList.contains("show"))await refresh()}catch(_){ }finally{syncBusy=false}},15000)}
function navItems(){
 const items=[
  ["dashboard","⌂","Panel general",true],
  ["users","👥","Usuarios","users"],
  ["sellers","🏪","Vendedores","operations"],
  ["couriers","🚴","Repartidores","operations"],
  ["orders","📦","Pedidos","operations"],
  ["finance","💰","Finanzas","accounting"],
  ["accounting","📚","Contabilidad","accounting"],
  ["hr","👔","Recursos humanos","hr"],
  ["support","💬","Atención","support"],
  ["audit","🛡","Auditoría","owner_only"],
  ["settings","⚙","Configuración","owner_only"]
 ];
 return items.filter(x=>x[3]===true||(x[3]==="owner_only"?owner():perm(x[3])));
}
function buildNav(){
 const items=navItems();
 sideNav.innerHTML=items.map(x=>"<button data-p='"+x[0]+"' onclick=\"go('"+x[0]+"')\">"+x[1]+" &nbsp;"+x[2]+"</button>").join("");
 document.querySelectorAll(".mobileNav").forEach(x=>x.remove());
 document.body.insertAdjacentHTML("beforeend","<div class='mobileNav'>"+items.slice(0,5).map(x=>"<button data-p='"+x[0]+"' onclick=\"go('"+x[0]+"')\">"+x[1]+"<br>"+x[2]+"</button>").join("")+"</div>");
}
async function refresh(){
 try{
  snapshot=await C.rpc("get_owner_dashboard_snapshot",{}).catch(()=>({}));
  if(perm("users"))users=await C.table.list("profiles","id,full_name,username,phone,role,is_active,created_at",{}, "order=created_at.desc").catch(()=>[]);
  if(perm("operations")) {
   sellers=await C.table.list("seller_stores","id,owner_id,store_name,status,created_at",{}, "order=created_at.desc").catch(()=>[]);
   couriers=await C.table.list("courier_profiles","user_id,status,full_name,phone,vehicle_type,rating,completed_deliveries,availability,created_at",{}, "order=created_at.desc").catch(()=>[]);
   orders=await C.table.list("orders","id,order_number,user_id,status,total,delivery_status,delivery_tracking,delivery_provider,delivery_custody,delivery_handoff_at,delivered_at,logistics_mode,package_pickup_mode,shipping_address,created_at",{}, "order=created_at.desc").catch(()=>[]);
   pendingProducts=await C.table.list("products","id,name,price,stock,status,seller_id,created_at",{}, "status=in.(pending,draft)&order=created_at.asc").catch(()=>[]);
   pendingStores=await C.table.list("seller_stores","id,store_name,status,owner_id,created_at",{}, "status=eq.pending&order=created_at.asc").catch(()=>[]);
   premiumRequests=await C.rpc("list_owner_premium_requests",{}).catch(()=>[]);
  }
  if(perm("support"))tickets=await C.table.list("support_tickets","id,user_id,email,category,subject,status,priority,created_at,resolution_status,order_id,courier_id",{}, "order=created_at.desc").catch(()=>[]);
  if(perm("accounting")){
   commissions=await C.table.list("platform_commissions","id,order_id,seller_id,gross_amount,commission_rate,commission_amount,seller_amount,status,created_at",{}, "order=created_at.desc").catch(()=>[]);
   accounts=await C.table.list("accounting_accounts","id,code,name,account_type,active",{}, "order=code.asc").catch(()=>[]);
   balances=await C.rpc("get_accounting_balances",{}).catch(()=>[]);
   journal=await C.table.list("accounting_journal_entries","id,entry_date,description,reference_type,reference_id,created_by,created_at",{}, "order=entry_date.desc,created_at.desc").catch(()=>[]);
  }
  if(perm("hr")){
   departments=await C.table.list("company_departments","id,name,description,active,created_at,updated_at",{}, "order=name.asc").catch(()=>[]);
   employees=await C.table.list("company_employees","id,user_id,email,full_name,department_id,job_title,employment_status,contract_type,salary_amount,salary_frequency,hire_date,termination_date,termination_reason,permissions,notes,created_at,updated_at",{}, "order=created_at.desc").catch(()=>[]);
  }
  if(owner()) audit=await C.table.list("company_audit_log","id,actor_user_id,action,table_name,record_id,changed_fields,created_at",{}, "order=created_at.desc&limit=100").catch(()=>[]);
  else audit=[];
  render();
 }catch(e){toast(e.message||"No se pudieron cargar los datos")}
}
function navActive(){
 document.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("active",x.dataset.p===page));
 const titles={dashboard:["Centro de control empresarial","Panel general"],users:["Personas y cuentas","Usuarios"],sellers:["Operación comercial","Vendedores"],couriers:["Logística","Repartidores"],orders:["Operación","Pedidos y entregas"],finance:["Finanzas","Finanzas"],accounting:["Contabilidad","Contabilidad general"],hr:["Personas","Recursos humanos"],support:["Atención","Centro de atención"],audit:["Seguridad y control","Auditoría"],settings:["Propiedad","Configuración empresarial"]};
 const t=titles[page]||titles.dashboard;$("#ttl").textContent=t[1];$("#sub").textContent=t[0];
}
function go(p){if(p!=="dashboard"&&!navItems().some(x=>x[0]===p)){toast("No tienes permiso para esta sección");return}page=p;render();window.scrollTo({top:0})}

function dashboard(){
 const shown=navItems().length-1;
 return "<section class='page active'><div class='grid4'><div class='card kpi'><div class='lab'>Usuarios</div><div class='num'>"+Number(snapshot.users||0)+"</div><div class='foot'>Datos reales</div></div><div class='card kpi'><div class='lab'>Vendedores</div><div class='num'>"+Number(snapshot.sellers||0)+"</div><div class='foot'>Datos reales</div></div><div class='card kpi'><div class='lab'>Repartidores</div><div class='num'>"+Number(snapshot.couriers||0)+"</div><div class='foot'>Datos reales</div></div><div class='card kpi'><div class='lab'>Pedidos</div><div class='num'>"+Number(snapshot.orders||0)+"</div><div class='foot'>Datos reales</div></div></div><div class='section'><h2>Empresa</h2><span class='badge'>"+(owner()?"Propietaria":"Empleado")+"</span></div><div class='grid3'><div class='card'><div class='lab'>Secciones habilitadas</div><div class='num'>"+shown+"</div></div><div class='card'><div class='lab'>Tickets abiertos</div><div class='num'>"+Number(snapshot.open_support||0)+"</div></div><div class='card'><div class='lab'>Rutas activas</div><div class='num'>"+Number(snapshot.routes_active||0)+"</div></div></div><div class='section'><h2>Control</h2></div><div class='card'><p style='margin:0;font-size:12px'>La herramienta empresarial centraliza operaciones, finanzas, contabilidad, recursos humanos, atención y configuraciones de VaniDaxi. La configuración maestra permanece restringida a la propietaria.</p></div>"+(perm("operations")?moderation():"")+"</section>";
}
function moderation(){
 return "<div class='section'><h2>Tiendas pendientes</h2><span class='badge orange'>"+pendingStores.length+"</span></div><div class='list'>"+(pendingStores.length?pendingStores.map(s=>"<div class='card'><div class='row'><div><b>"+esc(s.store_name)+"</b><div class='muted' style='font-size:11px'>Pendiente de aprobación</div></div><button class='btn primary' onclick=\"moderateStore('"+s.id+"','approved')\">Aprobar</button><button class='btn danger' onclick=\"moderateStore('"+s.id+"','rejected')\">Rechazar</button></div></div>").join(""):"<div class='card empty'>No hay tiendas pendientes.</div>")+"</div><div class='section'><h2>Productos pendientes</h2><span class='badge orange'>"+pendingProducts.length+"</span></div><div class='card table'><table><thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody>"+(pendingProducts.length?pendingProducts.map(p=>"<tr><td>"+esc(p.name)+"</td><td>"+money(p.price)+"</td><td>"+Number(p.stock||0)+"</td><td>"+esc(p.status)+"</td><td><button class='btn primary' onclick=\"moderateProduct('"+p.id+"','approved')\">Aprobar</button> <button class='btn danger' onclick=\"moderateProduct('"+p.id+"','rejected')\">Rechazar</button></td></tr>").join(""):"<tr><td colspan='5'>No hay productos pendientes.</td></tr>")+"</tbody></table></div>";
}
async function moderateProduct(id,status){try{let reason=null;if(status==="rejected"){reason=prompt("Motivo del rechazo:");if(!reason)return}await C.rpc("moderate_product",{p_product_id:id,p_status:status,p_reason:reason});await refresh();toast("Producto actualizado")}catch(e){toast(e.message||"No se pudo actualizar")}}
async function moderateStore(id,status){try{await C.rpc("moderate_store",{p_store_id:id,p_status:status});await refresh();toast("Tienda actualizada")}catch(e){toast(e.message||"No se pudo actualizar")}}

function usersPage(){return "<section class='page active'><div class='card table'><table><thead><tr><th>Nombre</th><th>Rol</th><th>Activo</th><th>Alta</th></tr></thead><tbody>"+(users.length?users.map(u=>"<tr><td>"+esc(u.full_name||"Sin nombre")+"</td><td>"+esc(u.role)+"</td><td>"+(u.is_active?"Sí":"No")+"</td><td>"+date(u.created_at)+"</td></tr>").join(""):"<tr><td colspan='4'>Sin usuarios registrados.</td></tr>")+"</tbody></table></div></section>"}
function sellersPage(){return "<section class='page active'><div class='card table'><table><thead><tr><th>Tienda</th><th>Estado</th><th>Creada</th></tr></thead><tbody>"+(sellers.length?sellers.map(s=>"<tr><td>"+esc(s.store_name)+"</td><td><span class='badge "+(s.status==="approved"?"green":s.status==="rejected"?"red":"orange")+"'>"+esc(s.status)+"</span></td><td>"+date(s.created_at)+"</td></tr>").join(""):"<tr><td colspan='3'>No hay vendedores registrados.</td></tr>")+"</tbody></table></div></section>"}
async function setCourierStatus(id,status){try{await C.rpc("admin_set_courier_status",{p_courier_id:id,p_status:status});await refresh();toast("Estado del repartidor actualizado")}catch(e){toast(e.message||"No se pudo actualizar")}}
async function approvePremium(sellerId,price){try{await C.rpc("approve_seller_premium",{p_seller_id:sellerId,p_monthly_price:Number(price||0)});await refresh();toast("Premium aprobado")}catch(e){toast(e.message||"No se pudo aprobar Premium")}}
function couriersPage(){return "<section class='page active'><div class='card table'><table><thead><tr><th>Repartidor</th><th>Estado</th><th>Disponibilidad</th><th>Entregas</th><th>Calif.</th><th>Acción</th></tr></thead><tbody>"+(couriers.length?couriers.map(c=>"<tr><td>"+esc(c.full_name||"Sin nombre")+"</td><td><span class='badge "+(c.status==="active"?"green":c.status==="suspended"?"red":"orange")+"'>"+esc(c.status)+"</span></td><td>"+(c.availability?"Sí":"No")+"</td><td>"+Number(c.completed_deliveries||0)+"</td><td>"+(c.rating?Number(c.rating).toFixed(1):"—")+"</td><td>"+(c.status==="active"? "<button class='btn danger' onclick=\"setCourierStatus('"+c.user_id+"','suspended')\">Suspender</button>":"<button class='btn primary' onclick=\"setCourierStatus('"+c.user_id+"','active')\">Activar</button>")+"</td></tr>").join(""):"<tr><td colspan='6'>No hay repartidores registrados.</td></tr>")+"</tbody></table></div><div class='section'><h2>Solicitudes Premium</h2></div><div class='card table'><table><thead><tr><th>Tienda</th><th>Estado</th><th>Precio mensual</th><th>Solicitada</th><th></th></tr></thead><tbody>"+(premiumRequests.length?premiumRequests.map(p=>"<tr><td>"+esc(p.store_name||"")+"</td><td><span class='badge orange'>"+esc(p.status)+"</span></td><td>"+money(p.monthly_price)+"</td><td>"+date(p.requested_at)+"</td><td><button class='btn primary' onclick=\"approvePremium('"+p.seller_id+"','"+Number(p.monthly_price||0)+"')\">Aprobar</button></td></tr>").join(""):"<tr><td colspan='5'>No hay solicitudes Premium pendientes.</td></tr>")+"</tbody></table></div></section>"}
function ordersPage(){return "<section class='page active'><div class='card table'><table><thead><tr><th>Pedido</th><th>Estado</th><th>Entrega</th><th>Total</th><th>Fecha</th><th></th></tr></thead><tbody>"+(orders.length?orders.map(o=>"<tr><td>"+esc(o.order_number)+"</td><td>"+esc(o.status)+"</td><td>"+esc(o.delivery_status||"—")+"</td><td>"+money(o.total)+"</td><td>"+date(o.created_at)+"</td><td><button class='btn secondary' onclick=\"openOrder('"+o.id+"')\">Ver</button></td></tr>").join(""):"<tr><td colspan='6'>No hay pedidos registrados.</td></tr>")+"</tbody></table></div></section>"}

function newJournalEntry(){
 const opts=accounts.filter(a=>a.active).map(a=>"<option value='"+a.id+"'>"+esc(a.code)+" · "+esc(a.name)+"</option>").join("");
 openModal("<button class='close' onclick='closeModal()'>✕</button><h2>Nuevo asiento contable</h2><p class='muted' style='font-size:12px'>El sistema exigirá que debe y haber queden exactamente cuadrados.</p><label class='label'>Fecha</label><input id='je_date' class='input' type='date' value='"+new Date().toISOString().slice(0,10)+"'><label class='label'>Descripción</label><input id='je_desc' class='input'><div class='grid2'><div><label class='label'>Cuenta deudora</label><select id='je_debit' class='input'>"+opts+"</select></div><div><label class='label'>Cuenta acreedora</label><select id='je_credit' class='input'>"+opts+"</select></div></div><label class='label'>Importe</label><input id='je_amount' class='input' type='number' min='0.01' step='0.01'><label class='label'>Referencia (opcional)</label><input id='je_ref' class='input' placeholder='Ej. pago, gasto, comisión'><button class='btn primary full' style='margin-top:13px' onclick='saveJournalEntry()'>Registrar asiento</button>");
}
async function saveJournalEntry(){
 try{
  const amount=Number($("#je_amount").value||0);if(!(amount>0))throw Error("Escribe un importe válido");
  if($("#je_debit").value===$("#je_credit").value)throw Error("Las cuentas deben ser diferentes");
  const lines=[{account_id:$("#je_debit").value,debit:amount,credit:0},{account_id:$("#je_credit").value,debit:0,credit:amount}];
  await C.rpc("post_accounting_entry",{p_entry_date:$("#je_date").value,p_description:$("#je_desc").value.trim(),p_lines:lines,p_reference_type:$("#je_ref").value.trim()||null});
  closeModal();await refresh();toast("Asiento registrado");
 }catch(e){toast(e.message||"No se pudo registrar el asiento")}
}

tus('"+e.id+"','"+(e.employment_status==="active"?"suspended":"active")+"')\">"+(e.employment_status==="active"?"Suspender":"Activar")+"</button> <button class='btn danger' onclick=\"terminateEmployee('"+e.id+"')\">Dar de baja</button>":"—")+"</td></tr>"}).join(""):"<tr><td colspan='7'>No hay empleados registrados.</td></tr>")+"</tbody></table></div><div class='card' style='margin-top:12px'><b>Control de acceso</b><p class='muted' style='font-size:12px;margin-bottom:0'>Los empleados deben registrar su acceso usando el mismo correo que la empresa registró. La cuenta queda vinculada automáticamente y su acceso se revoca al terminar o suspender la relación laboral.</p></div></section>";

 try{
  const perms={};["operations","accounting","hr","support","users","inventory","sales"].forEach(k=>perms[k]=$("#perm_"+k).checked);
  const id=await C.rpc("create_company_employee",{p_email:$("#e_email").value.trim().toLowerCase(),p_full_name:$("#e_name").value.trim(),p_department_id:$("#e_dept").value||null,p_job_title:$("#e_job").value.trim()||null,p_contract_type:$("#e_contract").value,p_salary_amount:Number($("#e_salary").value||0)||null,p_salary_frequency:$("#e_freq").value,p_permissions:perms,p_notes:$("#e_notes").value.trim()||null});
  closeModal();await refresh();toast("Empleado registrado");
 }catch(e){toast(e.message||"No se pudo registrar al empleado")}}

async function saveSettings(){
 try{await C.rpc("upsert_company_settings",{p_company_name:$("#s_company").value.trim()||null,p_legal_name:$("#s_legal").value.trim()||null,p_tax_id:$("#s_tax").value.trim()||null,p_support_email:$("#s_support").value.trim()||null,p_contact_email:$("#s_contact").value.trim()||null,p_hr_email:$("#s_hr").value.trim()||null,p_finance_email:$("#s_finance").value.trim()||null,p_operations_email:$("#s_ops").value.trim()||null,p_bank_name:$("#s_bank").value.trim()||null,p_bank_account_alias:$("#s_alias").value.trim()||null,p_bank_clabe:$("#s_clabe").value.trim()||null,p_accounting_notes:$("#s_notes").value.trim()||null});toast("Configuración guardada")}catch(e){toast(e.message||"No se pudo guardar")}}
function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const statuses=["preparing","ready_for_pickup","picked_up","in_transit","out_for_delivery","delivered","exception"];const opts=statuses.map(s=>"<option value=\""+s+"\" "+(o.delivery_status===s?"selected":"")+">"+s.replaceAll("_"," ")+"</option>").join("");const addr=o.shipping_address||{};const addressText=[addr.address_line1,addr.address_line2,addr.city,addr.state,addr.postal_code].filter(Boolean).join(", ");openModal("<button class=\"close\" onclick=\"closeModal()\">✕</button><h2>"+esc(o.order_number)+"</h2><div class=\"grid3\"><div class=\"card\"><div class=\"lab\">Total</div><div class=\"num\">"+money(o.total)+"</div></div><div class=\"card\"><div class=\"lab\">Entrega</div><div class=\"num\" style=\"font-size:17px\">"+esc(o.delivery_status||"—")+"</div></div><div class=\"card\"><div class=\"lab\">Custodia</div><div class=\"num\" style=\"font-size:17px\">"+esc(o.delivery_custody||"—")+"</div></div></div><div class=\"card\" style=\"margin-top:12px\"><b>Destino</b><p class=\"small muted\">"+esc(addressText||"Sin dirección registrada")+"</p><p class=\"small\"><b>Proveedor:</b> "+esc(o.delivery_provider||o.logistics_mode||"—")+"</p><p class=\"small\"><b>Tracking:</b> "+esc(o.delivery_tracking||"—")+"</p><p class=\"small\"><b>Recibido:</b> "+esc(o.delivered_at?date(o.delivered_at):"Pendiente")+"</p></div><label class=\"label\">Nuevo estado de entrega</label><select id=\"od_status\" class=\"input\">"+opts+"</select><label class=\"label\">Tracking</label><input id=\"od_tracking\" class=\"input\" value=\""+esc(o.delivery_tracking||"")+"\" placeholder=\"Guía, folio o referencia\"><label class=\"label\">Notas operativas</label><textarea id=\"od_notes\" class=\"input\" rows=\"3\" placeholder=\"Nota visible para operación\"></textarea><button class=\"btn primary full\" style=\"margin-top:13px\" onclick=\"updateDelivery('"+o.id+"')\">Guardar estado</button>")}
async function updateDelivery(id){try{await C.rpc("update_order_delivery",{p_order_id:id,p_status:$("#od_status").value,p_tracking:$("#od_tracking").value.trim()||null,p_notes:$("#od_notes").value.trim()||null});closeModal();await refresh();toast("Estado actualizado")}catch(e){toast(e.message||"No se pudo actualizar")}}
function render(){
 pages.innerHTML=page==="dashboard"?dashboard():page==="users"?usersPage():page==="sellers"?sellersPage():page==="couriers"?couriersPage():page==="orders"?ordersPage():page==="finance"?financePage():page==="accounting"?accountingPage():page==="hr"?hrPage():page==="support"?supportPage():page==="audit"?auditPage():settingsPage();
 navActive();
 if(page==="settings"&&owner())loadSettingsIntoForm();
}
async function logout(){C.signOut();user=null;profile=null;access={owner:false,employee:{}};loginView()}
(async()=>{try{await boot()}catch(e){C.signOut();loginView()}})();
</script>
</body></html>
