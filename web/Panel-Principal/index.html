<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Principal VaniDaxi</title><style>body{margin:0;font-family:system-ui;background:#f4f3f7;color:#211b28}.layout{display:flex;min-height:100vh}.side{width:235px;background:#120d1d;color:#fff;padding:18px;box-sizing:border-box}.side a{display:block;color:#d6cadc;text-decoration:none;padding:10px;border-radius:10px;margin:3px 0}.side a:hover,.side a.active{background:#251737}.main{padding:25px;flex:1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e4dfe8;border-radius:17px;padding:15px}.metric{font-size:27px;font-weight:1000;margin-top:5px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#100a17,#311848)}.lc{width:min(420px,92%);background:#fff;padding:24px;border-radius:22px}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:5px 0 10px;box-sizing:border-box}.btn{border:0;border-radius:12px;padding:12px;font-weight:900}.primary{background:linear-gradient(90deg,#6b24ff,#c13dde);color:#fff}.danger{background:#ffe8ed;color:#a91b38}.small{font-size:12px;color:#766e7d}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}@media(max-width:800px){.side{width:72px}.side h2,.side span{display:none}.main{padding:15px}.grid{grid-template-columns:1fr 1fr}}</style></head><body><div id="root"></div><script src="app-config.js"></script><script src="supabase-client.js"></script><script>
const A=VaniAPI;let user=null,profile=null,view="dashboard",snapshot=null,moduleData=[],moderationStores=[],moderationProducts=[],premiumRequests=[];function esc(v){return String(v??"").replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;"}[c]||c})}
async function login(){try{await A.auth.signIn(document.getElementById("e").value.trim(),document.getElementById("p").value);user=await A.auth.me();profile=await A.profile();if(profile?.role!=="admin")throw Error("Esta cuenta no tiene permisos administrativos.");await load();render()}catch(e){A.auth.signOut();alert(e.message)}}
async function load(){try{snapshot=await A.rpc("get_owner_dashboard_snapshot",{})}catch(e){snapshot=null}}
function auth(){root.innerHTML='<div class="login"><div class="lc"><h1>Panel Principal VaniDaxi</h1><p class="small">Acceso administrativo privado.</p><input id="e" class="input" type="email" placeholder="Correo"><input id="p" class="input" type="password" placeholder="Contraseña"><button class="btn primary" style="width:100%" onclick="login()">Entrar</button></div></div>'}
function nav(){const links=[["dashboard","▣","Dashboard"],["users","◉","Usuarios"],["sellers","▤","Vendedores"],["couriers","🚚","Repartidores"],["orders","📦","Pedidos"],["logistics","⌖","Logística"],["finance","💳","Finanzas"],["support","💬","Soporte"],["returns","↩️","Devoluciones"],["moderation","🛡️","Moderación"],["audit","◌","Auditoría"]];return '<aside class="side"><h2>VaniDaxi</h2>'+links.map(x=>'<a class="'+(view===x[0]?"active":"")+'" href="#" onclick="openModule(&quot;'+x[0]+'&quot;)">'+x[1]+' <span>'+x[2]+'</span></a>').join("")+'</aside>'}function dashboard(){const s=snapshot||{};const m=s.metrics||s;return '<div class="main"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Panel Principal</h1><div class="small">Operación general de VaniDaxi</div></div><button class="btn primary" onclick="load().then(render)">Actualizar</button></div><div class="grid">'+[["Usuarios",m.users_count??m.users??0],["Vendedores",m.sellers_count??m.sellers??0],["Repartidores",m.couriers_count??m.couriers??0],["Pedidos",m.orders_count??m.orders??0]].map(x=>'<div class="card"><div class="small">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join("")+'</div><div class="card"><h3>Estado de la operación</h3><p class="small">Datos obtenidos del backend administrativo cuando la cuenta tiene permisos.</p></div></div>'}
async function openModule(v){view=v;if(v==="dashboard"){await load();render();return}if(v==="moderation"){try{moderationStores=await A.table.list("seller_stores","id,store_name,status,created_at","status=eq.pending","order=created_at.desc","limit=100")||[];moderationProducts=await A.table.list("products","id,name,price,stock,status,created_at","status=eq.pending","order=created_at.desc","limit=100")||[];premiumRequests=await A.rpc("list_owner_premium_requests",{})||[]}catch(e){moderationStores=[];moderationProducts=[];alert(e.message)}render();return}try{const q={users:["profiles","id,full_name,role,is_active,created_at","order=created_at.desc","limit=100"],sellers:["seller_stores","id,owner_id,store_name,status,created_at","order=created_at.desc","limit=100"],couriers:["courier_profiles","user_id,full_name,status,verification_level,availability,rating,completed_deliveries,updated_at","order=updated_at.desc","limit=100"],orders:["orders","id,order_number,status,total,delivery_provider,delivery_status,created_at","order=created_at.desc","limit=100"],logistics:["package_requests","id,order_id,seller_id,status,pickup_mode,accepted_route_id,ready_at,created_at","order=created_at.desc","limit=100"],finance:["platform_commissions","order_id,order_item_id,gross_amount,commission_rate,commission_amount,seller_amount,status,created_at","order=created_at.desc","limit=100"],support:["support_tickets","id,subject,category,status,priority,incident_category,order_id,courier_id,created_at","order=created_at.desc","limit=100"],returns:["returns","id,order_id,order_item_id,user_id,seller_id,reason,details,status,refund_amount,requested_at,updated_at","order=created_at.desc","limit=100"],audit:["admin_activity_logs","id,admin_id,action,target_type,target_id,description,created_at","order=created_at.desc","limit=100"]}[v];moduleData=q?await A.table.list(q[0],q[1],q[2],q[3]):[];render()}catch(e){moduleData=[];alert(e.message);render()}}

async function supportThread(id){try{const rows=await A.rpc("admin_support_messages",{p_ticket_id:id});const arr=Array.isArray(rows)?rows:[];const body=arr.length?arr.map(m=>'<div class="item"><div class="grow"><b>'+(m.is_staff?"Soporte":"Usuario")+'</b><div>'+esc(m.message)+'</div><div class="small">'+esc(m.created_at)+'</div></div></div>').join(""):'<div class="small">Sin mensajes.</div>';root.insertAdjacentHTML("beforeend",'<div id="thread" style="position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20"><div class="lc" style="max-height:88vh;overflow:auto"><button class="btn" onclick="document.getElementById(&quot;thread&quot;).remove()">Cerrar</button><h2>Soporte</h2><div class="list">'+body+'</div><textarea id="am" class="input" rows="4" placeholder="Responder"></textarea><button class="btn primary" style="width:100%" onclick="sendAdminSupport(&quot;'+id+'&quot;)">Enviar respuesta</button></div></div>')}catch(e){alert(e.message)}}
async function sendAdminSupport(id){try{const m=document.getElementById("am").value.trim();if(!m)throw Error("Escribe una respuesta.");await A.rpc("admin_add_support_message",{p_ticket_id:id,p_message:m});await supportThread(id)}catch(e){alert(e.message)}}
async function manageTicket(id){try{const status=prompt("Estado: open, in_progress, pending o closed","in_progress");if(!status)return;const priority=prompt("Prioridad: low, normal, high o urgent","normal");const resolution=prompt("Resolución: open, resolved o closed","open");await A.rpc("update_support_ticket",{p_ticket_id:id,p_status:status,p_priority:priority,p_resolution_status:resolution});await openModule("support")}catch(e){alert(e.message)}}
async function manageReturn(id){try{const status=prompt("Estado: approved, rejected, received o cancelled","approved");if(!status)return;const notes=prompt("Notas","")||null;await A.rpc("resolve_return",{p_return_id:id,p_status:status,p_notes:notes,p_refund_amount:null});await openModule("returns")}catch(e){alert(e.message)}}

function moderationModule(){
  var html='<div class="main"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Moderación</h1><div class="small">'+moderationStores.length+' tiendas y '+moderationProducts.length+' productos pendientes</div></div><button class="btn primary" onclick="openModule(&quot;moderation&quot;)">Actualizar</button></div>';
  html+='<div class="card" style="margin-top:12px"><h3>Tiendas pendientes</h3>';
  if(moderationStores.length){
    moderationStores.forEach(function(s){
      html+='<div class="item"><div class="grow"><b>'+esc(s.store_name||"Sin nombre")+'</b><div class="small">'+esc(s.status||"pending")+'</div></div><button class="btn primary" onclick="moderateStore(&quot;'+s.id+'&quot;,&quot;approved&quot;)">Aprobar</button><button class="btn danger" style="margin-left:5px" onclick="moderateStore(&quot;'+s.id+'&quot;,&quot;rejected&quot;)">Rechazar</button></div>';
    });
  }else{
    html+='<div class="small">No hay tiendas pendientes.</div>';
  }
  html+='</div><div class="card" style="margin-top:12px"><h3>Productos pendientes</h3>';
  if(moderationProducts.length){
    moderationProducts.forEach(function(p){
      html+='<div class="item"><div class="grow"><b>'+esc(p.name||"Sin nombre")+'</b><div class="small">$'+Number(p.price||0).toFixed(2)+' · stock '+Number(p.stock||0)+'</div></div><button class="btn primary" onclick="moderateProduct(&quot;'+p.id+'&quot;,&quot;approved&quot;)">Aprobar</button><button class="btn danger" style="margin-left:5px" onclick="moderateProduct(&quot;'+p.id+'&quot;,&quot;rejected&quot;)">Rechazar</button></div>';
    });
  }else{
    html+='<div class="small">No hay productos pendientes.</div>';
  }
  html+='<div class="card" style="margin-top:12px"><h3>Solicitudes Premium</h3>';
  if(premiumRequests.length){
    premiumRequests.forEach(function(p){
      html+="<div class=\"item\"><div class=\"grow\"><b>"+esc(p.store_name||\"Tienda\")+"</b><div class=\"small\">$"+Number(p.monthly_price||0).toFixed(2)+" al mes · "+esc(p.requested_at||\"\")+"</div></div><button class=\"btn primary\" onclick=\"approvePremium('"+p.seller_id+"',"+Number(p.monthly_price||0)+")\">Aprobar</button></div>";
    });
  }else{
    html+='<div class="small">No hay solicitudes Premium pendientes.</div>';
  }
  return html+'</div></div>';
}
async function approvePremium(id,price){try{await A.rpc("approve_seller_premium",{p_seller_id:id,p_monthly_price:Number(price||0)});await openModule("moderation")}catch(e){alert(e.message)}}
async function moderateStore(id,status){
  try{await A.rpc("moderate_store",{p_store_id:id,p_status:status});await openModule("moderation")}catch(e){alert(e.message)}
}
async function moderateProduct(id,status){
  try{var reason=null;if(status==="rejected"){reason=prompt("Motivo del rechazo")||null;if(!reason)return}await A.rpc("moderate_product",{p_product_id:id,p_status:status,p_reason:reason});await openModule("moderation")}catch(e){alert(e.message)}
}
async function setCourierStatus(id,status){try{await A.rpc("admin_set_courier_status",{p_courier_id:id,p_status:status});await openModule("couriers")}catch(e){alert(e.message)}}
function module(){const titles={users:"Usuarios",sellers:"Vendedores",couriers:"Repartidores",orders:"Pedidos",logistics:"Logística",finance:"Pagos y conciliación",support:"Soporte",returns:"Devoluciones",audit:"Auditoría"};const cols={users:[["Nombre","full_name"],["Rol","role"],["Activo","is_active"],["Alta","created_at"]],sellers:[["Tienda","store_name"],["Estado","status"],["Creada","created_at"]],couriers:[["Nombre","full_name"],["Estado","status"],["Verificación","verification_level"],["Disponible","availability"],["Entregas","completed_deliveries"]],orders:[["Pedido","order_number"],["Estado","status"],["Total","total"],["Entrega","delivery_status"],["Fecha","created_at"]],logistics:[["Pedido","order_id"],["Estado","status"],["Modo","pickup_mode"],["Ruta","accepted_route_id"],["Creada","created_at"]],finance:[["Pedido","order_id"],["Bruto","gross_amount"],["Comisión","commission_amount"],["Vendedor","seller_amount"],["Estado","status"]],support:[["Asunto","subject"],["Categoría","category"],["Prioridad","priority"],["Estado","status"],["Fecha","created_at"]],returns:[["Pedido","order_id"],["Motivo","reason"],["Estado","status"],["Reembolso","refund_amount"],["Solicitada","requested_at"]],audit:[["Acción","action"],["Objetivo","target_type"],["Descripción","description"],["Fecha","created_at"]]};const c=cols[view]||[];const totalFinance=view==="finance"?moduleData.reduce((sum,row)=>sum+Number(row.commission_amount||0),0):0;const actions=view==="support"||view==="returns"||view==="couriers";return '<div class="main"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>'+titles[view]+'</h1><div class="small">'+moduleData.length+' registros recientes</div></div><button class="btn primary" onclick="openModule(&quot;'+view+'&quot;)">Actualizar</button></div>'+(view==="finance"?'<div class="card" style="margin-top:12px"><b>Comisiones registradas en la muestra</b><div class="metric">$'+totalFinance.toLocaleString("es-MX",{minimumFractionDigits:2})+'</div></div>':'')+'<div class="card" style="margin-top:12px;overflow:auto"><table class="table"><thead><tr>'+c.map(x=>'<th>'+x[0]+'</th>').join("")+(actions?'<th>Acción</th>':'')+'</tr></thead><tbody>'+moduleData.map(r=>'<tr>'+c.map(x=>'<td>'+esc(r[x[1]]==null?"—":r[x[1]])+'</td>').join("")+(view==="support"?'<td><button class="btn" onclick="supportThread(&quot;'+r.id+'&quot;)">Abrir</button><button class="btn primary" style="margin-left:4px" onclick="manageTicket(&quot;'+r.id+'&quot;)">Gestionar</button></td>':view==="returns"?'<td><button class="btn primary" onclick="manageReturn(&quot;'+r.id+'&quot;)">Gestionar</button></td>':view==="couriers"?'<td><button class="btn primary" onclick="setCourierStatus(&quot;'+r.user_id+'&quot;,&quot;active&quot;)">Activar</button><button class="btn danger" style="margin-left:4px" onclick="setCourierStatus(&quot;'+r.user_id+'&quot;,&quot;suspended&quot;)">Suspender</button></td>':'')+'</tr>').join("")+'</tbody></table></div></div>'}function render(){if(!user)return auth();root.innerHTML='<div class="layout">'+nav()+(view==="dashboard"?dashboard():view==="moderation"?moderationModule():module())+'</div>'}
A.auth.consumeAuthHash();A.auth.me().then(async u=>{if(u){user=u;profile=await A.profile();if(profile?.role==="admin"){await load();render();return}A.auth.signOut()}render()}).catch(()=>render());
</script></body></html>
