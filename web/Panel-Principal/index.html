<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Principal VaniDaxi</title><style>body{margin:0;font-family:system-ui;background:#f4f3f7;color:#211b28}.layout{display:flex;min-height:100vh}.side{width:235px;background:#120d1d;color:#fff;padding:18px;box-sizing:border-box}.side a{display:block;color:#d6cadc;text-decoration:none;padding:10px;border-radius:10px;margin:3px 0}.side a:hover,.side a.active{background:#251737}.main{padding:25px;flex:1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e4dfe8;border-radius:17px;padding:15px}.metric{font-size:27px;font-weight:1000;margin-top:5px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#100a17,#311848)}.lc{width:min(420px,92%);background:#fff;padding:24px;border-radius:22px}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:5px 0 10px;box-sizing:border-box}.btn{border:0;border-radius:12px;padding:12px;font-weight:900}.primary{background:linear-gradient(90deg,#6b24ff,#c13dde);color:#fff}.danger{background:#ffe8ed;color:#a91b38}.small{font-size:12px;color:#766e7d}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}@media(max-width:800px){.side{width:72px}.side h2,.side span{display:none}.main{padding:15px}.grid{grid-template-columns:1fr 1fr}}</style></head><body><div id="root"></div><script src="app-config.js"></script><script src="supabase-client.js"></script><script>
const A=VaniAPI;let user=null,profile=null,view="dashboard",snapshot=null,moduleData=[];function esc(v){return String(v??"").replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;"}[c]||c})}
async function login(){try{await A.auth.signIn(document.getElementById("e").value.trim(),document.getElementById("p").value);user=await A.auth.me();profile=await A.profile();if(profile?.role!=="admin")throw Error("Esta cuenta no tiene permisos administrativos.");await load();render()}catch(e){A.auth.signOut();alert(e.message)}}
async function load(){try{snapshot=await A.rpc("get_owner_dashboard_snapshot",{})}catch(e){snapshot=null}}
function auth(){root.innerHTML='<div class="login"><div class="lc"><h1>Panel Principal VaniDaxi</h1><p class="small">Acceso administrativo privado.</p><input id="e" class="input" type="email" placeholder="Correo"><input id="p" class="input" type="password" placeholder="Contraseña"><button class="btn primary" style="width:100%" onclick="login()">Entrar</button></div></div>'}
function nav(){const links=[["dashboard","▣","Dashboard"],["users","◉","Usuarios"],["sellers","▤","Vendedores"],["couriers","🚚","Repartidores"],["orders","📦","Pedidos"],["logistics","⌖","Logística"],["finance","💳","Finanzas"],["support","💬","Soporte"],["audit","◌","Auditoría"]];return '<aside class="side"><h2>VaniDaxi</h2>'+links.map(x=>'<a class="'+(view===x[0]?"active":"")+'" href="#" onclick="openModule(&quot;'+x[0]+'&quot;)">'+x[1]+' <span>'+x[2]+'</span></a>').join("")+'</aside>'}function dashboard(){const s=snapshot||{};const m=s.metrics||s;return '<div class="main"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Panel Principal</h1><div class="small">Operación general de VaniDaxi</div></div><button class="btn primary" onclick="load().then(render)">Actualizar</button></div><div class="grid">'+[["Usuarios",m.users_count??m.users??0],["Vendedores",m.sellers_count??m.sellers??0],["Repartidores",m.couriers_count??m.couriers??0],["Pedidos",m.orders_count??m.orders??0]].map(x=>'<div class="card"><div class="small">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join("")+'</div><div class="card"><h3>Estado de la operación</h3><p class="small">Datos obtenidos del backend administrativo cuando la cuenta tiene permisos.</p></div></div>'}
async function openModule(v){view=v;if(v==="dashboard"){await load();render();return}try{const q={users:["profiles","id,full_name,role,is_active,created_at","order=created_at.desc","limit=100"],sellers:["seller_stores","id,owner_id,store_name,status,created_at","order=created_at.desc","limit=100"],couriers:["courier_profiles","user_id,full_name,status,verification_level,availability,rating,completed_deliveries,updated_at","order=updated_at.desc","limit=100"],orders:["orders","id,order_number,status,total,delivery_provider,delivery_status,created_at","order=created_at.desc","limit=100"],logistics:["package_requests","id,order_id,seller_id,status,pickup_mode,accepted_route_id,ready_at,created_at","order=created_at.desc","limit=100"],finance:["platform_commissions","order_id,order_item_id,gross_amount,commission_rate,commission_amount,seller_amount,status,created_at","order=created_at.desc","limit=100"],support:["support_tickets","id,subject,category,status,priority,incident_category,order_id,courier_id,created_at","order=created_at.desc","limit=100"],audit:["admin_activity_logs","id,admin_id,action,target_type,target_id,description,created_at","order=created_at.desc","limit=100"]}[v];moduleData=q?await A.table.list(q[0],q[1],q[2],q[3]):[];render()}catch(e){moduleData=[];alert(e.message);render()}}
function module(){const titles={users:"Usuarios",sellers:"Vendedores",couriers:"Repartidores",orders:"Pedidos",logistics:"Logística",finance:"Pagos y conciliación",support:"Soporte",audit:"Auditoría"};const cols={users:[["Nombre","full_name"],["Rol","role"],["Activo","is_active"],["Alta","created_at"]],sellers:[["Tienda","store_name"],["Estado","status"],["Creada","created_at"]],couriers:[["Nombre","full_name"],["Estado","status"],["Verificación","verification_level"],["Disponible","availability"],["Entregas","completed_deliveries"]],orders:[["Pedido","order_number"],["Estado","status"],["Total","total"],["Entrega","delivery_status"],["Fecha","created_at"]],logistics:[["Pedido","order_id"],["Estado","status"],["Modo","pickup_mode"],["Ruta","accepted_route_id"],["Creada","created_at"]],finance:[["Pedido","order_id"],["Bruto","gross_amount"],["Comisión","commission_amount"],["Vendedor","seller_amount"],["Estado","status"]],support:[["Asunto","subject"],["Categoría","category"],["Prioridad","priority"],["Estado","status"],["Fecha","created_at"]],audit:[["Acción","action"],["Objetivo","target_type"],["Descripción","description"],["Fecha","created_at"]]};const c=cols[view]||[];const totalFinance=view==="finance"?moduleData.reduce((sum,row)=>sum+Number(row.commission_amount||0),0):0;return '<div class="main"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>'+titles[view]+'</h1><div class="small">'+moduleData.length+' registros recientes</div></div><button class="btn primary" onclick="openModule(&quot;'+view+'&quot;)">Actualizar</button></div>'+(view==="finance"?'<div class="card" style="margin-top:12px"><b>Comisiones registradas en la muestra</b><div class="metric">$'+totalFinance.toLocaleString("es-MX",{minimumFractionDigits:2})+'</div></div>':'')+'<div class="card" style="margin-top:12px;overflow:auto"><table class="table"><thead><tr>'+c.map(x=>'<th>'+x[0]+'</th>').join("")+'</tr></thead><tbody>'+moduleData.map(r=>'<tr>'+c.map(x=>'<td>'+esc(r[x[1]]==null?"—":r[x[1]])+'</td>').join("")+'</tr>').join("")+'</tbody></table></div></div>'}
function render(){if(!user)return auth();root.innerHTML='<div class="layout">'+nav()+(view==="dashboard"?dashboard():module())+'</div>'}
A.auth.consumeAuthHash();A.auth.me().then(async u=>{if(u){user=u;profile=await A.profile();if(profile?.role==="admin"){await load();render();return}A.auth.signOut()}render()}).catch(()=>render());
</script></body></html>
