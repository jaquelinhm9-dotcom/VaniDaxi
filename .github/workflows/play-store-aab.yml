name: Build VaniDaxi Play Store AABs

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build VaniDaxi public APKs 4.0"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: play-store-aab
  cancel-in-progress: true

jobs:
  build:
    if: \${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "4.0.0"
      APP_VERSION_CODE: "40"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          test -n "$SDKMANAGER"
          test -f "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare optional Play upload key
        id: signing
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          rm -rf build/keys
          mkdir -p build/keys
          if [ -n "${PLAY_UPLOAD_KEYSTORE_B64:-}" ] && [ -n "${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}" ] && [ -n "${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}" ] && [ -n "${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}" ]; then
            printf '%s' "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > build/keys/play-upload.jks
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No hay clave de subida configurada; se generarán AAB de validación sin firma."
          fi

      - name: Generate Android projects
        shell: bash
        env:
          PLAY_KEYSTORE_FILE: ${{ github.workspace }}/build/keys/play-upload.jks
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: bash scripts/build_android.sh

      - name: Build AABs
        shell: bash
        env:
          PLAY_KEYSTORE_FILE: ${{ github.workspace }}/build/keys/play-upload.jks
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist/play-store
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            echo "Construyendo AAB firmados con la clave de subida configurada."
          else
            echo "Construyendo AAB sin firma para validar el paquete antes de configurar la clave de subida."
          fi
          gradle --no-daemon --stacktrace -p build/android/VaniDaxi bundleRelease
          gradle --no-daemon --stacktrace -p build/android/VaniReparte bundleRelease
          cp build/android/VaniDaxi/app/build/outputs/bundle/release/app-release.aab dist/play-store/VaniDaxi-4.0.aab
          cp build/android/VaniReparte/app/build/outputs/bundle/release/app-release.aab dist/play-store/VaniReparte-4.0.aab
          ls -lh dist/play-store

      - name: Validate bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/play-store/*.aab; do
            echo "=== $f ==="
            unzip -p "$f" BUNDLE-METADATA/com.android.tools.build.gradle/app-metadata.properties 2>/dev/null || true
            unzip -l "$f" | head -20
          done

      - name: Upload Play Store AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-Play-Store-AABs-4.0
          path: dist/play-store/*.aab
          if-no-files-found: error
          retention-days: 30
