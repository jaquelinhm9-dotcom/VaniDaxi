name: Publicar descargas VaniDaxi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/downloads
          mkdir -p site/apps/VaniDaxi
          mkdir -p site/apps/VaniReparte
          mkdir -p site/apps/Panel-Principal

          cp index.html site/index.html
          cp web/VaniDaxi/index.html web/VaniDaxi/app-config.js web/VaniDaxi/supabase-client.js site/apps/VaniDaxi/
          cp web/VaniReparte/index.html web/VaniReparte/app-config.js web/VaniReparte/supabase-client.js site/apps/VaniReparte/
          cp web/Panel-Principal/index.html web/Panel-Principal/app-config.js web/Panel-Principal/supabase-client.js site/apps/Panel-Principal/

          cp downloads/VaniDaxi-2.1.apk site/downloads/VaniDaxi-2.1.apk
          cp downloads/VaniReparte-2.1.apk site/downloads/VaniReparte-2.1.apk
          cp downloads/VaniDaxi-Panel-2.1.apk site/downloads/VaniDaxi-Panel-2.1.apk

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
