name: VaniClean

on:
  push:
    branches: [rebuild-v1]
  workflow_dispatch:

concurrency:
  group: vani-clean-rebuild
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "1.0.0"
      APP_VERSION_CODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Generate Android projects
        run: bash scripts/build_android.sh

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          for (const file of [
            "web/VaniDaxi/index.html",
            "web/VaniReparte/index.html",
            "web/Panel-Principal/index.html"
          ]) {
            const html = fs.readFileSync(file, "utf8");
            for (const match of html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)) {
              if (!match[1].trim()) continue;
              new Function(match[1]);
            }
            console.log("JS OK:", file);
          }
          NODE

      - name: Build VaniDaxi
        run: gradle --no-daemon --stacktrace -p build/android/VaniDaxi assembleDebug

      - name: Build VaniReparte
        run: gradle --no-daemon --stacktrace -p build/android/VaniReparte assembleDebug

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/android/VaniDaxi/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi-1.0.apk
          cp build/android/VaniReparte/app/build/outputs/apk/debug/app-debug.apk dist/VaniReparte-1.0.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaniClean-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/apps/VaniDaxi site/apps/VaniReparte site/apps/Panel site/legal
          cp index.html site/index.html
          cp web/VaniDaxi/* site/apps/VaniDaxi/
          cp web/VaniReparte/* site/apps/VaniReparte/
          cp web/Panel-Principal/* site/apps/Panel/
          cp legal/*.html site/legal/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        