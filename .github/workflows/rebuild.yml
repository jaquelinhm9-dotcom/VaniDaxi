name: VaniClean
on:{push:{branches:[rebuild-v1]},workflow_dispatch:{}}
permissions:{contents:write,pages:write,id-token:write}
jobs:{build:{runs-on:ubuntu-latest,env:{APP_VERSION:"1.0.0",APP_VERSION_CODE:"1"},steps:[
{uses:"actions/checkout@v4"},
{uses:"actions/setup-java@v4",with:{distribution:"temurin",java-version:"17"}},
{uses:"gradle/actions/setup-gradle@v4",with:{gradle-version:"9.6.0"}},
{name:"Generate",run:"bash scripts/build_android.sh"},
{name:"Validate",run:"node -e "const fs=require('fs'); for(const f of ['web/VaniDaxi/index.html','web/VaniReparte/index.html','web/Panel-Principal/index.html']){const s=fs.readFileSync(f,'utf8'); for(const m of s.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)){if(m[1].trim())new Function(m[1])}; console.log('OK',f)}""},
{name:"Build VaniDaxi",run:"gradle --no-daemon -p build/android/VaniDaxi assembleDebug"},
{name:"Build VaniReparte",run:"gradle --no-daemon -p build/android/VaniReparte assembleDebug"},
{name:"Upload APKs",uses:"actions/upload-artifact@v4",with:{name:"VaniClean-APKs",path:"build/android/*/app/build/outputs/apk/debug/app-debug.apk"}},
{name:"Pages files",run:"mkdir -p site/apps/VaniDaxi site/apps/VaniReparte site/apps/Panel && cp web/VaniDaxi/* site/apps/VaniDaxi/ && cp web/VaniReparte/* site/apps/VaniReparte/ && cp web/Panel-Principal/* site/apps/Panel && cp index.html site/index.html"},
{uses:"actions/configure-pages@v5"},
{uses:"actions/upload-pages-artifact@v4",with:{path:"site"}},
{uses:"actions/deploy-pages@v4"}
]}}