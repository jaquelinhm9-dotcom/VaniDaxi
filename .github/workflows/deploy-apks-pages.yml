name: Publish VaniDaxi APK installer page

on:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - '.github/workflows/deploy-apks-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare installer page
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          test -f downloads/VaniDaxi.apk
          test -f downloads/VaniReparte.apk
          test -f downloads/VaniDaxi-Panel.apk
          cp downloads/VaniDaxi.apk site/VaniDaxi.apk
          cp downloads/VaniReparte.apk site/VaniReparte.apk
          cp downloads/VaniDaxi-Panel.apk site/VaniDaxi-Panel.apk
          cat > site/index.html <<'EOF'
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaniDaxi — Instalar aplicaciones</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f5f7fb;color:#13234a;margin:0;padding:28px}
main{max-width:520px;margin:auto}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#7b4be8,#2e6bf4,#1fc5b7);display:grid;place-items:center;color:#fff;font-weight:900;font-size:34px}
.card{background:#fff;border:1px solid #e3e8f1;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 8px 24px rgba(20,40,80,.08)}
h1{margin:14px 0 6px}h2{margin:0 0 4px}p{color:#71809a;line-height:1.5}
a{display:block;text-decoration:none;background:#173b8f;color:#fff;padding:14px 16px;border-radius:14px;font-weight:800;text-align:center;margin-top:12px}
small{color:#8a95a8}
</style>
</head>
<body>
<main>
<div class="logo">V</div>
<h1>Aplicaciones VaniDaxi</h1>
<p>Cada botón descarga únicamente la APK de la aplicación seleccionada.</p>
<div class="card"><h2>VaniDaxi</h2><small>Compradores y vendedores</small><a href="./VaniDaxi.apk" download>Descargar VaniDaxi.apk</a></div>
<div class="card"><h2>VaniReparte</h2><small>Repartidores</small><a href="./VaniReparte.apk" download>Descargar VaniReparte.apk</a></div>
<div class="card"><h2>VaniDaxi Panel</h2><small>Administración</small><a href="./VaniDaxi-Panel.apk" download>Descargar VaniDaxi-Panel.apk</a></div>
</main>
</body>
</html>
EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
