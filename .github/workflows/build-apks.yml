name: Build VaniDaxi APKs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          echo "SDKROOT=$SDKROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          test -n "$SDKMANAGER"
          test -f "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate Android projects
        run: bash scripts/build_android.sh

      - name: Build all three APKs
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "=== Java ==="
            java -version
            echo "=== Gradle ==="
            gradle --version
            echo "=== SDK ==="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "=== Generated files ==="
            find build/android -maxdepth 5 -type f | sort
            echo "=== VaniDaxi ==="
            gradle --no-daemon --stacktrace -p build/android/VaniDaxi assembleDebug
            E1=$?
            echo "VaniDaxi exit=$E1"
            echo "=== VaniReparte ==="
            gradle --no-daemon --stacktrace -p build/android/VaniReparte assembleDebug
            E2=$?
            echo "VaniReparte exit=$E2"
            echo "=== Panel ==="
            gradle --no-daemon --stacktrace -p build/android/Panel-Principal assembleDebug
            E3=$?
            echo "Panel exit=$E3"
            echo "=== APKs ==="
            find build/android -type f -name "*.apk" -print
            exit $((E1 || E2 || E3))
          } 2>&1 | tee diagnostics/build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-build-diagnostics
          path: diagnostics/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect APKs
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/android/VaniDaxi/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi.apk
          cp build/android/VaniReparte/app/build/outputs/apk/debug/app-debug.apk dist/VaniReparte.apk
          cp build/android/Panel-Principal/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi-Panel.apk
          sha256sum dist/*.apk
          ls -lh dist

      - name: Upload three APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-3-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent APK files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp dist/VaniDaxi.apk downloads/VaniDaxi.apk
          cp dist/VaniReparte.apk downloads/VaniReparte.apk
          cp dist/VaniDaxi-Panel.apk downloads/VaniDaxi-Panel.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/VaniDaxi.apk downloads/VaniReparte.apk downloads/VaniDaxi-Panel.apk
          git commit -m "Publicar APKs Android"
          git push origin HEAD:main

      - name: Prepare GitHub Pages installer site
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp dist/VaniDaxi.apk site/VaniDaxi.apk
          cp dist/VaniReparte.apk site/VaniReparte.apk
          cp dist/VaniDaxi-Panel.apk site/VaniDaxi-Panel.apk
          cat > site/index.html <<'EOF'
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaniDaxi — Instalación</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f5f7fb;color:#13234a;margin:0;padding:28px}
main{max-width:520px;margin:auto}
.card{background:#fff;border:1px solid #e3e8f1;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 8px 24px rgba(20,40,80,.08)}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#7b4be8,#2e6bf4,#1fc5b7);display:grid;place-items:center;color:#fff;font-weight:900;font-size:34px}
h1{margin:14px 0 6px}p{color:#71809a;line-height:1.5}
a{display:block;text-decoration:none;background:#173b8f;color:#fff;padding:14px 16px;border-radius:14px;font-weight:800;text-align:center;margin-top:12px}
small{color:#8a95a8}
</style>
</head>
<body>
<main>
<div class="logo">V</div>
<h1>Instalar VaniDaxi</h1>
<p>Descarga cada aplicación por separado. Estos enlaces apuntan directamente a cada archivo APK publicado en GitHub Pages.</p>
<div class="card"><h2>VaniDaxi</h2><small>Compradores y vendedores</small><a href="./VaniDaxi.apk" download>Descargar VaniDaxi.apk</a></div>
<div class="card"><h2>VaniReparte</h2><small>Aplicación para repartidores</small><a href="./VaniReparte.apk" download>Descargar VaniReparte.apk</a></div>
<div class="card"><h2>VaniDaxi Panel</h2><small>Panel de administración</small><a href="./VaniDaxi-Panel.apk" download>Descargar VaniDaxi-Panel.apk</a></div>
</main>
</body>
</html>
EOF

      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: success()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
