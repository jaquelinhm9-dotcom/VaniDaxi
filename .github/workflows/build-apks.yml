name: Build VaniDaxi public APKs 4.2

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-apk-build-4.2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "4.2.0"
      APP_VERSION_CODE: "42"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          echo "SDKROOT=$SDKROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          test -n "$SDKMANAGER"
          test -f "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate Android projects
        run: bash scripts/build_android.sh

      - name: Validate web JavaScript and Android source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          for(const f of ['web/VaniDaxi/index.html','web/VaniReparte/index.html','web/Panel-Principal/index.html']){
            const html=fs.readFileSync(f,'utf8');
            const scripts=[];
            const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            for(const m of html.matchAll(re)){
              if(/\bsrc\s*=/.test(m[1])) continue;
              scripts.push(m[2]);
            }
            const out='/tmp/'+f.replace(/[^a-z0-9]/gi,'_')+'.js';
            fs.writeFileSync(out,scripts.join('\n'));
            cp.execFileSync(process.execPath,['--check',out],{stdio:'inherit'});
            console.log('JS OK:',f);
          }
          const build=fs.readFileSync('scripts/build_android.sh','utf8');
          if(!build.includes('VaniReparte/index.html?v=4.1.0')) throw new Error('VaniReparte URL de Android incorrecta');
          if(!build.includes('VaniDaxi/index.html?v=4.1.0')) throw new Error('VaniDaxi URL de Android incorrecta');
          console.log('Android source URLs OK');
          NODE

      - name: Build public APKs
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "=== Java ==="
            java -version
            echo "=== Gradle ==="
            gradle --version
            echo "=== SDK ==="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "=== Generated files ==="
            find build/android -maxdepth 5 -type f | sort
            echo "=== VaniDaxi ==="
            gradle --no-daemon --stacktrace -p build/android/VaniDaxi assembleDebug
            E1=$?
            echo "VaniDaxi exit=$E1"
            echo "=== VaniReparte ==="
            gradle --no-daemon --stacktrace -p build/android/VaniReparte assembleDebug
            E2=$?
            echo "VaniReparte exit=$E2"
            echo "=== APKs ==="
            find build/android -type f -name "*.apk" -print
            exit $((E1 || E2))
          } 2>&1 | tee diagnostics/build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-build-diagnostics
          path: diagnostics/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect APKs
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/android/VaniDaxi/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi.apk
          cp build/android/VaniReparte/app/build/outputs/apk/debug/app-debug.apk dist/VaniReparte.apk
          sha256sum dist/*.apk
          ls -lh dist

      - name: Upload two public APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-public-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent APK files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          rm -f downloads/VaniDaxi-3.1.apk downloads/VaniReparte-3.1.apk downloads/VaniDaxi-3.1.apk downloads/VaniReparte-3.1.apk downloads/VaniDaxi-4.0.apk downloads/VaniReparte-4.0.apk downloads/VaniDaxi-4.1.apk downloads/VaniReparte-4.1.apk downloads/VaniDaxi-4.2.apk downloads/VaniReparte-4.2.apk
          cp dist/VaniDaxi.apk downloads/VaniDaxi.apk
          cp dist/VaniReparte.apk downloads/VaniReparte.apk
          cp dist/VaniDaxi.apk downloads/VaniDaxi-4.1.apk
          cp dist/VaniReparte.apk downloads/VaniReparte-4.1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A downloads
          git commit -m "Publicar APKs Android"
          git push origin HEAD:main

      - name: Prepare ChatGPT-download payloads
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf downloads/.payload
          mkdir -p downloads/.payload
          for f in VaniDaxi VaniReparte; do
            b64="downloads/.payload/$f.b64"
            base64 -w0 "dist/$f.apk" > "$b64"
            split -b 600k -d -a 3 "$b64" "${b64}.part."
            rm "$b64"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/.payload
          git commit -m "Preparar archivos APK para descarga directa"
          git push origin HEAD:main
      - name: Publish APK release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v4.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v4.1.0 dist/VaniDaxi.apk dist/VaniReparte.apk downloads/VaniDaxi-4.1.apk downloads/VaniReparte-4.1.apk --clobber --repo "$GITHUB_REPOSITORY"
          for asset in VaniDaxi-4.0.apk VaniReparte-4.0.apk; do
            gh release delete-asset v4.1.0 "$asset" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          done
          else
            gh release create v4.1.0 dist/VaniDaxi.apk dist/VaniReparte.apk \
              downloads/VaniDaxi-4.1.apk downloads/VaniReparte-4.1.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "VaniDaxi 4.2 aplicaciones públicas" \
              --notes "Instaladores APK 4.2 públicos de VaniDaxi y VaniReparte. El Panel empresarial continúa como herramienta web privada." \
              --latest
          fi
          for asset in VaniDaxi-4.0.apk VaniReparte-4.0.apk; do
            gh release delete-asset v4.1.0 "$asset" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          done

      - name: Show permanent download URL
        if: success()
        run: |
          echo "VaniDaxi: https://jaquelinhm9-dotcom.github.io/VaniDaxi/downloads/VaniDaxi-4.2.apk"
          echo "VaniReparte: https://jaquelinhm9-dotcom.github.io/VaniDaxi/downloads/VaniReparte-4.1.apk"
