name: Build VaniDaxi APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          command -v adb || true
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate Android projects
        run: bash scripts/build_android.sh

      - name: Build all three APKs
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "=== Java ==="
            java -version
            echo "=== Gradle ==="
            gradle --version
            echo "=== SDK ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            sdkmanager --list_installed | head -80
            echo "=== Generated files ==="
            find build/android -maxdepth 5 -type f | sort
            echo "=== VaniDaxi ==="
            gradle --no-daemon --stacktrace -p build/android/VaniDaxi assembleDebug
            E1=$?
            echo "VaniDaxi exit=$E1"
            echo "=== VaniReparte ==="
            gradle --no-daemon --stacktrace -p build/android/VaniReparte assembleDebug
            E2=$?
            echo "VaniReparte exit=$E2"
            echo "=== Panel ==="
            gradle --no-daemon --stacktrace -p build/android/Panel-Principal assembleDebug
            E3=$?
            echo "Panel exit=$E3"
            find build/android -type f -name "*.apk" -print
            exit $((E1 || E2 || E3))
          } 2>&1 | tee diagnostics/build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-build-diagnostics
          path: diagnostics/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect APKs
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/android/VaniDaxi/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi.apk
          cp build/android/VaniReparte/app/build/outputs/apk/debug/app-debug.apk dist/VaniReparte.apk
          cp build/android/Panel-Principal/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi-Panel.apk
          sha256sum dist/*.apk
          ls -lh dist

      - name: Upload three APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-3-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
