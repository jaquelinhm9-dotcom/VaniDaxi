name: Build APKs - VaniDaxi x3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate Android projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android dist

          create_app() {
            local dir="$1"
            local pkg="$2"
            local label="$3"
            local src="$4"
            local pkg_path
            pkg_path="$(echo "$pkg" | tr '.' '/')"

            mkdir -p "$dir/app/src/main/java/$pkg_path" \
                     "$dir/app/src/main/res/drawable" \
                     "$dir/app/src/main/assets/www"

            cat > "$dir/settings.gradle" <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = "VaniApp"
include(":app")
EOF

            cat > "$dir/build.gradle" <<'EOF'
plugins {
  id 'com.android.application' version '9.4.0' apply false
}
EOF

            cat > "$dir/app/build.gradle" <<'EOF'
plugins { id 'com.android.application' }

android {
  namespace '__PKG__'
  compileSdk 36

  defaultConfig {
    applicationId '__PKG__'
    minSdk 26
    targetSdk 36
    versionCode 1
    versionName '1.0.0'
  }

  buildTypes {
    debug { minifyEnabled false }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
EOF
            sed -i "s/__PKG__/$pkg/g" "$dir/app/build.gradle"

            cat > "$dir/app/src/main/AndroidManifest.xml" <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
  <uses-permission android:name="android.permission.INTERNET"/>
  <application
    android:allowBackup="false"
    android:usesCleartextTraffic="false"
    android:icon="@drawable/ic_launcher"
    android:roundIcon="@drawable/ic_launcher"
    android:label="__LABEL__"
    android:theme="@android:style/Theme.Material.Light.NoActionBar">
    <activity android:name=".MainActivity" android:exported="true">
      <intent-filter>
        <action android:name="android.intent.action.MAIN"/>
        <category android:name="android.intent.category.LAUNCHER"/>
      </intent-filter>
    </activity>
  </application>
</manifest>
EOF
            sed -i "s/__LABEL__/$label/g" "$dir/app/src/main/AndroidManifest.xml"

            cat > "$dir/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
<vector xmlns:android="http://schemas.android.com/apk/res/android"
  android:width="108dp" android:height="108dp"
  android:viewportWidth="108" android:viewportHeight="108">
  <path android:fillColor="#F28A18" android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/>
  <path android:fillColor="#FFFFFF" android:pathData="M35,76 L54,31 L73,76 L64,76 L59,64 L49,64 L44,76 Z"/>
  <path android:fillColor="#FFFFFF" android:pathData="M51,56 L57,56 L54,48 Z"/>
</vector>
EOF

            cat > "$dir/app/src/main/java/$pkg_path/MainActivity.java" <<'EOF'
package __PKG__;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebChromeClient;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.graphics.Color;

public class MainActivity extends Activity {
  @Override public void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);
    WebView web = new WebView(this);
    web.setBackgroundColor(Color.WHITE);
    web.getSettings().setJavaScriptEnabled(true);
    web.getSettings().setDomStorageEnabled(true);
    web.getSettings().setAllowFileAccess(true);
    web.getSettings().setAllowContentAccess(true);
    web.setWebViewClient(new WebViewClient());
    web.setWebChromeClient(new WebChromeClient());
    web.loadUrl("file:///android_asset/www/index.html");
    setContentView(web);
  }
}
EOF
            sed -i "s/__PKG__/$pkg/g" "$dir/app/src/main/java/$pkg_path/MainActivity.java"

            cp "$src/index.html" "$dir/app/src/main/assets/www/index.html"
            cp "$src/app-config.js" "$dir/app/src/main/assets/www/app-config.js"
            cp "$src/supabase-client.js" "$dir/app/src/main/assets/www/supabase-client.js"
            cat > "$dir/app/src/main/assets/www/manifest.webmanifest" <<'EOF'
{"name":"VaniApp","short_name":"VaniApp","start_url":"./index.html","display":"standalone"}
EOF
            cat > "$dir/app/src/main/assets/www/sw.js" <<'EOF'
self.addEventListener('install',()=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
EOF
            echo iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII= | base64 -d > "$dir/app/src/main/assets/www/icon-512.png"
          }

          create_app build/android/VaniDaxi com.vanidaxi.app VaniDaxi web/VaniDaxi
          create_app build/android/VaniReparte com.vanidaxi.reparte VaniReparte web/VaniReparte
          create_app build/android/Panel-Principal com.vanidaxi.admin "VaniDaxi Panel" web/Panel-Principal

      - name: Build all 3 APKs
        run: |
          gradle -p build/android/VaniDaxi assembleDebug
          gradle -p build/android/VaniReparte assembleDebug
          gradle -p build/android/Panel-Principal assembleDebug

      - name: Collect APKs
        run: |
          cp build/android/VaniDaxi/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi.apk
          cp build/android/VaniReparte/app/build/outputs/apk/debug/app-debug.apk dist/VaniReparte.apk
          cp build/android/Panel-Principal/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi-Panel.apk
          ls -lh dist

      - name: Upload 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-3-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
