name: Build VaniDaxi APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate Android projects
        run: bash scripts/build_android.sh

      - name: Verify generated projects
        run: |
          test -f build/android/VaniDaxi/app/src/main/AndroidManifest.xml
          test -f build/android/VaniReparte/app/src/main/AndroidManifest.xml
          test -f build/android/Panel-Principal/app/src/main/AndroidManifest.xml
          test -f build/android/VaniDaxi/app/src/main/assets/www/index.html
          test -f build/android/VaniReparte/app/src/main/assets/www/index.html
          test -f build/android/Panel-Principal/app/src/main/assets/www/index.html

      - name: Build VaniDaxi
        run: gradle --no-daemon --stacktrace -p build/android/VaniDaxi assembleDebug

      - name: Build VaniReparte
        run: gradle --no-daemon --stacktrace -p build/android/VaniReparte assembleDebug

      - name: Build Panel Principal
        run: gradle --no-daemon --stacktrace -p build/android/Panel-Principal assembleDebug

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/android/VaniDaxi/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi.apk
          cp build/android/VaniReparte/app/build/outputs/apk/debug/app-debug.apk dist/VaniReparte.apk
          cp build/android/Panel-Principal/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi-Panel.apk
          sha256sum dist/*.apk
          ls -lh dist

      - name: Upload three APKs
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-3-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
