name: Build VaniDaxi APKs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          echo "SDKROOT=$SDKROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          test -n "$SDKMANAGER"
          test -f "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate Android projects
        run: bash scripts/build_android.sh

      - name: Build all three APKs
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "=== Java ==="
            java -version
            echo "=== Gradle ==="
            gradle --version
            echo "=== SDK ==="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "=== Generated files ==="
            find build/android -maxdepth 5 -type f | sort
            echo "=== VaniDaxi ==="
            gradle --no-daemon --stacktrace -p build/android/VaniDaxi assembleDebug
            E1=$?
            echo "VaniDaxi exit=$E1"
            echo "=== VaniReparte ==="
            gradle --no-daemon --stacktrace -p build/android/VaniReparte assembleDebug
            E2=$?
            echo "VaniReparte exit=$E2"
            echo "=== Panel ==="
            gradle --no-daemon --stacktrace -p build/android/Panel-Principal assembleDebug
            E3=$?
            echo "Panel exit=$E3"
            echo "=== APKs ==="
            find build/android -type f -name "*.apk" -print
            exit $((E1 || E2 || E3))
          } 2>&1 | tee diagnostics/build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-build-diagnostics
          path: diagnostics/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect APKs
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/android/VaniDaxi/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi.apk
          cp build/android/VaniReparte/app/build/outputs/apk/debug/app-debug.apk dist/VaniReparte.apk
          cp build/android/Panel-Principal/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi-Panel.apk
          sha256sum dist/*.apk
          ls -lh dist

      - name: Upload three APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-3-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent APK files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp dist/VaniDaxi.apk downloads/VaniDaxi.apk
          cp dist/VaniReparte.apk downloads/VaniReparte.apk
          cp dist/VaniDaxi-Panel.apk downloads/VaniDaxi-Panel.apk
          cp dist/VaniDaxi.apk downloads/VaniDaxi-Actualizada.apk
          cp dist/VaniReparte.apk downloads/VaniReparte-Actualizada.apk
          cp dist/VaniDaxi-Panel.apk downloads/VaniDaxi-Panel-Actualizada.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/VaniDaxi.apk downloads/VaniReparte.apk downloads/VaniDaxi-Panel.apk downloads/VaniDaxi-Actualizada.apk downloads/VaniReparte-Actualizada.apk downloads/VaniDaxi-Panel-Actualizada.apk
          git commit -m "Publicar APKs Android"
          git push origin HEAD:main

      - name: Publish APK release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/VaniDaxi.apk dist/VaniReparte.apk dist/VaniDaxi-Panel.apk \
              downloads/VaniDaxi-Actualizada.apk downloads/VaniReparte-Actualizada.apk downloads/VaniDaxi-Panel-Actualizada.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.0.0 dist/VaniDaxi.apk dist/VaniReparte.apk dist/VaniDaxi-Panel.apk \
              downloads/VaniDaxi-Actualizada.apk downloads/VaniReparte-Actualizada.apk downloads/VaniDaxi-Panel-Actualizada.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "VaniDaxi APKs" \
              --notes "Instaladores APK de VaniDaxi, VaniReparte y VaniDaxi Panel." \
              --latest
          fi

      - name: Upload APKs to free direct-download host
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          VANI=$(curl -fsS -F "reqtype=fileupload" -F "fileToUpload=@dist/VaniDaxi.apk" https://catbox.moe/user/api.php)
          REPART=$(curl -fsS -F "reqtype=fileupload" -F "fileToUpload=@dist/VaniReparte.apk" https://catbox.moe/user/api.php)
          PANEL=$(curl -fsS -F "reqtype=fileupload" -F "fileToUpload=@dist/VaniDaxi-Panel.apk" https://catbox.moe/user/api.php)
          echo "VANI_URL=$VANI" >> "$GITHUB_ENV"
          echo "REPART_URL=$REPART" >> "$GITHUB_ENV"
          echo "PANEL_URL=$PANEL" >> "$GITHUB_ENV"
          echo "VaniDaxi=$VANI"
          echo "VaniReparte=$REPART"
          echo "Panel=$PANEL"

      - name: Show permanent download URL
        if: success()
        run: |
          echo "VaniDaxi: https://raw.githubusercontent.com/jaquelinhm9-dotcom/VaniDaxi/main/downloads/VaniDaxi-Actualizada.apk"
          echo "VaniReparte: https://raw.githubusercontent.com/jaquelinhm9-dotcom/VaniDaxi/main/downloads/VaniReparte-Actualizada.apk"
          echo "Panel: https://raw.githubusercontent.com/jaquelinhm9-dotcom/VaniDaxi/main/downloads/VaniDaxi-Panel-Actualizada.apk"
          echo "Catbox VaniDaxi: ${VANI_URL}"
          echo "Catbox VaniReparte: ${REPART_URL}"
          echo "Catbox Panel: ${PANEL_URL}"
