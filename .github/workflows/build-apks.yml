name: Build VaniDaxi APKs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          echo "SDKROOT=$SDKROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          test -n "$SDKMANAGER"
          test -f "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate Android projects
        run: bash scripts/build_android.sh

      - name: Build all three APKs
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "=== Java ==="
            java -version
            echo "=== Gradle ==="
            gradle --version
            echo "=== SDK ==="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "=== Generated files ==="
            find build/android -maxdepth 5 -type f | sort
            echo "=== VaniDaxi ==="
            gradle --no-daemon --stacktrace -p build/android/VaniDaxi assembleDebug
            E1=$?
            echo "VaniDaxi exit=$E1"
            echo "=== VaniReparte ==="
            gradle --no-daemon --stacktrace -p build/android/VaniReparte assembleDebug
            E2=$?
            echo "VaniReparte exit=$E2"
            echo "=== Panel ==="
            gradle --no-daemon --stacktrace -p build/android/Panel-Principal assembleDebug
            E3=$?
            echo "Panel exit=$E3"
            echo "=== APKs ==="
            find build/android -type f -name "*.apk" -print
            exit $((E1 || E2 || E3))
          } 2>&1 | tee diagnostics/build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-build-diagnostics
          path: diagnostics/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect APKs
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/android/VaniDaxi/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi.apk
          cp build/android/VaniReparte/app/build/outputs/apk/debug/app-debug.apk dist/VaniReparte.apk
          cp build/android/Panel-Principal/app/build/outputs/apk/debug/app-debug.apk dist/VaniDaxi-Panel.apk
          sha256sum dist/*.apk
          ls -lh dist

      - name: Upload three APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VaniDaxi-3-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare public download site
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp dist/VaniDaxi.apk site/VaniDaxi.apk
          cp dist/VaniReparte.apk site/VaniReparte.apk
          cp dist/VaniDaxi-Panel.apk site/VaniDaxi-Panel.apk
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>VaniDaxi — Descargas</title>
            <style>
              body{font-family:Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;color:#222}
              a{display:block;padding:16px 18px;margin:12px 0;border:1px solid #ddd;border-radius:12px;text-decoration:none;color:inherit}
              small{color:#666}
            </style>
          </head>
          <body>
            <h1>VaniDaxi</h1>
            <p>Descarga las aplicaciones Android:</p>
            <a href="VaniDaxi.apk" download><strong>VaniDaxi</strong><br><small>Aplicación para compradores y vendedores</small></a>
            <a href="VaniReparte.apk" download><strong>VaniReparte</strong><br><small>Aplicación para repartidores</small></a>
            <a href="VaniDaxi-Panel.apk" download><strong>Panel Principal VaniDaxi</strong><br><small>Panel administrativo</small></a>
          </body>
          </html>
          HTML

      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        if: success()
        id: pages
        uses: actions/deploy-pages@v4

      - name: Show permanent download URL
        if: success()
        run: |
          echo "URL pública: https://jaquelinhm9-dotcom.github.io/VaniDaxi/"
          echo "VaniDaxi: https://jaquelinhm9-dotcom.github.io/VaniDaxi/VaniDaxi.apk"
          echo "VaniReparte: https://jaquelinhm9-dotcom.github.io/VaniDaxi/VaniReparte.apk"
          echo "Panel: https://jaquelinhm9-dotcom.github.io/VaniDaxi/VaniDaxi-Panel.apk"
